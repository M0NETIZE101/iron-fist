<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>IRON FIST - CINEMATIC BATTLE</title>
    
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wght@0,100..900;1,100..900&family=Geist:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Geist', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            box-shadow: 0 0 60px rgba(255, 179, 178, 0.15);
            border: 1px solid rgba(255, 179, 178, 0.2);
        }
        
        /* Cinematic Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
            transition: opacity 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        
        .loading-logo {
            font-family: 'Anybody', monospace;
            font-size: 48px;
            font-weight: 900;
            font-style: italic;
            color: #ffb3b2;
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-bottom: 40px;
            text-shadow: 0 0 30px rgba(255, 179, 178, 0.5);
        }
        
        .loading-sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #5f3e3e;
            letter-spacing: 4px;
            margin-top: 20px;
        }
        
        .loading-bar-container {
            width: 400px;
            height: 1px;
            background: rgba(255, 179, 178, 0.2);
            overflow: hidden;
        }
        
        .loading-bar {
            width: 0%;
            height: 100%;
            background: #ffb3b2;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px #ffb3b2;
        }
        
        /* Minimal Controls Overlay */
        .controls-info {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-left: 2px solid #ffb3b2;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: rgba(233, 188, 186, 0.6);
            letter-spacing: 1px;
            z-index: 100;
            pointer-events: none;
        }
        
        .controls-info span {
            color: #ffb3b2;
        }
        
        .controls-info .key {
            border: 1px solid rgba(255, 179, 178, 0.3);
            padding: 2px 6px;
            margin: 0 2px;
            font-size: 10px;
        }
        
        /* Minimal Back Button */
        .back-button {
            position: fixed;
            top: 30px;
            left: 30px;
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border: 1px solid rgba(255, 179, 178, 0.3);
            color: #e9bcba;
            text-decoration: none;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 1px;
            z-index: 100;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-button:hover {
            border-color: #ffb3b2;
            color: #ffb3b2;
            transform: translateX(-4px);
        }
        
        /* VS Screen Animation - Cinematic */
        @keyframes vsFadeIn {
            0% { opacity: 0; transform: scale(0.95); letter-spacing: 20px; }
            100% { opacity: 0.15; transform: scale(1); letter-spacing: 4px; }
        }
    </style>
</head>
<body>
    <a href="characterselect.html" class="back-button">
        <span class="material-symbols-outlined" style="font-size: 14px;">close</span>
        EXIT
    </a>
    
    <div class="controls-info">
        <span>⟵ ⟶</span> MOVE &nbsp;&nbsp;|&nbsp;&nbsp; <span>A</span> LIGHT &nbsp;&nbsp;|&nbsp;&nbsp; <span>S</span> HEAVY &nbsp;&nbsp;|&nbsp;&nbsp; <span>D</span> FOCUS
    </div>
    
    <div id="loading-screen">
        <div class="loading-logo">IRON FIST</div>
        <div class="loading-bar-container">
            <div class="loading-bar"></div>
        </div>
        <div class="loading-sub">LOADING COMBAT SEQUENCE</div>
    </div>
    
    <div id="game-container"></div>

    <script>
        // Get selected fighter from URL
        const urlParams = new URLSearchParams(window.location.search);
        const playerFighter = urlParams.get('fighter') || 'KAIRO';
        
        // Fighter Database - matches website aesthetic
        const fighters = {
            'KAIRO': { name: 'KAIRO', title: 'CYBERNETIC MONK', power: 88, speed: 94, defense: 78, color: 0xff3b3b, accent: 0xffb3b2, bio: 'Rogue AI in a master monk\'s body' },
            'SILAS': { name: 'SILAS', title: 'IRON COLOSSUS', power: 95, speed: 58, defense: 92, color: 0x6c6c6c, accent: 0xaaaaaa, bio: 'Unstoppable war machine' },
            'MIRA': { name: 'MIRA', title: 'PHANTOM BLADE', power: 72, speed: 96, defense: 68, color: 0x8b5cf6, accent: 0xa78bfa, bio: 'Shadow assassin' },
            'AXEL': { name: 'AXEL', title: 'NEO GLADIATOR', power: 91, speed: 67, defense: 82, color: 0xf59e0b, accent: 0xfbbf24, bio: 'Arena champion' },
            'NYX': { name: 'NYX', title: 'VOID WEAVER', power: 64, speed: 79, defense: 88, color: 0x14b8a6, accent: 0x5eead4, bio: 'Reality bender' },
            'ZERO': { name: 'ZERO', title: 'PROTOCOL-X', power: 90, speed: 91, defense: 75, color: 0x00dbe9, accent: 0x7df4ff, bio: 'Experimental AI' }
        };
        
        const playerData = fighters[playerFighter] || fighters['KAIRO'];
        const cpuData = fighters['ZERO'];
        
        // Phaser Config - Cinematic 16:9
        const config = {
            type: Phaser.AUTO,
            width: 1280,
            height: 720,
            parent: 'game-container',
            backgroundColor: '#050505',
            physics: {
                default: 'arcade',
                arcade: { gravity: { y: 0 }, debug: false }
            },
            scene: { preload: preload, create: create, update: update },
            scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH }
        };
        
        // Game State
        let player, cpu;
        let playerHealth = 100;
        let cpuHealth = 100;
        let playerStamina = 100;
        let playerFocus = 0;
        let healthBarPlayer, healthBarCPU, focusBar;
        let roundActive = true;
        let attackCooldown = 0;
        let focusCooldown = 0;
        let lastHitTime = 0;
        let cinematicCamera;
        
        // Visual Effects
        let bloodParticles;
        let impactFlash;
        let damageNumbers = [];
        
        // UI Elements
        let playerNameDisplay, playerTitleDisplay, cpuNameDisplay, cpuTitleDisplay;
        let roundTimer = 99;
        let timerText;
        let roundOverlay;
        
        function preload() {
            // Loading progress
            const loadingBar = document.querySelector('.loading-bar');
            this.load.on('progress', (v) => { if(loadingBar) loadingBar.style.width = `${v * 100}%`; });
            this.load.on('complete', () => {
                const ls = document.getElementById('loading-screen');
                if(ls) { ls.style.opacity = '0'; setTimeout(() => ls.style.display = 'none', 800); }
            });
            
            // Cinematic Background - Dark cyberpunk dojo
            this.load.image('bg', 'https://placehold.co/1280x720/0a0a0a/ffb3b2?text=NEO-DOJO');
            
            // Particle textures
            this.load.image('particle', 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==');
        }
        
        function create() {
            // Cinematic letterbox effect
            const topBar = this.add.rectangle(0, 0, 1280, 40, 0x000000);
            topBar.setAlpha(0.8);
            const bottomBar = this.add.rectangle(0, 680, 1280, 40, 0x000000);
            bottomBar.setAlpha(0.8);
            
            // Atmospheric background
            const bg = this.add.image(640, 360, 'bg');
            bg.setDisplaySize(1280, 720);
            bg.setAlpha(0.6);
            
            // Atmospheric fog/gradient
            const fogGradient = this.add.graphics();
            fogGradient.fillGradientStyle(0x000000, 0x000000, 0x1a0000, 0x0a0000, 1);
            fogGradient.fillRect(0, 0, 1280, 720);
            fogGradient.setAlpha(0.4);
            
            // Floor reflection
            const floorReflect = this.add.rectangle(640, 600, 1280, 120, 0x0a0a0a);
            floorReflect.setAlpha(0.5);
            
            // === PLAYER CHARACTER (Left) ===
            player = this.add.rectangle(280, 520, 55, 95, playerData.color);
            player.setStrokeStyle(2, playerData.accent);
            player.setAlpha(0.95);
            
            // Character aura
            const playerAura = this.add.rectangle(280, 520, 90, 130, playerData.color);
            playerAura.setAlpha(0.08);
            
            // Player name plaque
            playerNameDisplay = this.add.text(280, 400, playerData.name, {
                fontFamily: 'Anybody',
                fontSize: '20px',
                color: '#ffb3b2',
                fontStyle: 'bold italic'
            }).setOrigin(0.5);
            
            playerTitleDisplay = this.add.text(280, 420, playerData.title, {
                fontFamily: 'JetBrains Mono',
                fontSize: '9px',
                color: '#5f3e3e',
                letterSpacing: '2px'
            }).setOrigin(0.5);
            
            // === CPU CHARACTER (Right) ===
            cpu = this.add.rectangle(1000, 520, 55, 95, cpuData.color);
            cpu.setStrokeStyle(2, cpuData.accent);
            cpu.setAlpha(0.95);
            
            const cpuAura = this.add.rectangle(1000, 520, 90, 130, cpuData.color);
            cpuAura.setAlpha(0.08);
            
            cpuNameDisplay = this.add.text(1000, 400, cpuData.name, {
                fontFamily: 'Anybody',
                fontSize: '20px',
                color: '#00dbe9',
                fontStyle: 'bold italic'
            }).setOrigin(0.5);
            
            cpuTitleDisplay = this.add.text(1000, 420, cpuData.title, {
                fontFamily: 'JetBrains Mono',
                fontSize: '9px',
                color: '#5f3e3e',
                letterSpacing: '2px'
            }).setOrigin(0.5);
            
            // === HEALTH SYSTEM ===
            // Health bar containers (minimal, elegant)
            const healthContainer = this.add.graphics();
            healthContainer.lineStyle(1, 0xffb3b2, 0.3);
            healthContainer.strokeRect(80, 50, 350, 4);
            healthContainer.strokeRect(850, 50, 350, 4);
            
            healthBarPlayer = this.add.rectangle(255, 52, 350, 4, playerData.color);
            healthBarPlayer.setOrigin(0, 0.5);
            
            healthBarCPU = this.add.rectangle(1025, 52, 350, 4, cpuData.color);
            healthBarCPU.setOrigin(0, 0.5);
            
            // Health numbers
            this.add.text(80, 60, `${playerData.name}`, { fontFamily: 'JetBrains Mono', fontSize: '9px', color: '#ffb3b2', letterSpacing: '1px' });
            this.add.text(850, 60, `${cpuData.name}`, { fontFamily: 'JetBrains Mono', fontSize: '9px', color: '#00dbe9', letterSpacing: '1px' });
            
            // Focus Meter (special)
            const focusContainer = this.add.graphics();
            focusContainer.lineStyle(1, 0xffb3b2, 0.2);
            focusContainer.strokeRect(540, 70, 200, 2);
            
            focusBar = this.add.rectangle(540, 71, 0, 2, 0xffb3b2);
            focusBar.setOrigin(0, 0.5);
            
            // Timer
            timerText = this.add.text(640, 45, '99', {
                fontFamily: 'JetBrains Mono',
                fontSize: '28px',
                color: '#e9bcba',
                letterSpacing: '4px'
            }).setOrigin(0.5);
            
            // VS Overlay (cinematic)
            roundOverlay = this.add.text(640, 360, 'VS', {
                fontFamily: 'Anybody',
                fontSize: '120px',
                color: '#ffb3b2',
                fontStyle: 'italic',
                fontWeight: '900'
            }).setOrigin(0.5);
            roundOverlay.setAlpha(0.08);
            roundOverlay.setAngle(-5);
            
            // Input
            const keyA = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.A);
            const keyS = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.S);
            const keyD = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.D);
            const keyLeft = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.LEFT);
            const keyRight = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.RIGHT);
            
            keyA.on('down', () => this.lightAttack());
            keyS.on('down', () => this.heavyAttack());
            keyD.on('down', () => this.focusAttack());
            keyLeft.on('down', () => this.movePlayer('left'));
            keyRight.on('down', () => this.movePlayer('right'));
            
            // Timer countdown
            this.time.addEvent({
                delay: 1000,
                callback: () => { if(roundActive && roundTimer > 0) { roundTimer--; timerText.setText(roundTimer.toString().padStart(2, '0')); if(roundTimer === 0) this.endGame('time'); } },
                loop: true
            });
            
            // CPU AI
            this.time.addEvent({ delay: 600, callback: () => this.cpuAction(), loop: true });
            
            // Store references
            this.player = player;
            this.cpu = cpu;
            this.playerAura = playerAura;
            this.cpuAura = cpuAura;
            this.focusBar = focusBar;
            
            // Create impact effect system
            this.impactFlash = this.add.rectangle(640, 360, 1280, 720, 0xffffff);
            this.impactFlash.setAlpha(0);
            
            // Start fight announcement
            this.time.delayedCall(2000, () => {
                this.tweens.add({ targets: roundOverlay, alpha: 0, duration: 1500 });
            });
        }
        
        function update() {
            if(!roundActive) return;
            
            // Cooldowns
            if(attackCooldown > 0) attackCooldown--;
            if(focusCooldown > 0) focusCooldown--;
            
            // Focus regeneration
            if(playerFocus < 100) {
                playerFocus = Math.min(100, playerFocus + 0.5);
                focusBar.width = 200 * (playerFocus / 100);
            }
            
            // Aura following
            this.playerAura.setPosition(player.x, player.y);
            this.cpuAura.setPosition(cpu.x, cpu.y);
            
            // Name plaques follow
            playerNameDisplay.setPosition(player.x, player.y - 70);
            playerTitleDisplay.setPosition(player.x, player.y - 55);
            cpuNameDisplay.setPosition(cpu.x, cpu.y - 70);
            cpuTitleDisplay.setPosition(cpu.x, cpu.y - 55);
            
            // Boundaries
            player.x = Math.min(Math.max(player.x, 180), 520);
            cpu.x = Math.min(Math.max(cpu.x, 760), 1100);
            
            // Collision prevention
            if(Math.abs(player.x - cpu.x) < 70) {
                if(player.x < cpu.x) player.x = cpu.x - 70;
                else cpu.x = player.x + 70;
            }
        }
        
        function movePlayer(direction) {
            if(!roundActive) return;
            if(direction === 'left') player.x -= 18;
            else if(direction === 'right') player.x += 18;
        }
        
        function lightAttack() {
            if(!roundActive || attackCooldown > 0) return;
            
            const distance = Math.abs(player.x - cpu.x);
            const canHit = distance < 85;
            
            // Attack animation
            this.tweens.add({
                targets: player,
                x: player.x + (canHit ? 25 : 15),
                duration: 50,
                yoyo: true,
                ease: 'Power2'
            });
            
            if(canHit) {
                const damage = Math.floor(7 * (playerData.power / 100));
                cpuHealth = Math.max(0, cpuHealth - damage);
                attackCooldown = 20;
                this.applyHitEffect(cpu, damage, 'light');
                
                this.updateHealthBars();
                
                if(cpuHealth <= 0) this.endGame('player');
            }
        }
        
        function heavyAttack() {
            if(!roundActive || attackCooldown > 0) return;
            
            const distance = Math.abs(player.x - cpu.x);
            const canHit = distance < 75;
            
            this.tweens.add({
                targets: player,
                scaleX: 1.2,
                duration: 80,
                yoyo: true,
                ease: 'Back'
            });
            
            if(canHit) {
                const damage = Math.floor(13 * (playerData.power / 100));
                cpuHealth = Math.max(0, cpuHealth - damage);
                attackCooldown = 32;
                this.applyHitEffect(cpu, damage, 'heavy');
                
                this.updateHealthBars();
                
                if(cpuHealth <= 0) this.endGame('player');
            }
        }
        
        function focusAttack() {
            if(!roundActive || focusCooldown > 0 || playerFocus < 100) return;
            
            const distance = Math.abs(player.x - cpu.x);
            const canHit = distance < 100;
            
            if(canHit) {
                const damage = Math.floor(22 * (playerData.power / 100));
                cpuHealth = Math.max(0, cpuHealth - damage);
                playerFocus = 0;
                focusCooldown = 45;
                focusBar.width = 0;
                
                // Cinematic hit effect
                this.cameras.main.shake(150, 0.005);
                this.tweens.add({
                    targets: this.impactFlash,
                    alpha: 0.25,
                    duration: 60,
                    yoyo: true
                });
                
                this.applyHitEffect(cpu, damage, 'focus');
                this.updateHealthBars();
                
                if(cpuHealth <= 0) this.endGame('player');
            }
        }
        
        function applyHitEffect(target, damage, type) {
            // Screen shake
            this.cameras.main.shake(80, 0.003);
            
            // Hit flash on target
            target.setAlpha(0.6);
            this.time.delayedCall(100, () => target.setAlpha(0.95));
            
            // Damage number (subtle)
            const dmgText = this.add.text(target.x, target.y - 30, `${damage}`, {
                fontFamily: 'JetBrains Mono',
                fontSize: '14px',
                color: type === 'focus' ? '#ffb3b2' : '#e9bcba'
            }).setOrigin(0.5);
            
            this.tweens.add({
                targets: dmgText,
                y: dmgText.y - 40,
                alpha: 0,
                duration: 600,
                onComplete: () => dmgText.destroy()
            });
            
            // Pushback
            if(target === cpu) target.x += 25;
            else target.x -= 25;
        }
        
        function cpuAction() {
            if(!roundActive) return;
            
            const distance = Math.abs(cpu.x - player.x);
            
            if(distance > 110) {
                if(cpu.x < player.x) cpu.x += 14;
                else cpu.x -= 14;
            } else {
                const action = Math.random();
                if(action < 0.35 && attackCooldown === 0) {
                    const damage = Math.floor(9 * 0.85);
                    playerHealth = Math.max(0, playerHealth - damage);
                    attackCooldown = 22;
                    this.applyHitEffect(player, damage, 'light');
                    this.updateHealthBars();
                    
                    if(playerHealth <= 0) this.endGame('cpu');
                } else if(action < 0.55 && playerFocus >= 100 && focusCooldown === 0) {
                    const damage = Math.floor(20 * 0.85);
                    playerHealth = Math.max(0, playerHealth - damage);
                    playerFocus = 0;
                    focusCooldown = 45;
                    this.applyHitEffect(player, damage, 'focus');
                    this.updateHealthBars();
                    
                    if(playerHealth <= 0) this.endGame('cpu');
                }
            }
        }
        
        function updateHealthBars() {
            const playerPercent = playerHealth / 100;
            const cpuPercent = cpuHealth / 100;
            
            healthBarPlayer.width = 350 * playerPercent;
            healthBarCPU.width = 350 * cpuPercent;
            
            // Low health warning
            if(playerHealth < 25) healthBarPlayer.setFillStyle(0xff3b3b);
            if(cpuHealth < 25) healthBarCPU.setFillStyle(0xff3b3b);
        }
        
        function endGame(winner) {
            roundActive = false;
            
            const resultText = winner === 'player' ? `${playerData.name} WINS` : `${cpuData.name} WINS`;
            const resultColor = winner === 'player' ? '#ffb3b2' : '#00dbe9';
            
            const announcement = this.add.text(640, 360, resultText, {
                fontFamily: 'Anybody',
                fontSize: '48px',
                color: resultColor,
                fontStyle: 'bold italic',
                letterSpacing: '4px'
            }).setOrigin(0.5);
            announcement.setAlpha(0);
            announcement.setScale(0.8);
            
            this.tweens.add({
                targets: announcement,
                alpha: 1,
                scale: 1,
                duration: 600,
                ease: 'Back'
            });
            
            // Return to roster after delay
            this.time.delayedCall(4000, () => {
                window.location.href = 'characterselect.html';
            });
        }
        
        const game = new Phaser.Game(config);
    </script>
</body>
</html>
