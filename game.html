<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>IRON FIST - BATTLE ARENA</title>
    
    <!-- Phaser 3 Framework -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wght@0,100..900;1,100..900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
        }
        
        /* Game Container */
        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(255, 179, 178, 0.3);
            border: 2px solid #ffb3b2;
            border-radius: 8px;
        }
        
        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #131313;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        
        .loading-text {
            font-family: 'Anybody', monospace;
            font-size: 24px;
            color: #ffb3b2;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }
        
        .loading-bar {
            width: 300px;
            height: 4px;
            background: #2a2a2a;
            overflow: hidden;
        }
        
        .loading-progress {
            width: 0%;
            height: 100%;
            background: #ffb3b2;
            transition: width 0.3s ease;
        }
        
        /* Controls Overlay */
        .controls-info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 8px;
            border-left: 3px solid #ffb3b2;
            font-size: 12px;
            color: #e9bcba;
            z-index: 100;
            pointer-events: none;
        }
        
        .controls-info span {
            color: #ffb3b2;
            font-weight: bold;
        }
        
        /* Back Button */
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #ffb3b2;
            color: #ffb3b2;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            z-index: 100;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-button:hover {
            background: #ffb3b2;
            color: #680012;
            transform: scale(1.05);
        }
        
        /* VS Screen Animation */
        @keyframes vsPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; text-shadow: 0 0 20px #ffb3b2; }
            50% { transform: scale(1.2); opacity: 1; text-shadow: 0 0 50px #ff525c; }
        }
    </style>
</head>
<body>
    <a href="characterselect.html" class="back-button">
        <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
        BACK TO ROSTER
    </a>
    
    <div class="controls-info">
        🎮 <span>PLAYER 1</span> | ← → : MOVE | A : PUNCH | S : KICK | D : SPECIAL<br>
        🤖 <span>CPU</span> | AI CONTROLLED
    </div>
    
    <div id="loading-screen">
        <div class="loading-text">LOADING ARENA</div>
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
        <div style="margin-top: 20px; font-size: 12px; color: #5f3e3e;">IRON FIST | FIGHT!</div>
    </div>
    
    <div id="game-container"></div>

    <script>
        // Get selected fighter from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const playerFighter = urlParams.get('fighter') || 'KAIRO';
        
        // Fighter stats mapping
        const fighterStats = {
            'KAIRO': { name: 'KAIRO', power: 88, speed: 94, range: 42, color: 0xff5252, accent: 0xffb3b2 },
            'SILAS': { name: 'SILAS', power: 95, speed: 58, range: 35, color: 0x6b6b6b, accent: 0xaaaaaa },
            'MIRA': { name: 'MIRA', power: 72, speed: 96, range: 68, color: 0x9b59b6, accent: 0xd4a5ff },
            'AXEL': { name: 'AXEL', power: 91, speed: 67, range: 44, color: 0xe67e22, accent: 0xf39c12 },
            'NYX': { name: 'NYX', power: 64, speed: 79, range: 92, color: 0x1abc9c, accent: 0x48c9b0 },
            'ZERO': { name: 'ZERO', power: 90, speed: 91, range: 78, color: 0x00dbe9, accent: 0x7df4ff }
        };
        
        const selectedStats = fighterStats[playerFighter] || fighterStats['KAIRO'];
        
        // Phaser Game Configuration
        const config = {
            type: Phaser.AUTO,
            width: 1280,
            height: 720,
            parent: 'game-container',
            backgroundColor: '#0a0a0a',
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 0 },
                    debug: false
                }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            },
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH
            }
        };
        
        // Game variables
        let player;
        let cpu;
        let playerHealth = 100;
        let cpuHealth = 100;
        let healthBarPlayer;
        let healthBarCPU;
        let healthBarPlayerBg;
        let healthBarCPUBg;
        let roundText;
        let roundActive = true;
        let winnerText;
        let playerCanAct = true;
        let attackCooldown = 0;
        let specialCooldown = 0;
        let specialMeter = 0;
        let specialMeterBar;
        let comboText;
        let comboCount = 0;
        let comboTimeout;
        
        // Attack timing
        let lastAttackTime = 0;
        const ATTACK_DELAY = 500;
        
        // Background elements
        let background;
        let ground;
        
        // UI Text
        let playerNameText;
        let cpuNameText;
        
        // Animation flags
        let hitEffectTimer = 0;
        
        function preload() {
            // Show loading progress
            const progressBar = document.querySelector('.loading-progress');
            
            this.load.on('progress', (value) => {
                if (progressBar) progressBar.style.width = `${value * 100}%`;
            });
            
            this.load.on('complete', () => {
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                    }, 500);
                }
            });
            
            // Create placeholder graphics (since we don't have actual sprites yet)
            // In production, replace with actual sprite sheets
            this.load.image('bg', 'https://placehold.co/1280x720/1a1a2e/ffb3b2?text=IRON+FIST+ARENA');
            this.load.image('ground', 'https://placehold.co/1280x100/2a2a2a/ffb3b2?text=──────────');
        }
        
        function create() {
            // Background
            background = this.add.image(640, 360, 'bg');
            background.setDisplaySize(1280, 720);
            
            // Ground/platform
            ground = this.add.rectangle(640, 600, 1280, 120, 0x1a1a1a);
            ground.setStrokeStyle(2, 0xffb3b2);
            
            // Add some arena details
            const arenaText = this.add.text(640, 50, 'IRON FIST ARENA', {
                fontFamily: 'Anybody',
                fontSize: '24px',
                color: '#ffb3b2',
                fontStyle: 'italic'
            }).setOrigin(0.5);
            
            // Create VS text effect
            const vsText = this.add.text(640, 300, 'VS', {
                fontFamily: 'Anybody',
                fontSize: '64px',
                color: '#ff525c',
                fontStyle: 'bold italic'
            }).setOrigin(0.5);
            vsText.setAlpha(0.3);
            
            // === PLAYER (Left side) ===
            player = this.add.rectangle(300, 520, 60, 100, selectedStats.color);
            player.setStrokeStyle(3, selectedStats.accent);
            player.setInteractive();
            
            // Player aura glow effect
            const playerGlow = this.add.rectangle(300, 520, 80, 120, selectedStats.color);
            playerGlow.setAlpha(0.2);
            
            // Player name tag
            playerNameText = this.add.text(300, 420, selectedStats.name, {
                fontFamily: 'JetBrains Mono',
                fontSize: '18px',
                color: '#ffb3b2',
                fontStyle: 'bold'
            }).setOrigin(0.5);
            
            // === CPU (Right side) ===
            cpu = this.add.rectangle(980, 520, 60, 100, 0x00dbe9);
            cpu.setStrokeStyle(3, 0x7df4ff);
            
            // CPU aura
            const cpuGlow = this.add.rectangle(980, 520, 80, 120, 0x00dbe9);
            cpuGlow.setAlpha(0.2);
            
            // CPU name tag
            cpuNameText = this.add.text(980, 420, 'ZERO', {
                fontFamily: 'JetBrains Mono',
                fontSize: '18px',
                color: '#00dbe9',
                fontStyle: 'bold'
            }).setOrigin(0.5);
            
            // === HEALTH BARS ===
            // Player Health Bar (top left)
            healthBarPlayerBg = this.add.rectangle(200, 60, 400, 25, 0x333333);
            healthBarPlayerBg.setStrokeStyle(2, 0xffb3b2);
            healthBarPlayer = this.add.rectangle(200, 60, 400, 25, selectedStats.color);
            
            // Player HP Text
            this.add.text(200, 60, `${selectedStats.name.toUpperCase()}`, {
                fontFamily: 'JetBrains Mono',
                fontSize: '12px',
                color: '#ffb3b2'
            }).setOrigin(0.5);
            
            // CPU Health Bar (top right)
            healthBarCPUBg = this.add.rectangle(1080, 60, 400, 25, 0x333333);
            healthBarCPUBg.setStrokeStyle(2, 0x00dbe9);
            healthBarCPU = this.add.rectangle(1080, 60, 400, 25, 0x00dbe9);
            
            this.add.text(1080, 60, 'ZERO', {
                fontFamily: 'JetBrains Mono',
                fontSize: '12px',
                color: '#00dbe9'
            }).setOrigin(0.5);
            
            // === SPECIAL METER ===
            specialMeterBar = this.add.rectangle(640, 110, 400, 15, 0x333333);
            specialMeterBar.setStrokeStyle(1, 0xffb3b2);
            
            const specialFill = this.add.rectangle(640, 110, 0, 15, 0xffb3b2);
            specialFill.setAlpha(0.8);
            
            // Round indicator
            roundText = this.add.text(640, 160, 'ROUND 1', {
                fontFamily: 'Anybody',
                fontSize: '28px',
                color: '#ffb3b2',
                fontStyle: 'bold italic'
            }).setOrigin(0.5);
            roundText.setAlpha(0.8);
            
            // Combo text
            comboText = this.add.text(640, 200, '', {
                fontFamily: 'Anybody',
                fontSize: '24px',
                color: '#ff525c',
                fontStyle: 'bold'
            }).setOrigin(0.5);
            comboText.setAlpha(0);
            
            // Winner announcement
            winnerText = this.add.text(640, 350, '', {
                fontFamily: 'Anybody',
                fontSize: '48px',
                color: '#ffb3b2',
                fontStyle: 'bold italic'
            }).setOrigin(0.5);
            winnerText.setAlpha(0);
            
            // Input keys
            const keyA = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.A);
            const keyS = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.S);
            const keyD = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.D);
            
            // Movement keys
            const keyLeft = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.LEFT);
            const keyRight = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.RIGHT);
            
            // Attack handlers
            keyA.on('down', () => this.attack('light'));
            keyS.on('down', () => this.attack('heavy'));
            keyD.on('down', () => this.specialAttack());
            
            // Movement handlers
            keyLeft.on('down', () => this.movePlayer('left'));
            keyRight.on('down', () => this.movePlayer('right'));
            
            // Store references for update function
            this.player = player;
            this.cpu = cpu;
            this.playerGlow = playerGlow;
            this.cpuGlow = cpuGlow;
            this.specialFill = specialFill;
            
            // Store attack function context
            this.attackFn = (type) => this.attack(type);
            this.specialFn = () => this.specialAttack();
            this.moveFn = (dir) => this.movePlayer(dir);
            
            // Start AI loop
            this.time.addEvent({
                delay: 800,
                callback: this.cpuAction,
                callbackScope: this,
                loop: true
            });
            
            // Update meters UI
            this.updateMeters();
        }
        
        function update() {
            if (!roundActive) return;
            
            // Update hit effect timer
            if (hitEffectTimer > 0) {
                hitEffectTimer--;
                if (hitEffectTimer === 0) {
                    this.playerGlow.setAlpha(0.2);
                    this.cpuGlow.setAlpha(0.2);
                }
            }
            
            // Update cooldowns
            if (attackCooldown > 0) attackCooldown--;
            if (specialCooldown > 0) specialCooldown--;
            
            // Gradually increase special meter
            if (specialMeter < 100 && roundActive) {
                specialMeter += 0.3;
                if (specialMeter > 100) specialMeter = 100;
                this.updateMeters();
            }
            
            // Smooth following of glow to player position
            if (this.playerGlow) {
                this.playerGlow.x = player.x;
                this.playerGlow.y = player.y;
            }
            if (this.cpuGlow) {
                this.cpuGlow.x = cpu.x;
                this.cpuGlow.y = cpu.y;
            }
            
            // Update name positions
            playerNameText.setPosition(player.x, player.y - 70);
            cpuNameText.setPosition(cpu.x, cpu.y - 70);
            
            // Boundary limits
            player.x = Math.min(Math.max(player.x, 150), 500);
            cpu.x = Math.min(Math.max(cpu.x, 780), 1130);
            
            // Check distance - don't let them overlap
            if (Math.abs(player.x - cpu.x) < 70) {
                if (player.x < cpu.x) {
                    player.x = cpu.x - 70;
                } else {
                    cpu.x = player.x + 70;
                }
            }
        }
        
        function movePlayer(direction) {
            if (!roundActive || !playerCanAct) return;
            
            if (direction === 'left') {
                player.x -= 25;
            } else if (direction === 'right') {
                player.x += 25;
            }
            
            // Boundary limits
            player.x = Math.min(Math.max(player.x, 150), 500);
        }
        
        function attack(type) {
            if (!roundActive || attackCooldown > 0) return;
            
            const distance = Math.abs(player.x - cpu.x);
            const canHit = distance < 100;
            
            let damage = 0;
            let hitEffect = false;
            
            if (type === 'light') {
                damage = canHit ? Math.floor(8 * (selectedStats.power / 100)) : 0;
                attackCooldown = 15;
                hitEffect = canHit;
                
                // Visual feedback - punch animation
                this.tweens.add({
                    targets: player,
                    scaleX: 1.3,
                    duration: 80,
                    yoyo: true
                });
            } else if (type === 'heavy') {
                damage = canHit ? Math.floor(15 * (selectedStats.power / 100)) : 0;
                attackCooldown = 25;
                hitEffect = canHit;
                
                // Heavy attack animation
                this.tweens.add({
                    targets: player,
                    scaleX: 1.4,
                    scaleY: 0.9,
                    duration: 100,
                    yoyo: true
                });
            }
            
            if (hitEffect && damage > 0) {
                cpuHealth = Math.max(0, cpuHealth - damage);
                this.updateMeters();
                
                // Hit effect
                hitEffectTimer = 10;
                this.cpuGlow.setAlpha(0.6);
                this.cpuGlow.setFillStyle(0xff5252);
                
                // Screen shake
                this.cameras.main.shake(100, 0.003);
                
                // Combo system
                comboCount++;
                if (comboTimeout) clearTimeout(comboTimeout);
                comboText.setText(`${comboCount} HIT COMBO!`);
                comboText.setAlpha(1);
                comboTimeout = setTimeout(() => {
                    comboText.setAlpha(0);
                    comboCount = 0;
                }, 1000);
                
                // Push back on hit
                cpu.x += 20;
                if (cpu.x > 1130) cpu.x = 1130;
                
                // Check for victory
                if (cpuHealth <= 0) {
                    this.endGame('player');
                }
            } else if (canHit && damage === 0) {
                // Blocked!
                const blockText = this.add.text(cpu.x, cpu.y - 50, 'BLOCK!', {
                    fontFamily: 'JetBrains Mono',
                    fontSize: '16px',
                    color: '#666666'
                }).setOrigin(0.5);
                this.tweens.add({
                    targets: blockText,
                    alpha: 0,
                    y: blockText.y - 30,
                    duration: 500,
                    onComplete: () => blockText.destroy()
                });
            }
        }
        
        function specialAttack() {
            if (!roundActive || specialCooldown > 0 || specialMeter < 100) return;
            
            const distance = Math.abs(player.x - cpu.x);
            const canHit = distance < 150;
            
            if (canHit) {
                const damage = Math.floor(25 * (selectedStats.power / 100));
                cpuHealth = Math.max(0, cpuHealth - damage);
                specialMeter = 0;
                specialCooldown = 60;
                this.updateMeters();
                
                // Special effect
                hitEffectTimer = 15;
                this.cpuGlow.setAlpha(0.8);
                this.cpuGlow.setFillStyle(0xff0000);
                this.cameras.main.shake(200, 0.008);
                
                // Special visual
                const specialEffect = this.add.text(player.x, player.y - 50, 'SPECIAL!', {
                    fontFamily: 'Anybody',
                    fontSize: '24px',
                    color: '#ffb3b2',
                    fontStyle: 'bold'
                }).setOrigin(0.5);
                this.tweens.add({
                    targets: specialEffect,
                    alpha: 0,
                    y: specialEffect.y - 50,
                    duration: 600,
                    onComplete: () => specialEffect.destroy()
                });
                
                // Screen flash
                const flash = this.add.rectangle(640, 360, 1280, 720, 0xffffff);
                flash.setAlpha(0.3);
                this.tweens.add({
                    targets: flash,
                    alpha: 0,
                    duration: 200,
                    onComplete: () => flash.destroy()
                });
                
                // Push back
                cpu.x += 40;
                if (cpu.x > 1130) cpu.x = 1130;
                
                if (cpuHealth <= 0) {
                    this.endGame('player');
                }
            } else {
                const missText = this.add.text(player.x, player.y - 50, 'MISS!', {
                    fontFamily: 'JetBrains Mono',
                    fontSize: '16px',
                    color: '#ff5252'
                }).setOrigin(0.5);
                this.tweens.add({
                    targets: missText,
                    alpha: 0,
                    y: missText.y - 30,
                    duration: 500,
                    onComplete: () => missText.destroy()
                });
            }
        }
        
        function cpuAction() {
            if (!roundActive) return;
            
            const distance = Math.abs(cpu.x - player.x);
            
            // Decision making based on distance and health
            const random = Math.random();
            
            if (distance > 120) {
                // Move towards player
                if (cpu.x < player.x) {
                    cpu.x += 20;
                } else {
                    cpu.x -= 20;
                }
            } else if (random < 0.4 && attackCooldown === 0) {
                // CPU Attack
                const damage = Math.floor(12 * 0.85); // CPU has 85% power
                playerHealth = Math.max(0, playerHealth - damage);
                attackCooldown = 20;
                this.updateMeters();
                
                hitEffectTimer = 10;
                this.playerGlow.setAlpha(0.6);
                this.playerGlow.setFillStyle(0x00dbe9);
                this.cameras.main.shake(100, 0.003);
                
                // CPU attack animation
                this.tweens.add({
                    targets: cpu,
                    scaleX: 1.3,
                    duration: 80,
                    yoyo: true
                });
                
                // Push back
                player.x -= 20;
                if (player.x < 150) player.x = 150;
                
                if (playerHealth <= 0) {
                    this.endGame('cpu');
                }
            } else if (random < 0.7 && specialMeter >= 100 && specialCooldown === 0) {
                // CPU Special
                const damage = Math.floor(22 * 0.85);
                playerHealth = Math.max(0, playerHealth - damage);
                specialMeter = 0;
                specialCooldown = 60;
                this.updateMeters();
                
                hitEffectTimer = 15;
                this.playerGlow.setAlpha(0.8);
                this.playerGlow.setFillStyle(0xff0000);
                this.cameras.main.shake(200, 0.008);
                
                const specialEffect = this.add.text(cpu.x, cpu.y - 50, 'CPU SPECIAL!', {
                    fontFamily: 'Anybody',
                    fontSize: '20px',
                    color: '#00dbe9',
                    fontStyle: 'bold'
                }).setOrigin(0.5);
                this.tweens.add({
                    targets: specialEffect,
                    alpha: 0,
                    y: specialEffect.y - 50,
                    duration: 600,
                    onComplete: () => specialEffect.destroy()
                });
                
                if (playerHealth <= 0) {
                    this.endGame('cpu');
                }
            }
            
            // Boundary limits for CPU
            cpu.x = Math.min(Math.max(cpu.x, 780), 1130);
        }
        
        function updateMeters() {
            // Update health bars
            const playerPercent = playerHealth / 100;
            const cpuPercent = cpuHealth / 100;
            
            healthBarPlayer.width = 400 * playerPercent;
            healthBarCPU.width = 400 * cpuPercent;
            
            // Change color based on low health
            if (playerHealth < 30) {
                healthBarPlayer.setFillStyle(0xff5252);
            } else {
                healthBarPlayer.setFillStyle(selectedStats.color);
            }
            
            if (cpuHealth < 30) {
                healthBarCPU.setFillStyle(0xff5252);
            } else {
                healthBarCPU.setFillStyle(0x00dbe9);
            }
            
            // Update special meter
            if (this.specialFill) {
                this.specialFill.width = 400 * (specialMeter / 100);
            }
        }
        
        function endGame(winner) {
            roundActive = false;
            
            let message = '';
            if (winner === 'player') {
                message = `${selectedStats.name} VICTORY!`;
                winnerText.setColor('#ffb3b2');
            } else {
                message = 'ZERO VICTORY!';
                winnerText.setColor('#00dbe9');
            }
            
            winnerText.setText(message);
            winnerText.setAlpha(1);
            
            // Restart button after 3 seconds
            this.time.delayedCall(3000, () => {
                winnerText.setAlpha(0);
                this.restartGame();
            });
        }
        
        function restartGame() {
            playerHealth = 100;
            cpuHealth = 100;
            specialMeter = 0;
            attackCooldown = 0;
            specialCooldown = 0;
            roundActive = true;
            comboCount = 0;
            comboText.setAlpha(0);
            
            // Reset positions
            player.x = 300;
            cpu.x = 980;
            
            this.updateMeters();
            
            // Reset glow colors
            this.playerGlow.setFillStyle(selectedStats.color);
            this.cpuGlow.setFillStyle(0x00dbe9);
            this.playerGlow.setAlpha(0.2);
            this.cpuGlow.setAlpha(0.2);
            
            // Round announcement
            roundText.setAlpha(0.8);
            this.tweens.add({
                targets: roundText,
                alpha: 0,
                delay: 1000,
                duration: 500
            });
        }
        
        // Start the game
        const game = new Phaser.Game(config);
    </script>
</body>
</html>
