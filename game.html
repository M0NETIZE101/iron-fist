<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>IRON FIST - BATTLE</title>
    
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: monospace; overflow: hidden; }
        #game-container { position: relative; border: 1px solid rgba(255, 179, 178, 0.3); }
        .debug-panel {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            font-size: 10px;
            padding: 10px;
            font-family: monospace;
            z-index: 1000;
            border-left: 3px solid #0f0;
            max-width: 300px;
            pointer-events: none;
        }
        .controls-info {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: rgba(10, 10, 10, 0.8);
            padding: 12px 24px;
            border-left: 2px solid #ffb3b2;
            font-size: 12px;
            color: #e9bcba;
            z-index: 100;
            pointer-events: none;
        }
        .back-button {
            position: fixed;
            top: 30px;
            left: 30px;
            background: rgba(10, 10, 10, 0.8);
            padding: 8px 16px;
            border: 1px solid rgba(255, 179, 178, 0.3);
            color: #e9bcba;
            text-decoration: none;
            font-size: 12px;
            z-index: 100;
        }
        .back-button:hover { border-color: #ffb3b2; color: #ffb3b2; }
    </style>
</head>
<body>
    <a href="characterselect.html" class="back-button">← EXIT</a>
    <div class="controls-info">← → MOVE | A PUNCH | S KICK | D SPECIAL</div>
    <div class="debug-panel" id="debugPanel">Initializing...</div>
    <div id="game-container"></div>

    <script>
        const debugPanel = document.getElementById('debugPanel');
        
        function logDebug(msg) {
            console.log(msg);
            if(debugPanel) {
                debugPanel.innerHTML = msg + '<br>' + debugPanel.innerHTML;
                if(debugPanel.innerHTML.split('<br>').length > 5) {
                    debugPanel.innerHTML = debugPanel.innerHTML.split('<br>').slice(0, 5).join('<br>');
                }
            }
        }
        
        logDebug('Script started');
        
        // Get selected fighter
        const urlParams = new URLSearchParams(window.location.search);
        const playerFighter = urlParams.get('fighter') || 'KAIRO';
        logDebug(`Selected fighter: ${playerFighter}`);
        
        // Try different image path variations
        const imagePaths = [
            `assets/characters/${playerFighter.toLowerCase()}/portrait.png`,
            `assets/characters/${playerFighter.toLowerCase()}/portrait.jpg`,
            `assets/characters/${playerFighter.toLowerCase()}/portrait.webp`,
            `assets/characters/${playerFighter}/portrait.png`,
            `assets/characters/kairo/portrait.png`,
            `assets/characters/KAIRO/portrait.png`,
            `portrait.png`,
            `kairo.png`
        ];
        
        // Fighter stats
        const fighters = {
            'KAIRO': { name: 'KAIRO', power: 88, speed: 94, color: 0xff5252, accent: 0xffb3b2 },
            'SILAS': { name: 'SILAS', power: 95, speed: 58, color: 0x6c6c6c, accent: 0xaaaaaa },
            'ZERO': { name: 'ZERO', power: 90, speed: 91, color: 0x00dbe9, accent: 0x7df4ff }
        };
        
        const playerData = fighters[playerFighter] || fighters['KAIRO'];
        const cpuData = fighters['ZERO'];
        
        logDebug(`Player data: ${playerData.name}, power: ${playerData.power}`);
        
        // Game Scene
        class FightingGame extends Phaser.Scene {
            constructor() {
                super({ key: 'FightingGame' });
            }
            
            preload() {
                logDebug('Preload started');
                
                // Try to load the image from multiple paths
                let loaded = false;
                
                for (const path of imagePaths) {
                    logDebug(`Trying to load: ${path}`);
                    try {
                        this.load.image('playerSprite', path);
                        // Check if file exists by trying to load it
                        this.load.on('loaderror', (fileObj) => {
                            if (fileObj.key === 'playerSprite') {
                                logDebug(`Failed to load: ${path}`);
                            }
                        });
                        this.load.on('loadcomplete', () => {
                            if (!loaded && this.textures.exists('playerSprite')) {
                                loaded = true;
                                logDebug(`SUCCESS! Loaded image from: ${path}`);
                            }
                        });
                    } catch(e) {
                        logDebug(`Error trying ${path}: ${e.message}`);
                    }
                }
                
                // Fallback - create a colored rectangle as placeholder
                logDebug('Loading background and fallback assets');
                this.load.image('bg', 'https://placehold.co/1280x720/0a0a0a/ffb3b2?text=IRON+FIST+ARENA');
            }
            
            create() {
                logDebug('Create started');
                
                // Game state
                this.playerHealth = 100;
                this.cpuHealth = 100;
                this.playerFocus = 0;
                this.attackCooldown = 0;
                this.roundActive = true;
                
                // Background
                const bg = this.add.image(640, 360, 'bg');
                bg.setDisplaySize(1280, 720);
                bg.setAlpha(0.5);
                
                // Ground
                const ground = this.add.rectangle(640, 580, 1280, 140, 0x1a1a1a);
                ground.setStrokeStyle(1, 0xffb3b2);
                
                // === PLAYER (with image if loaded, otherwise rectangle) ===
                if (this.textures.exists('playerSprite')) {
                    logDebug('Using image sprite for player');
                    this.player = this.add.sprite(280, 480, 'playerSprite');
                    this.player.setDisplaySize(160, 240);
                    this.player.setScale(1);
                    logDebug(`Player sprite created at x:280, y:480`);
                } else {
                    logDebug('Image not loaded, using rectangle fallback');
                    this.player = this.add.rectangle(280, 520, 60, 100, playerData.color);
                    this.player.setStrokeStyle(2, playerData.accent);
                }
                
                // === CPU (rectangle for now) ===
                this.cpu = this.add.rectangle(1000, 520, 60, 100, cpuData.color);
                this.cpu.setStrokeStyle(2, cpuData.accent);
                
                // Health bars
                const healthBgPlayer = this.add.rectangle(200, 50, 350, 20, 0x333333);
                healthBgPlayer.setStrokeStyle(1, playerData.accent);
                this.healthBarPlayer = this.add.rectangle(200, 50, 350, 20, playerData.color);
                this.healthBarPlayer.setOrigin(0, 0.5);
                
                const healthBgCPU = this.add.rectangle(1080, 50, 350, 20, 0x333333);
                healthBgCPU.setStrokeStyle(1, cpuData.accent);
                this.healthBarCPU = this.add.rectangle(1080, 50, 350, 20, cpuData.color);
                this.healthBarCPU.setOrigin(0, 0.5);
                
                // Player name
                this.add.text(200, 30, playerData.name, { fontFamily: 'Arial', fontSize: '16px', color: '#ffb3b2', fontStyle: 'bold' }).setOrigin(0.5);
                this.add.text(1080, 30, cpuData.name, { fontFamily: 'Arial', fontSize: '16px', color: '#00dbe9', fontStyle: 'bold' }).setOrigin(0.5);
                
                // Focus meter
                const focusBg = this.add.rectangle(640, 85, 300, 8, 0x333333);
                focusBg.setStrokeStyle(1, 0xffb3b2);
                this.focusBar = this.add.rectangle(640, 85, 0, 8, 0xffb3b2);
                this.focusBar.setOrigin(0, 0.5);
                
                // VS text
                const vsText = this.add.text(640, 300, 'VS', { fontFamily: 'Arial', fontSize: '80px', color: '#ffb3b2', fontStyle: 'bold', fontStyle: 'italic' }).setOrigin(0.5);
                vsText.setAlpha(0.15);
                
                // Controls text display
                this.add.text(640, 650, 'Press A to Punch | S to Kick | D to Special', { fontFamily: 'monospace', fontSize: '12px', color: '#666' }).setOrigin(0.5);
                
                // Input
                this.keyA = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.A);
                this.keyS = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.S);
                this.keyD = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.D);
                this.keyLeft = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.LEFT);
                this.keyRight = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.RIGHT);
                
                // Focus regeneration
                this.time.addEvent({
                    delay: 100,
                    callback: () => {
                        if(this.roundActive && this.playerFocus < 100) {
                            this.playerFocus += 2;
                            this.focusBar.width = 300 * (this.playerFocus / 100);
                        }
                    },
                    loop: true
                });
                
                // CPU AI
                this.time.addEvent({
                    delay: 800,
                    callback: () => this.cpuAction(),
                    loop: true
                });
                
                logDebug('Game created successfully - ready to fight!');
            }
            
            update() {
                if(!this.roundActive) return;
                
                if(this.attackCooldown > 0) this.attackCooldown--;
                
                // Movement
                if(this.keyLeft.isDown) this.player.x -= 6;
                if(this.keyRight.isDown) this.player.x += 6;
                
                // Boundaries
                this.player.x = Math.min(Math.max(this.player.x, 180), 550);
                this.cpu.x = Math.min(Math.max(this.cpu.x, 730), 1100);
                
                // Attacks
                if(Phaser.Input.Keyboard.JustDown(this.keyA)) this.lightAttack();
                if(Phaser.Input.Keyboard.JustDown(this.keyS)) this.heavyAttack();
                if(Phaser.Input.Keyboard.JustDown(this.keyD)) this.specialAttack();
                
                // Prevent overlapping
                if(Math.abs(this.player.x - this.cpu.x) < 80) {
                    if(this.player.x < this.cpu.x) this.player.x = this.cpu.x - 80;
                    else this.cpu.x = this.player.x + 80;
                }
            }
            
            lightAttack() {
                if(this.attackCooldown > 0) return;
                
                const distance = Math.abs(this.player.x - this.cpu.x);
                if(distance < 100) {
                    const damage = 8;
                    this.cpuHealth = Math.max(0, this.cpuHealth - damage);
                    this.attackCooldown = 20;
                    this.updateHealthBars();
                    this.cameras.main.shake(50, 0.002);
                    
                    // Hit flash
                    this.cpu.setAlpha(0.5);
                    this.time.delayedCall(100, () => this.cpu.setAlpha(1));
                    
                    logDebug(`Light attack! Damage: ${damage}, CPU Health: ${this.cpuHealth}`);
                    
                    if(this.cpuHealth <= 0) this.endGame('player');
                }
            }
            
            heavyAttack() {
                if(this.attackCooldown > 0) return;
                
                const distance = Math.abs(this.player.x - this.cpu.x);
                if(distance < 90) {
                    const damage = 14;
                    this.cpuHealth = Math.max(0, this.cpuHealth - damage);
                    this.attackCooldown = 30;
                    this.updateHealthBars();
                    this.cameras.main.shake(80, 0.003);
                    
                    this.cpu.setAlpha(0.5);
                    this.time.delayedCall(100, () => this.cpu.setAlpha(1));
                    
                    logDebug(`Heavy attack! Damage: ${damage}, CPU Health: ${this.cpuHealth}`);
                    
                    if(this.cpuHealth <= 0) this.endGame('player');
                }
            }
            
            specialAttack() {
                if(this.playerFocus < 100) {
                    logDebug(`Special attack failed - focus: ${this.playerFocus}%`);
                    return;
                }
                
                const distance = Math.abs(this.player.x - this.cpu.x);
                if(distance < 120) {
                    const damage = 25;
                    this.cpuHealth = Math.max(0, this.cpuHealth - damage);
                    this.playerFocus = 0;
                    this.focusBar.width = 0;
                    this.updateHealthBars();
                    this.cameras.main.shake(150, 0.008);
                    
                    // Flash effect
                    const flash = this.add.rectangle(640, 360, 1280, 720, 0xffffff);
                    flash.setAlpha(0.3);
                    this.time.delayedCall(150, () => flash.destroy());
                    
                    logDebug(`SPECIAL ATTACK! Damage: ${damage}, CPU Health: ${this.cpuHealth}`);
                    
                    if(this.cpuHealth <= 0) this.endGame('player');
                }
            }
            
            cpuAction() {
                if(!this.roundActive) return;
                
                const distance = Math.abs(this.cpu.x - this.player.x);
                
                if(distance > 120) {
                    if(this.cpu.x < this.player.x) this.cpu.x += 10;
                    else this.cpu.x -= 10;
                } else {
                    if(Math.random() < 0.4) {
                        const damage = 7;
                        this.playerHealth = Math.max(0, this.playerHealth - damage);
                        this.updateHealthBars();
                        this.cameras.main.shake(50, 0.002);
                        this.player.setAlpha(0.5);
                        this.time.delayedCall(100, () => this.player.setAlpha(1));
                        
                        logDebug(`CPU attacks! Player Health: ${this.playerHealth}`);
                        
                        if(this.playerHealth <= 0) this.endGame('cpu');
                    }
                }
            }
            
            updateHealthBars() {
                this.healthBarPlayer.width = 350 * (this.playerHealth / 100);
                this.healthBarCPU.width = 350 * (this.cpuHealth / 100);
            }
            
            endGame(winner) {
                this.roundActive = false;
                logDebug(`GAME OVER! Winner: ${winner === 'player' ? playerData.name : cpuData.name}`);
                
                const resultText = winner === 'player' ? `${playerData.name} VICTORY!` : `${cpuData.name} VICTORY!`;
                const resultColor = winner === 'player' ? '#ffb3b2' : '#00dbe9';
                
                const announcement = this.add.text(640, 360, resultText, {
                    fontFamily: 'Arial',
                    fontSize: '48px',
                    color: resultColor,
                    fontStyle: 'bold'
                }).setOrigin(0.5);
                announcement.setAlpha(0);
                
                this.tweens.add({
                    targets: announcement,
                    alpha: 1,
                    scale: 1.2,
                    duration: 500,
                    ease: 'Back'
                });
                
                this.time.delayedCall(3500, () => {
                    window.location.href = 'characterselect.html';
                });
            }
        }
        
        const config = {
            type: Phaser.AUTO,
            width: 1280,
            height: 720,
            parent: 'game-container',
            backgroundColor: '#050505',
            scene: FightingGame,
            scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH }
        };
        
        logDebug('Starting Phaser game...');
        const game = new Phaser.Game(config);
        logDebug('Phaser game created');
    </script>
</body>
</html>
