<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CHIYA GANG WARRIORS - BATTLE ARENA</title>
    
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wght@0,100..900;1,100..900&family=Geist:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥊</text></svg>">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: #0a0a0a; 
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        
        #game-container { 
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #050505;
            z-index: 1;
        }
        
        .controls-info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-left: 3px solid #ffb3b2;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            color: rgba(233, 188, 186, 0.9);
            letter-spacing: 1px;
            z-index: 100;
            pointer-events: none;
            border-radius: 0 8px 8px 0;
        }
        
        .controls-info span { color: #ffb3b2; }
        .controls-info .key { border: 1px solid rgba(255,179,178,0.5); padding: 2px 8px; border-radius: 4px; margin: 0 2px; background: rgba(0,0,0,0.5); }
        
        .back-button { 
            position: fixed; 
            top: max(10px, env(safe-area-inset-top)); 
            left: max(10px, env(safe-area-inset-left)); 
            background: rgba(10, 10, 10, 0.85); 
            backdrop-filter: blur(12px); 
            padding: 6px 12px; 
            border: 1px solid rgba(255, 179, 178, 0.4); 
            color: #e9bcba; 
            text-decoration: none; 
            font-size: 11px; 
            font-family: 'JetBrains Mono', monospace; 
            letter-spacing: 1px; 
            z-index: 100; 
            transition: all 0.3s ease; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            border-radius: 6px; 
        }
        .back-button:hover { border-color: #ffb3b2; color: #ffb3b2; transform: translateX(-4px); }
        
        /* Mobile styles - moved to top level */
        @media (max-width: 768px) {
            .controls-info { display: none !important; }
            
            .mobile-controls {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                padding: 12px 16px;
                padding-bottom: max(12px, env(safe-area-inset-bottom, 20px));
                padding-left: max(12px, env(safe-area-inset-left));
                padding-right: max(12px, env(safe-area-inset-right));
                background: transparent;
                backdrop-filter: none;
                border: none;
                z-index: 200;
                gap: 20px;
                flex-wrap: nowrap;
                pointer-events: auto;
                touch-action: none;
            }
            
            .rotate-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
                height: 100dvh;
                background: #0a0a0c;
                z-index: 1000;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 20px;
                backdrop-filter: blur(4px);
                font-family: 'Geist', sans-serif;
            }
            
            .rotate-icon {
                width: 80px;
                height: 80px;
                border: 4px solid #ffb3b2;
                border-radius: 20px;
                position: relative;
                animation: rotateAnim 1.5s ease-in-out infinite;
            }
            
            .rotate-icon::before {
                content: "📱";
                position: absolute;
                font-size: 50px;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }
            
            .rotate-icon::after {
                content: "↻";
                position: absolute;
                font-size: 30px;
                bottom: -35px;
                left: 50%;
                transform: translateX(-50%);
                color: #ffb3b2;
            }
            
            .rotate-text {
                color: #ffb3b2;
                font-size: 20px;
                font-weight: bold;
                letter-spacing: 2px;
                text-align: center;
            }
            
            .rotate-subtext {
                color: #5f3e3e;
                font-size: 14px;
                margin-top: 8px;
            }
            
            .joystick-area {
                width: 130px;
                height: 130px;
                background: rgba(255, 255, 255, 0.08);
                border-radius: 50%;
                position: relative;
                touch-action: none;
                border: 1px solid rgba(255, 179, 178, 0.3);
                box-shadow: none;
                transition: transform 0.1s ease;
            }
            
            .joystick-base {
                width: 100%;
                height: 100%;
                border-radius: 50%;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            
            .joystick-thumb {
                width: 55px;
                height: 55px;
                background: rgba(255, 82, 92, 0.45);
                border-radius: 50%;
                position: relative;
                cursor: pointer;
                box-shadow: none;
                transition: transform 0.08s cubic-bezier(0.2, 0.9, 0.4, 1.1);
                touch-action: none;
            }
            
            .action-buttons {
                display: grid;
                grid-template-columns: repeat(4, 70px);
                gap: 12px;
                background: transparent;
                padding: 12px 16px;
                border-radius: 80px;
                backdrop-filter: none;
            }
            
            .action-btn {
                width: 70px;
                height: 70px;
                border-radius: 50%;
                background: rgba(0, 0, 0, 0.12);
                border: 1px solid rgba(255, 179, 178, 0.35);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                font-family: 'JetBrains Mono', monospace;
                font-weight: bold;
                font-size: 18px;
                color: rgba(255, 179, 178, 0.9);
                cursor: pointer;
                transition: all 0.05s linear;
                touch-action: manipulation;
                box-shadow: none;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
                backdrop-filter: blur(4px);
            }
            
            .action-btn:active { transform: scale(0.92); }
            .action-btn.special { border-color: rgba(255, 215, 0, 0.5); color: rgba(255, 215, 0, 0.9); }
            .action-btn.block { border-color: rgba(0, 219, 233, 0.5); color: rgba(0, 219, 233, 0.9); }
            .action-btn.super { background: rgba(60, 40, 0, 0.15); border-color: rgba(255, 215, 0, 0.5); color: rgba(255, 215, 0, 0.9); }
            .action-btn.jump { border-color: rgba(0, 255, 136, 0.5); color: rgba(0, 255, 136, 0.9); }
            .action-btn.dash { border-color: rgba(255, 105, 180, 0.5); color: rgba(255, 105, 180, 0.9); font-size: 14px; }
            .btn-label { font-size: 9px; letter-spacing: 1px; margin-top: 2px; opacity: 0.7; }
            
            .action-btn.touch-active {
                transform: scale(0.92);
                background: rgba(255, 82, 92, 0.6);
                color: #fff;
                border-color: rgba(255, 255, 255, 0.8);
            }
            
            body {
                touch-action: pan-x pan-y;
                overscroll-behavior: none;
            }
        }
        
        /* Medium screens - top level */
        @media (max-width: 768px) and (min-width: 481px) {
            .action-buttons { grid-template-columns: repeat(4, 58px); gap: 10px; padding: 10px 12px; }
            .action-btn { width: 58px; height: 58px; font-size: 16px; }
            .btn-label { font-size: 8px; }
            .joystick-area { width: 110px; height: 110px; }
            .joystick-thumb { width: 45px; height: 45px; }
        }
        
        /* Small screens - top level */
        @media (max-width: 480px) {
            .action-buttons { grid-template-columns: repeat(4, 50px); gap: 8px; }
            .action-btn { width: 50px; height: 50px; font-size: 14px; }
            .joystick-area { width: 95px; height: 95px; }
            .joystick-thumb { width: 40px; height: 40px; }
        }
        
        /* Reduced motion - top level, not nested inside mobile query */
        @media (prefers-reduced-motion: reduce) {
            .action-btn:active { transform: none; }
            .joystick-thumb { transition: none; }
            .rotate-icon { animation: none; }
        }
        
        /* Keyframes outside media query for maximum compatibility */
        @keyframes rotateAnim {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }
        
        @media (min-width: 769px) {
            .mobile-controls { display: none !important; }
            .rotate-overlay { display: none !important; }
        }
    </style>
</head>

    <script>
        // ========== MOBILE OPTIMIZATIONS ==========
        const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
        const TARGET_FPS = isMobileDevice ? 30 : 60;
        
        let isBatteryLow = false;
        let isCharging = true;
        
        // Battery promise - will update after resolution
        if ('getBattery' in navigator) {
            navigator.getBattery().then(battery => {
                isBatteryLow = battery.level < 0.2 && !battery.charging;
                isCharging = battery.charging;
                battery.addEventListener('levelchange', () => {
                    isBatteryLow = battery.level < 0.2 && !battery.charging;
                    // Update game scene if exists
                    if (window.gameSceneRef) {
                        window.gameSceneRef.batterySaveMode = isMobileDevice && isBatteryLow && !isCharging;
                    }
                });
                battery.addEventListener('chargingchange', () => {
                    isCharging = battery.charging;
                    isBatteryLow = battery.level < 0.2 && !battery.charging;
                    if (window.gameSceneRef) {
                        window.gameSceneRef.batterySaveMode = isMobileDevice && isBatteryLow && !isCharging;
                    }
                });
            });
        }
        
        // ========== ORIENTATION CHANGE - NO PAGE RELOAD ==========
        let orientationTimeout = null;
        
        function handleOrientationChange() {
            if (orientationTimeout) clearTimeout(orientationTimeout);
            orientationTimeout = setTimeout(() => {
                if (window.game && window.game.scale && isMobileDevice) {
                    window.game.scale.resize(window.innerWidth, window.innerHeight);
                }
                if (typeof checkOrientation === 'function') checkOrientation();
            }, 50);
        }
        
        window.addEventListener('orientationchange', handleOrientationChange);
        
        let resizeTimeout = null;
        
        function handleResize() {
            if (resizeTimeout) clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (window.game && window.game.scale && isMobileDevice) {
                    window.game.scale.resize(window.innerWidth, window.innerHeight);
                }
            }, 100);
        }
        
        window.addEventListener('resize', handleResize);
        
        window.addEventListener('beforeunload', () => {
            window.removeEventListener('orientationchange', handleOrientationChange);
            window.removeEventListener('resize', handleResize);
            if (orientationTimeout) clearTimeout(orientationTimeout);
            if (resizeTimeout) clearTimeout(resizeTimeout);
        });
        
        // ========== MOBILE TOUCH CONTROLS ==========
        (function() {
            const mobileControls = document.getElementById('mobileControls');
            const rotateOverlay = document.getElementById('rotateOverlay');
            
            if (!isMobileDevice) return;
            
            let isLandscape = window.innerWidth > window.innerHeight;
            
            window.checkOrientation = function() {
                const newIsLandscape = window.innerWidth > window.innerHeight;
                isLandscape = newIsLandscape;
                if (rotateOverlay) rotateOverlay.style.display = isLandscape ? 'none' : 'flex';
                if (mobileControls) {
                    mobileControls.style.opacity = isLandscape ? '1' : '0';
                    mobileControls.style.pointerEvents = isLandscape ? 'auto' : 'none';
                }
            };
            
            if (screen.orientation) {
                screen.orientation.addEventListener('change', checkOrientation);
            } else {
                window.addEventListener('resize', checkOrientation);
            }
            checkOrientation();
            
            // ========== JOYSTICK ==========
            let joystickActive = false;
            let joystickCenter = { x: 0, y: 0 };
            const joystickArea = document.getElementById('joystickArea');
            const joystickThumb = document.getElementById('joystickThumb');
            const maxDist = 45;
            const deadzone = 0.15;
            let gameScene = null;
            
            const checkForGameScene = setInterval(() => {
                if (window.gameSceneRef && window.gameSceneRef.playerAttacks) {
                    gameScene = window.gameSceneRef;
                    clearInterval(checkForGameScene);
                }
            }, 100);
            
            function updateJoystick(touch) {
                if (!joystickActive || !gameScene) return;
                
                const dx = touch.clientX - joystickCenter.x;
                const dy = touch.clientY - joystickCenter.y;
                const distance = Math.min(Math.hypot(dx, dy), maxDist);
                const angle = Math.atan2(dy, dx);
                
                joystickThumb.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px)`;
                
                let normX = (distance / maxDist) * Math.cos(angle);
                if (Math.abs(normX) < deadzone) {
                    normX = 0;
                } else {
                    normX = (Math.abs(normX) - deadzone) / (1 - deadzone) * Math.sign(normX);
                }
                
                if (normX > 0.1) {
                    gameScene.mobileRightPressed = true;
                    gameScene.mobileLeftPressed = false;
                } else if (normX < -0.1) {
                    gameScene.mobileLeftPressed = true;
                    gameScene.mobileRightPressed = false;
                } else {
                    gameScene.mobileLeftPressed = false;
                    gameScene.mobileRightPressed = false;
                }
            }
            
            function resetJoystick() {
                joystickActive = false;
                joystickThumb.style.transform = 'translate(0px, 0px)';
                if (gameScene) {
                    gameScene.mobileLeftPressed = false;
                    gameScene.mobileRightPressed = false;
                }
            }
            
            joystickArea.addEventListener('touchstart', (e) => {
                e.preventDefault();
                joystickActive = true;
                const rect = joystickArea.getBoundingClientRect();
                joystickCenter = {
                    x: rect.left + rect.width / 2,
                    y: rect.top + rect.height / 2
                };
                updateJoystick(e.touches[0]);
            }, { passive: false });
            
            joystickArea.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (joystickActive) updateJoystick(e.touches[0]);
            }, { passive: false });
            
            joystickArea.addEventListener('touchend', (e) => {
                e.preventDefault();
                resetJoystick();
            });
            
            // ========== ACTION BUTTONS ==========
            let activeTouches = new Map();
            
            function handleTouchStart(e, btn, action) {
                e.preventDefault();
                const touchId = e.changedTouches[0].identifier;
                activeTouches.set(touchId, btn);
                btn.classList.add('touch-active');
                
                if (!gameScene || !gameScene.roundActive || gameScene.isSuperFrozen) return;
                
                switch(action) {
                    case 'light': if (gameScene.playerAttacks) gameScene.playerAttacks.lightAttack(); break;
                    case 'medium': if (gameScene.playerAttacks) gameScene.playerAttacks.mediumAttack(); break;
                    case 'heavy': if (gameScene.playerAttacks) gameScene.playerAttacks.heavyAttack(); break;
                    case 'special':
                        if (gameScene.playerAttacks && gameScene.specialCooldown === 0) {
                            gameScene.playerAttacks.playerSpecialAttack();
                        }
                        break;
                    case 'block': gameScene.mobileBlockPressed = true; break;
                    case 'super':
                        if (gameScene.playerAttacks && gameScene.superMeter >= 100) {
                            gameScene.playerAttacks.superMove();
                        }
                        break;
                    case 'jump':
                        if (!gameScene.isJumping && !gameScene.isAttacking && gameScene.roundActive && !gameScene.isSuperFrozen) {
                            gameScene.mobileJumpRequested = true;
                        }
                        break;
                    case 'dash':
                        if (gameScene.player && !gameScene.isAttacking && !gameScene.isJumping) {
                            const direction = gameScene.player.x < gameScene.cpu.x ? 80 : -80;
                            gameScene.player.x += direction;
                            gameScene.player.x = Math.min(Math.max(gameScene.player.x, 200), 1080 - 100);
                        }
                        break;
                }
            }
            
            function handleTouchEnd(e, btn, action) {
                e.preventDefault();
                const touchId = e.changedTouches[0].identifier;
                activeTouches.delete(touchId);
                btn.classList.remove('touch-active');
                if (!gameScene) return;
                if (action === 'block' && !hasOtherBlockTouch()) gameScene.mobileBlockPressed = false;
            }
            
            function hasOtherBlockTouch() {
                for (let [id, btn] of activeTouches) {
                    if (btn.getAttribute('data-action') === 'block') return true;
                }
                return false;
            }
            
            const buttons = document.querySelectorAll('.action-btn');
            buttons.forEach(btn => {
                const action = btn.dataset.action;
                btn.addEventListener('touchstart', (e) => handleTouchStart(e, btn, action), { passive: false });
                btn.addEventListener('touchend', (e) => handleTouchEnd(e, btn, action));
                btn.addEventListener('touchcancel', (e) => handleTouchEnd(e, btn, action));
            });
            
            document.body.addEventListener('touchmove', (e) => {
                if (e.target.closest('.mobile-controls')) e.preventDefault();
            }, { passive: false });
            
            document.body.addEventListener('contextmenu', (e) => {
                if (e.target.closest('.action-btn') || e.target.closest('.joystick-area')) e.preventDefault();
            });
            
            let lastTouchEnd = 0;
            document.addEventListener('touchend', (e) => {
                const now = Date.now();
                if (now - lastTouchEnd <= 300) e.preventDefault();
                lastTouchEnd = now;
            }, false);
        })();
    </script>
    
    <script>
        // ========== FIGHTING GAME CLASS OVERRIDE ==========
        (function() {
            const originalFightingGame = FightingGame;
            
            window.FightingGame = class extends originalFightingGame {
                constructor() {
                    super();
                    this.mobileLeftPressed = false;
                    this.mobileRightPressed = false;
                    this.mobileBlockPressed = false;
                    this.mobileJumpRequested = false;
                    // MOVED to create() - battery values not ready in constructor
                    this.batterySaveMode = false;
                }
                
                create() {
                    super.create();
                    window.gameSceneRef = this;
                    
                    // FIXED: Battery save mode set here AFTER promise may have resolved
                    this.batterySaveMode = isMobileDevice && isBatteryLow && !isCharging;
                    
                    if (this.batterySaveMode) {
                        if (this.impactFlash) this.impactFlash.setAlpha(0.2);
                        if (this.cpuAttacks) {
                            const originalDecide = this.cpuAttacks.decide;
                            this.cpuAttacks.decide = () => {
                                if (Math.random() < 0.7) originalDecide.call(this.cpuAttacks);
                            };
                        }
                    }
                    
                    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                        const originalShake = this.cameras.main.shake;
                        this.cameras.main.shake = () => {};
                    }
                }
                
                updateMobileMovement() {
                    if (!this.player || !this.roundActive || this.isSuperFrozen) return;
                    
                    if (this.mobileLeftPressed) this.player.x -= 7;
                    if (this.mobileRightPressed) this.player.x += 7;
                    
                    if (this.mobileJumpRequested && !this.isJumping && !this.isAttacking && this.roundActive && !this.isSuperFrozen) {
                        this.isJumping = true;
                        this.playerYVelocity = JUMP_VELOCITY;
                        if (this.animations) this.animations.setPlayerAnimation('jump_regular', 300);
                        this.mobileJumpRequested = false;
                    }
                    
                    if (!this.roundActive && this.mobileJumpRequested) this.mobileJumpRequested = false;
                    
                    if (this.mobileBlockPressed && !this.isAttacking && !this.isJumping) {
                        this.isBlocking = true;
                        if (this.playerAura) {
                            this.playerAura.setAlpha(0.3);
                            this.playerAura.setFillStyle(0x00dbe9);
                        }
                        this.playerBlockHeight = 'mid';
                    } else if (!this.mobileBlockPressed && !this.keyG?.isDown) {
                        this.isBlocking = false;
                        if (this.playerAura) {
                            this.playerAura.setAlpha(0.15);
                            this.playerAura.setFillStyle(this.playerData?.color || 0xff5252);
                        }
                    }
                }
                
                update(time, delta) {
                    const cappedDelta = this.batterySaveMode ? Math.min(delta, 33) : delta;
                    this.updateMobileMovement();
                    super.update(time, cappedDelta);
                    if (this.player) this.player.x = Math.min(Math.max(this.player.x, 200), 1080 - 100);
                }
            };
        })();
    </script>
    
    <script>
        // ========== PHASER CONFIG ==========
        const config = {
            type: isMobileDevice ? Phaser.CANVAS : Phaser.AUTO,
            width: isMobileDevice ? window.innerWidth : 1280,
            height: isMobileDevice ? window.innerHeight : 720,
            parent: 'game-container',
            backgroundColor: '#050505',
            scene: FightingGame,
            scale: { 
                mode: Phaser.Scale.FIT, 
                autoCenter: Phaser.Scale.CENTER_BOTH,
                width: isMobileDevice ? '100%' : 1280,
                height: isMobileDevice ? '100%' : 720,
                zoom: 1
            },
            input: {
                activePointers: 3,
                touch: true
            },
            fps: {
                target: TARGET_FPS,
                forceSetTimeOut: true,
                min: 15
            },
            antialias: !isMobileDevice,
            pixelArt: isMobileDevice,
            callbacks: {
                postBoot: (game) => {
                    if (isMobileDevice && game.canvas) {
                        game.canvas.setAttribute('willReadFrequently', 'true');
                    }
                }
            }
        };
        
        if (isMobileDevice) {
            setTimeout(() => {
                const game = new Phaser.Game(config);
                window.game = game;
            }, 100);
        } else {
            const game = new Phaser.Game(config);
            window.game = game;
        }
        
        if (window.ResizeObserver && isMobileDevice) {
            const container = document.getElementById('game-container');
            const resizeObserver = new ResizeObserver(() => {
                if (window.game && window.game.scale) {
                    window.game.scale.resize(window.innerWidth, window.innerHeight);
                }
            });
            if (container) resizeObserver.observe(container);
        }
    </script>
</body>
</html>
