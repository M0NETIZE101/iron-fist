<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CHIYA WARRIORS - BATTLE ARENA</title>
    
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wght@0,100..900;1,100..900&family=Geist:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥊</text></svg>">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: #0a0a0a; 
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        
        #game-container { 
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #050505;
            z-index: 1;
        }
        
        /* Force canvas to always fill its container */
        #game-container canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            object-fit: contain;
        }
        
        .controls-info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-left: 3px solid #ffb3b2;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            color: rgba(233, 188, 186, 0.9);
            letter-spacing: 1px;
            z-index: 100;
            pointer-events: none;
            border-radius: 0 8px 8px 0;
        }
        
        .controls-info span { color: #ffb3b2; }
        .controls-info .key { border: 1px solid rgba(255,179,178,0.5); padding: 2px 8px; border-radius: 4px; margin: 0 2px; background: rgba(0,0,0,0.5); }
        
        .back-button { 
            position: fixed; 
            top: max(10px, env(safe-area-inset-top)); 
            left: max(10px, env(safe-area-inset-left)); 
            background: rgba(10, 10, 10, 0.85); 
            backdrop-filter: blur(12px); 
            padding: 6px 12px; 
            border: 1px solid rgba(255, 179, 178, 0.4); 
            color: #e9bcba; 
            text-decoration: none; 
            font-size: 11px; 
            font-family: 'JetBrains Mono', monospace; 
            letter-spacing: 1px; 
            z-index: 100; 
            transition: all 0.3s ease; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            border-radius: 6px; 
        }
        .back-button:hover { border-color: #ffb3b2; color: #ffb3b2; transform: translateX(-4px); }
        
        /* ===== MOBILE CONTROLS - Top-level rules (no media query) ===== */
        .mobile-controls {
            display: none; /* Hidden by default, shown via .active class */
        }
        
        .mobile-controls.active {
            position: fixed;
            bottom: 3vh;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 12px 3vw;
            padding-bottom: max(12px, env(safe-area-inset-bottom, 20px));
            padding-left: max(12px, env(safe-area-inset-left, 3vw));
            padding-right: max(12px, env(safe-area-inset-right, 3vw));
            background: transparent;
            backdrop-filter: none;
            border: none;
            z-index: 200;
            gap: 20px;
            flex-wrap: nowrap;
            pointer-events: auto;
            touch-action: none;
        }
        
        .rotate-overlay {
            display: none; /* Hidden by default, shown via .active class */
        }
        
        .rotate-overlay.active {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background: #0a0a0c;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            backdrop-filter: blur(4px);
            font-family: 'Geist', sans-serif;
        }
        
        .rotate-icon {
            width: 80px;
            height: 80px;
            border: 4px solid #ffb3b2;
            border-radius: 20px;
            position: relative;
            animation: rotateAnim 1.5s ease-in-out infinite;
        }
        
        .rotate-icon::before {
            content: "📱";
            position: absolute;
            font-size: 50px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .rotate-icon::after {
            content: "↻";
            position: absolute;
            font-size: 30px;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffb3b2;
        }
        
        .rotate-text {
            color: #ffb3b2;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            text-align: center;
        }
        
        .rotate-subtext {
            color: #5f3e3e;
            font-size: 14px;
            margin-top: 8px;
        }
        
        .joystick-area {
            width: min(20vw, 130px);
            height: min(20vw, 130px);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            position: relative;
            touch-action: none;
            border: 1px solid rgba(255, 179, 178, 0.3);
            box-shadow: none;
            transition: transform 0.1s ease;
        }
        
        .joystick-base {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .joystick-thumb {
            width: min(8vw, 55px);
            height: min(8vw, 55px);
            background: rgba(255, 82, 92, 0.45);
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            box-shadow: none;
            transition: transform 0.08s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            touch-action: none;
        }
        
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(4, min(6.5vw, 57px));
            gap: min(1.2vw, 10px);
            background: transparent;
            padding: 12px 16px;
            border-radius: 80px;
            backdrop-filter: none;
        }
        
        .action-btn {
            width: min(6.5vw, 57px);
            height: min(6.5vw, 57px);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 179, 178, 0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: bold;
            font-size: clamp(10px, 3.3vw, 15px);
            color: rgba(255, 179, 178, 0.9);
            cursor: pointer;
            transition: all 0.05s linear;
            touch-action: manipulation;
            box-shadow: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .action-btn:active { transform: scale(0.92); }
        .action-btn.special { border-color: rgba(255, 215, 0, 0.25); color: rgba(255, 215, 0, 0.9); }
        .action-btn.block { border-color: rgba(0, 219, 233, 0.25); color: rgba(0, 219, 233, 0.9); }
        .action-btn.super { background: rgba(60, 40, 0, 0.08); border-color: rgba(255, 215, 0, 0.25); color: rgba(255, 215, 0, 0.9); }
        .action-btn.jump { border-color: rgba(0, 255, 136, 0.25); color: rgba(0, 255, 136, 0.9); }
        .action-btn.dash { border-color: rgba(255, 105, 180, 0.25); color: rgba(255, 105, 180, 0.9); font-size: clamp(8px, 2.5vw, 12px); }
        .btn-label { font-size: clamp(6px, 1.6vw, 8px); letter-spacing: 1px; margin-top: 2px; opacity: 0.7; }
        
        .action-btn.touch-active {
            transform: scale(0.92);
            background: rgba(255, 82, 92, 0.6);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.8);
        }
        
        body {
            touch-action: pan-x pan-y;
            overscroll-behavior: none;
        }
        
        /* Reduced motion - top level */
        @media (prefers-reduced-motion: reduce) {
            .action-btn:active { transform: none; }
            .joystick-thumb { transition: none; }
            .rotate-icon { animation: none; }
        }
        
        /* Keyframes */
        @keyframes rotateAnim {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }
        
        /* Hide controls info on small screens - this is the only media query remaining */
        @media (max-width: 768px) {
            .controls-info { display: none !important; }
        }
    </style>
</head>

    <script>
        // ========== READ CONTROL MODE FROM URL ==========
        // This MUST run before any other setup
        const urlParams = new URLSearchParams(window.location.search);
        const controlMode = urlParams.get('controls') || 'pc'; // Default to PC if missing
        
        // Store globally for other scripts to access
        window.CONTROL_MODE = controlMode;
        
        console.log(`[Controls] Mode: ${controlMode.toUpperCase()}`);
        
        // ========== PC MODE: Skip ALL mobile setup ==========
        if (controlMode === 'pc') {
            console.log('[Controls] PC mode - removing mobile elements');
            
            // Remove mobile controls from DOM entirely
            const mobileControls = document.getElementById('mobileControls');
            const rotateOverlay = document.getElementById('rotateOverlay');
            if (mobileControls) mobileControls.remove();
            if (rotateOverlay) rotateOverlay.remove();
            
            // Set flag to prevent any mobile initialization
            window.mobileMode = false;
            
            // Skip all remaining mobile setup code
        }
        
        // ========== MOBILE MODE: Initialize mobile controls ==========
        if (controlMode === 'mobile') {
            console.log('[Controls] Mobile mode - initializing touch controls');
            
            // Show mobile controls by adding .active class
            const mobileControls = document.getElementById('mobileControls');
            const rotateOverlay = document.getElementById('rotateOverlay');
            
            if (mobileControls) {
                mobileControls.classList.add('active');
                console.log('[Controls] Mobile controls activated');
            } else {
                console.warn('[Controls] Mobile controls element not found!');
            }
            
            if (rotateOverlay) {
                rotateOverlay.classList.add('active');
            }
            
            // ========== MOBILE OPTIMIZATIONS ==========
            const TARGET_FPS = 30;
            
            let isBatteryLow = false;
            let isCharging = true;
            
            // Global mobile mode flag
            window.mobileMode = true;
            window.joystickTouchId = null;
            window.activeTouches = new Map();
            
            // Battery API - only in mobile mode
            if ('getBattery' in navigator) {
                navigator.getBattery().then(battery => {
                    isBatteryLow = battery.level < 0.2 && !battery.charging;
                    isCharging = battery.charging;
                    battery.addEventListener('levelchange', () => {
                        isBatteryLow = battery.level < 0.2 && !battery.charging;
                        if (window.gameSceneRef) {
                            window.gameSceneRef.batterySaveMode = isBatteryLow && !isCharging;
                        }
                    });
                    battery.addEventListener('chargingchange', () => {
                        isCharging = battery.charging;
                        isBatteryLow = battery.level < 0.2 && !battery.charging;
                        if (window.gameSceneRef) {
                            window.gameSceneRef.batterySaveMode = isBatteryLow && !isCharging;
                        }
                    });
                });
            }
            
            // ========== ORIENTATION ==========
            function checkOrientation() {
                if (!rotateOverlay) return;
                const isLandscape = window.innerWidth > window.innerHeight;
                rotateOverlay.classList.toggle('active', !isLandscape);
                if (mobileControls) {
                    mobileControls.style.opacity = isLandscape ? '1' : '0';
                    mobileControls.style.pointerEvents = isLandscape ? 'auto' : 'none';
                }
            }
            
            // Orientation change - just refresh the scale, don't resize
            function handleOrientationChange() {
                if (window.game && window.game.scale) {
                    window.game.scale.refresh();
                }
                checkOrientation();
            }
            
            if (screen.orientation) {
                screen.orientation.addEventListener('change', handleOrientationChange);
            } else {
                window.addEventListener('resize', handleOrientationChange);
            }
            
            // Resize handler - just refresh the scale, don't resize
            function handleResize() {
                if (window.game && window.game.scale) {
                    window.game.scale.refresh();
                }
                checkOrientation();
            }
            
            window.addEventListener('resize', handleResize);
            
            // Initial orientation check
            checkOrientation();
            
            // ========== MOBILE TOUCH CONTROLS ==========
            (function() {
                let joystickActive = false;
                let joystickCenter = { x: 0, y: 0 };
                const joystickArea = document.getElementById('joystickArea');
                const joystickThumb = document.getElementById('joystickThumb');
                const maxDist = 45;
                const deadzone = 0.15;
                let gameScene = null;
                
                const checkForGameScene = setInterval(() => {
                    if (window.gameSceneRef && window.gameSceneRef.playerAttacks) {
                        gameScene = window.gameSceneRef;
                        clearInterval(checkForGameScene);
                        console.log('Mobile controls connected to game scene');
                    }
                }, 100);
                
                function updateJoystick(touch) {
                    if (!joystickActive || !gameScene) return;
                    
                    const dx = touch.clientX - joystickCenter.x;
                    const dy = touch.clientY - joystickCenter.y;
                    const distance = Math.min(Math.hypot(dx, dy), maxDist);
                    const angle = Math.atan2(dy, dx);
                    
                    joystickThumb.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px)`;
                    
                    let normX = (distance / maxDist) * Math.cos(angle);
                    if (Math.abs(normX) < deadzone) {
                        normX = 0;
                    } else {
                        normX = (Math.abs(normX) - deadzone) / (1 - deadzone) * Math.sign(normX);
                    }
                    
                    if (normX > 0.1) {
                        gameScene.mobileRightPressed = true;
                        gameScene.mobileLeftPressed = false;
                    } else if (normX < -0.1) {
                        gameScene.mobileLeftPressed = true;
                        gameScene.mobileRightPressed = false;
                    } else {
                        gameScene.mobileLeftPressed = false;
                        gameScene.mobileRightPressed = false;
                    }
                }
                
                function resetJoystick() {
                    joystickActive = false;
                    window.joystickTouchId = null;
                    joystickThumb.style.transform = 'translate(0px, 0px)';
                    if (gameScene) {
                        gameScene.mobileLeftPressed = false;
                        gameScene.mobileRightPressed = false;
                    }
                }
                
                if (joystickArea) {
                    joystickArea.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        joystickActive = true;
                        const rect = joystickArea.getBoundingClientRect();
                        joystickCenter = {
                            x: rect.left + rect.width / 2,
                            y: rect.top + rect.height / 2
                        };
                        if (e.touches[0]) {
                            window.joystickTouchId = e.touches[0].identifier;
                            updateJoystick(e.touches[0]);
                        }
                    }, { passive: false });
                    
                    joystickArea.addEventListener('touchmove', (e) => {
                        e.preventDefault();
                        if (joystickActive) {
                            for (let i = 0; i < e.touches.length; i++) {
                                if (e.touches[i].identifier === window.joystickTouchId) {
                                    updateJoystick(e.touches[i]);
                                    break;
                                }
                            }
                        }
                    }, { passive: false });
                    
                    joystickArea.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        let stillActive = false;
                        for (let i = 0; i < e.touches.length; i++) {
                            if (e.touches[i].identifier === window.joystickTouchId) {
                                stillActive = true;
                                break;
                            }
                        }
                        if (!stillActive) {
                            resetJoystick();
                        }
                    });
                }
                
                // ========== ACTION BUTTONS ==========
                function handleTouchStart(e, btn, action) {
                    e.preventDefault();
                    const touchId = e.changedTouches[0].identifier;
                    window.activeTouches.set(touchId, btn);
                    btn.classList.add('touch-active');
                    
                    if (!gameScene || !gameScene.roundActive || gameScene.isSuperFrozen) return;
                    
                    switch(action) {
                        case 'light': if (gameScene.playerAttacks) gameScene.playerAttacks.lightAttack(); break;
                        case 'medium': if (gameScene.playerAttacks) gameScene.playerAttacks.mediumAttack(); break;
                        case 'heavy': if (gameScene.playerAttacks) gameScene.playerAttacks.heavyAttack(); break;
                        case 'special':
                            if (gameScene.playerAttacks && gameScene.specialCooldown === 0) {
                                gameScene.playerAttacks.playerSpecialAttack();
                            }
                            break;
                        case 'block': gameScene.mobileBlockPressed = true; break;
                        case 'super':
                            if (gameScene.playerAttacks && gameScene.superMeter >= 100) {
                                gameScene.playerAttacks.superMove();
                            }
                            break;
                        case 'jump':
                            if (!gameScene.isJumping && !gameScene.isAttacking && gameScene.roundActive && !gameScene.isSuperFrozen) {
                                gameScene.mobileJumpRequested = true;
                            }
                            break;
                        case 'dash':
                            if (gameScene.player && !gameScene.isAttacking && !gameScene.isJumping) {
                                const direction = gameScene.player.x < gameScene.cpu.x ? 80 : -80;
                                gameScene.player.x += direction;
                                gameScene.player.x = Math.min(Math.max(gameScene.player.x, MIN_X), MAX_X - CHARACTER_WIDTH);
                            }
                            break;
                    }
                }
                
                function handleTouchEnd(e, btn, action) {
                    e.preventDefault();
                    const touchId = e.changedTouches[0].identifier;
                    window.activeTouches.delete(touchId);
                    btn.classList.remove('touch-active');
                    if (!gameScene) return;
                    if (action === 'block' && !hasOtherBlockTouch()) gameScene.mobileBlockPressed = false;
                }
                
                function hasOtherBlockTouch() {
                    for (let [id, btn] of window.activeTouches) {
                        if (btn.getAttribute('data-action') === 'block') return true;
                    }
                    return false;
                }
                
                const buttons = document.querySelectorAll('.action-btn');
                buttons.forEach(btn => {
                    const action = btn.dataset.action;
                    btn.addEventListener('touchstart', (e) => handleTouchStart(e, btn, action), { passive: false });
                    btn.addEventListener('touchend', (e) => handleTouchEnd(e, btn, action));
                    btn.addEventListener('touchcancel', (e) => handleTouchEnd(e, btn, action));
                });
                
                document.body.addEventListener('touchmove', (e) => {
                    if (e.target.closest('.mobile-controls')) e.preventDefault();
                }, { passive: false });
                
                document.body.addEventListener('contextmenu', (e) => {
                    if (e.target.closest('.action-btn') || e.target.closest('.joystick-area')) e.preventDefault();
                });
                
                let lastTouchEnd = 0;
                document.addEventListener('touchend', (e) => {
                    const now = Date.now();
                    if (now - lastTouchEnd <= 300) e.preventDefault();
                    lastTouchEnd = now;
                }, false);
            })();
        }
    </script>
    
    <script>
        // ========== FIGHTING GAME CLASS OVERRIDE ==========
        (function() {
            const originalFightingGame = FightingGame;
            
            window.FightingGame = class extends originalFightingGame {
                constructor() {
                    super();
                    this.mobileLeftPressed = false;
                    this.mobileRightPressed = false;
                    this.mobileBlockPressed = false;
                    this.mobileJumpRequested = false;
                    this.batterySaveMode = false;
                    this.gameMode = 'offline';
                    this.playerRole = 'host';
                    this.network = null;
                    this.waitingText = null;
                    this._lastInputState = null;
                    this.isOnlineMatch = false;
                }
                
                create() {
                    super.create();
                    window.gameSceneRef = this;
                    
                    // Check if this is an online match
                    const urlParams = new URLSearchParams(window.location.search);
                    this.gameMode = urlParams.get('mode') || 'offline';
                    this.playerRole = urlParams.get('role') || 'host';
                    this.isOnlineMatch = this.gameMode === 'online';
                    
                    console.log(`[Game] Mode: ${this.gameMode}, Role: ${this.playerRole}`);
                    
                    // Battery save mode only in mobile mode
                    if (window.CONTROL_MODE === 'mobile') {
                        if ('getBattery' in navigator) {
                            navigator.getBattery().then(battery => {
                                this.batterySaveMode = battery.level < 0.2 && !battery.charging;
                                if (this.batterySaveMode) {
                                    if (this.impactFlash) this.impactFlash.setAlpha(0.2);
                                    if (this.cpuAttacks) {
                                        const originalDecide = this.cpuAttacks.decide;
                                        this.cpuAttacks.decide = () => {
                                            if (Math.random() < 0.7) originalDecide.call(this.cpuAttacks);
                                        };
                                    }
                                }
                            });
                        }
                    }
                    
                    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                        const originalShake = this.cameras.main.shake;
                        this.cameras.main.shake = () => {};
                    }
                    
                    // ===== ONLINE MODE SETUP =====
                    if (this.isOnlineMatch) {
                        // Don't start round until network is ready
                        this.roundActive = false;
                        
                        // Show connecting overlay
                        this.waitingText = this.add.text(640, 360, 'RECONNECTING TO OPPONENT...', {
                            fontFamily: 'Anybody', fontSize: '28px', color: '#ffb3b2',
                            fontStyle: 'bold italic', stroke: '#000000', strokeThickness: 3
                        }).setOrigin(0.5).setDepth(300);
                        
                        // Initialize network
                        this.network = new GameNetwork(this);
                        this.network.connect();
                    }
                }
                
                // ===== ONLINE NETWORK CALLBACKS =====
                onNetworkReady() {
                    console.log('[Game] Network ready!');
                    if (this.waitingText) {
                        this.waitingText.destroy();
                        this.waitingText = null;
                    }
                    
                    // Don't start round until countdown finishes
                    this.roundActive = false;
                    
                    let count = 3;
                    const countdown = this.add.text(640, 360, `${count}`, {
                        fontFamily: 'Anybody', fontSize: '120px', color: '#ffb3b2',
                        fontStyle: 'bold italic', stroke: '#000000', strokeThickness: 6
                    }).setOrigin(0.5).setDepth(300);
                    
                    const timer = this.time.addEvent({
                        delay: 1000,
                        repeat: 2,
                        callback: () => {
                            count--;
                            if (count > 0) {
                                countdown.setText(`${count}`);
                            } else {
                                countdown.setText('FIGHT!');
                                this.roundActive = true;
                            }
                        }
                    });
                    this.time.delayedCall(3500, () => countdown.destroy());
                }
                
                onNetworkDisconnected() {
                    console.log('[Game] Network disconnected');
                    this.roundActive = false;
                    if (this.waitingText) {
                        this.waitingText.destroy();
                        this.waitingText = null;
                    }
                    
                    const dcText = this.add.text(640, 360, 'OPPONENT DISCONNECTED', {
                        fontFamily: 'Anybody', fontSize: '32px', color: '#ff003c',
                        fontStyle: 'bold italic', stroke: '#000000', strokeThickness: 4
                    }).setOrigin(0.5).setDepth(300);
                    
                    this.time.delayedCall(3000, () => {
                        if (this.network) {
                            this.network.disconnect();
                        }
                        window.location.href = 'online.html';
                    });
                }
                
                // ===== ONLINE MODE METHODS =====
                getLocalInputState() {
                    // JustDown keys are true for exactly one frame, which is correct for 
                    // single-press actions (attacks, super). The diff check in sendInput()
                    // ensures the state change is sent and then cleared on the next frame.
                    if (window.CONTROL_MODE === 'mobile') {
                        return {
                            left: this.mobileLeftPressed || false,
                            right: this.mobileRightPressed || false,
                            jump: this.mobileJumpRequested || false,
                            light: false,
                            medium: false,
                            heavy: false,
                            special: false,
                            block: this.mobileBlockPressed || false,
                            super: false
                        };
                    }
                    return {
                        left: this.keyLeft?.isDown || false,
                        right: this.keyRight?.isDown || false,
                        jump: Phaser.Input.Keyboard.JustDown(this.keySpace),
                        light: Phaser.Input.Keyboard.JustDown(this.keyA),
                        medium: Phaser.Input.Keyboard.JustDown(this.keyS),
                        heavy: Phaser.Input.Keyboard.JustDown(this.keyD),
                        special: Phaser.Input.Keyboard.JustDown(this.keyF),
                        block: this.keyG?.isDown || false,
                        super: Phaser.Input.Keyboard.JustDown(this.keyH)
                    };
                }
                
                updateLocalPlayerInput() {
                    // Movement
                    let move = 0;
                    if (!this.mobileLeftPressed && !this.mobileRightPressed) {
                        if (this.keyLeft.isDown && !this.isAttacking && !this.isJumping) move = -1;
                        if (this.keyRight.isDown && !this.isAttacking && !this.isJumping) move = 1;
                        if (move !== 0) this.player.x += move * 7;
                    }
                    
                    if (this.mobileLeftPressed) this.player.x -= 7;
                    if (this.mobileRightPressed) this.player.x += 7;
                    
                    // Mobile jump
                    if (this.mobileJumpRequested && !this.isJumping && !this.isAttacking && this.roundActive && !this.isSuperFrozen) {
                        this.isJumping = true;
                        this.playerYVelocity = JUMP_VELOCITY;
                        this.playerJumpsUsed = 1;
                        if (this.animations) this.animations.setPlayerAnimation('jump_regular', 300);
                        this.mobileJumpRequested = false;
                        if (this.playerFloatTween) this.playerFloatTween.pause();
                    }
                    
                    // Keyboard jump
                    if (!this.mobileJumpRequested && Phaser.Input.Keyboard.JustDown(this.keySpace) && !this.isJumping && !this.isAttacking && this.roundActive && !this.isSuperFrozen) {
                        this.isJumping = true;
                        this.playerYVelocity = JUMP_VELOCITY;
                        this.playerJumpsUsed = 1;
                        if (this.animations) this.animations.setPlayerAnimation('jump_regular', 300);
                        if (this.playerFloatTween) this.playerFloatTween.pause();
                    }
                    
                    // Keyboard double jump
                    if (!this.mobileJumpRequested && Phaser.Input.Keyboard.JustDown(this.keySpace) && this.isJumping && this.playerJumpsUsed < 2 && this.playerDoubleJumpCooldown <= 0 && !this.isAttacking && this.roundActive && !this.isSuperFrozen) {
                        this.playerYVelocity = DOUBLE_JUMP_VELOCITY;
                        this.playerJumpsUsed = 2;
                        let boostDirection = 0;
                        if (this.keyLeft.isDown) boostDirection = -1;
                        else if (this.keyRight.isDown) boostDirection = 1;
                        else {
                            const facing = getFacingDirection(this.player.x, this.cpu.x, 'player');
                            boostDirection = facing === 'right' ? 1 : -1;
                        }
                        this.player.x += boostDirection * DOUBLE_JUMP_HORIZONTAL_BOOST;
                        if (this.animations) this.animations.setPlayerAnimation('jump_regular', 300);
                    }
                    
                    // Attacks
                    if (Phaser.Input.Keyboard.JustDown(this.keyA) && this.playerAttacks && !this.playerAttacks.attackState?.active) {
                        this.playerAttacks.lightAttack();
                    }
                    if (Phaser.Input.Keyboard.JustDown(this.keyS) && this.playerAttacks && !this.playerAttacks.attackState?.active) {
                        this.playerAttacks.mediumAttack();
                    }
                    if (Phaser.Input.Keyboard.JustDown(this.keyD) && this.playerAttacks && !this.playerAttacks.attackState?.active) {
                        this.playerAttacks.heavyAttack();
                    }
                    if (Phaser.Input.Keyboard.JustDown(this.keyF) && this.playerAttacks && !this.playerAttacks.attackState?.active) {
                        this.playerAttacks.playerSpecialAttack();
                    }
                    if (Phaser.Input.Keyboard.JustDown(this.keyH) && this.playerAttacks && this.superMeter >= 100 && !this.playerAttacks.attackState?.active) {
                        this.playerAttacks.superMove();
                    }
                    
                    // Blocking
                    const isBlockInputPressed = this.keyG.isDown || this.mobileBlockPressed;
                    this.isBlocking = isBlockInputPressed && !this.isAttacking && !this.isJumping;
                    
                    if (this.isBlocking) {
                        if (this.playerAura) {
                            this.playerAura.setAlpha(0.3);
                            this.playerAura.setFillStyle(0x00dbe9);
                        }
                        this.playerBlockHeight = 'mid';
                    } else {
                        if (this.playerAura) {
                            this.playerAura.setAlpha(0.15);
                            this.playerAura.setFillStyle(this.playerData?.color || 0xff5252);
                        }
                    }
                }
                
                updateOnlineMode() {
                    if (!this.network || !this.network.isConnected) return;
                    
                    // Tick cooldowns
                    if (this.playerDoubleJumpCooldown > 0) {
                        this.playerDoubleJumpCooldown = Math.max(0, this.playerDoubleJumpCooldown - 100);
                    }
                    if (this.cpuDoubleJumpCooldown > 0) {
                        this.cpuDoubleJumpCooldown = Math.max(0, this.cpuDoubleJumpCooldown - 100);
                    }
                    
                    if (this.network.isHost) {
                        // ===== HOST: Run game simulation for both players =====
                        // Player 1 (host) — read local keyboard/mobile input
                        this.updateLocalPlayerInput();
                        
                        // Player 2 (joiner) — read remote input state
                        const remote = this.network.remoteInputState;
                        if (remote.left) this.cpu.x = Math.max(this.cpu.x - 7, MIN_X + 50);
                        if (remote.right) this.cpu.x = Math.min(this.cpu.x + 7, MAX_X - 50);
                        if (remote.jump && !this.cpuIsJumping) {
                            this.cpuIsJumping = true;
                            this.cpuYVelocity = JUMP_VELOCITY;
                            this.cpuJumpsUsed = 1;
                            if (this.animations) this.animations.setCPUAnimation('jump_regular', 300);
                            if (this.cpuFloatTween) this.cpuFloatTween.pause();
                        }
                        
                        // Remote attacks (using CPU attack methods)
                        if (remote.light && !this.cpuAttacking && !this.cpuHitStun) {
                            this.cpuAttacks.lightAttack();
                        }
                        if (remote.medium && !this.cpuAttacking && !this.cpuHitStun) {
                            this.cpuAttacks.mediumAttack();
                        }
                        if (remote.heavy && !this.cpuAttacking && !this.cpuHitStun) {
                            this.cpuAttacks.heavyAttack();
                        }
                        if (remote.special && !this.cpuAttacking && !this.cpuHitStun && this.cpuSpecialCooldown === 0) {
                            this.cpuAttacks.specialAttack();
                        }
                        if (remote.block && !this.cpuAttacking) {
                            this.cpuBlocking = true;
                            this.cpuBlockHeight = 'mid';
                        } else {
                            this.cpuBlocking = false;
                        }
                        if (remote.super && this.cpuSuperMeter >= 100 && !this.cpuAttacking) {
                            this.cpuAttacks.superMove();
                        }
                        
                        // Run physics (includes CPU jump physics, boundaries, overlap prevention)
                        this.updateGamePhysics();
                        
                        // Send game state to joiner every frame
                        this.network.sendGameState({
                            playerX: this.player.x,
                            playerY: this.player.y,
                            cpuX: this.cpu.x,
                            cpuY: this.cpu.y,
                            playerHealth: this.playerHealth,
                            cpuHealth: this.cpuHealth,
                            playerAnim: this.currentAnim,
                            isBlocking: this.isBlocking,
                            cpuBlocking: this.cpuBlocking,
                            superMeter: this.superMeter,
                            cpuSuperMeter: this.cpuSuperMeter,
                            comboCount: this.comboCount,
                            playerYVelocity: this.playerYVelocity,
                            cpuYVelocity: this.cpuYVelocity,
                            isJumping: this.isJumping,
                            cpuIsJumping: this.cpuIsJumping,
                            cpuJumpsUsed: this.cpuJumpsUsed,
                            playerJumpsUsed: this.playerJumpsUsed
                        });
                        
                    } else {
                        // ===== CLIENT: Send local input, receive state =====
                        const inputState = this.getLocalInputState();
                        this.network.sendInput(inputState);
                        
                        // Clear one-shot input flags after sending
                        this.mobileJumpRequested = false;
                    }
                }
                
                applyRemoteGameState(state) {
                    // On the client's screen, swap perspective:
                    // - Host's playerX/Y becomes the opponent (cpu)
                    // - Host's cpuX/Y becomes the client's own fighter (player)
                    this.cpu.x = state.playerX;
                    this.cpu.y = state.playerY;
                    this.player.x = state.cpuX;
                    this.player.y = state.cpuY;
                    
                    // Health bars
                    this.playerHealth = state.cpuHealth; // client's own health
                    this.cpuHealth = state.playerHealth; // opponent's health
                    
                    // Super meters
                    this.superMeter = state.cpuSuperMeter;
                    this.cpuSuperMeter = state.superMeter;
                    
                    // Block states
                    this.cpuBlocking = state.isBlocking;
                    this.isBlocking = state.cpuBlocking;
                    
                    // Combo
                    this.comboCount = state.comboCount || 0;
                    
                    // Jump states (for visual sync)
                    if (state.isJumping !== undefined) {
                        this.isJumping = state.isJumping;
                        this.playerYVelocity = state.playerYVelocity || 0;
                    }
                    if (state.cpuIsJumping !== undefined) {
                        this.cpuIsJumping = state.cpuIsJumping;
                        this.cpuYVelocity = state.cpuYVelocity || 0;
                    }
                    
                    // Update UI
                    if (this.ui) this.ui.updateHealthBars();
                    
                    // Update combo text if active
                    if (this.comboText && this.comboCount > 0) {
                        this.comboText.setText(`${this.comboCount} HIT COMBO!`);
                        this.comboText.setAlpha(1);
                    }
                }
                
                applyRemoteEvent(event) {
                    console.log('[Game] Remote event:', event);
                    if (event.type === 'round_end') {
                        // Show result on client
                        const winner = event.winner;
                        const resultText = winner === 'host' ? 'OPPONENT VICTORY!' : 'YOU WIN!';
                        const resultColor = winner === 'host' ? '#ff003c' : '#4ade80';
                        
                        const announcement = this.add.text(BASE_WIDTH / 2, BASE_HEIGHT / 2, resultText, {
                            fontFamily: 'Anybody', fontSize: '52px', color: resultColor,
                            fontStyle: 'bold italic', letterSpacing: '4px',
                            stroke: '#000000', strokeThickness: 4
                        }).setOrigin(0.5);
                        announcement.setAlpha(0);
                        announcement.setScale(0.8);
                        announcement.setDepth(200);
                        
                        this.tweens.add({ targets: announcement, alpha: 1, scale: 1, duration: 600, ease: 'Back.Out' });
                        this.roundActive = false;
                        
                        this.time.delayedCall(4000, () => {
                            if (this.network) {
                                this.network.disconnect();
                            }
                            window.location.href = 'online.html';
                        });
                    }
                }
                
                // ===== OVERRIDE endGame for online mode =====
                endGame(winner) {
                    // Check if this is online mode
                    if (this.gameMode === 'online') {
                        this.roundActive = false;
                        this.time.timeScale = 1;
                        this.hasSuperArmor = false;
                        
                        // Determine winner string for network
                        let winnerStr = winner === 'player' ? 'host' : 'client';
                        
                        // Send game event to opponent
                        if (this.network && this.network.isConnected) {
                            this.network.sendGameEvent({
                                type: 'round_end',
                                winner: winnerStr
                            });
                        }
                        
                        // Show local result
                        const resultText = winner === 'player' ? 'YOU WIN!' : 'OPPONENT VICTORY!';
                        const resultColor = winner === 'player' ? '#4ade80' : '#ff003c';
                        
                        const announcement = this.add.text(BASE_WIDTH / 2, BASE_HEIGHT / 2, resultText, {
                            fontFamily: 'Anybody', fontSize: '52px', color: resultColor,
                            fontStyle: 'bold italic', letterSpacing: '4px',
                            stroke: '#000000', strokeThickness: 4
                        }).setOrigin(0.5);
                        announcement.setAlpha(0);
                        announcement.setScale(0.8);
                        announcement.setDepth(200);
                        
                        this.tweens.add({ targets: announcement, alpha: 1, scale: 1, duration: 600, ease: 'Back.Out' });
                        
                        this.time.delayedCall(4000, () => {
                            if (this.network) {
                                this.network.disconnect();
                            }
                            window.location.href = 'online.html';
                        });
                        
                        if (this.playerAttacks) this.playerAttacks.clearCreatedObjects();
                        return; // Exit early - don't call parent
                    }
                    
                    // ===== OFFLINE MODE: Original endGame logic =====
                    this.roundActive = false;
                    this.time.timeScale = 1;
                    this.hasSuperArmor = false;
                    
                    let resultText;
                    let resultColor;
                    
                    if (winner === 'player') {
                        const isPerfect = this.playerHealth === 100;
                        resultText = isPerfect ? `PERFECT! ${this.playerData.name} VICTORY!` : `${this.playerData.name} VICTORY!`;
                        resultColor = '#ffb3b2';
                        if (this.animations) this.animations.setPlayerAnimation('victory', 300);
                    } else if (winner === 'cpu') {
                        resultText = `${this.cpuData.name} VICTORY!`;
                        resultColor = '#00dbe9';
                        if (this.animations) this.animations.setCPUAnimation('victory', 300);
                    } else {
                        resultText = 'DRAW GAME!';
                        resultColor = '#ffffff';
                    }
                    
                    const announcement = this.add.text(BASE_WIDTH / 2, BASE_HEIGHT / 2, resultText, {
                        fontFamily: 'Anybody', fontSize: '52px', color: resultColor,
                        fontStyle: 'bold italic', letterSpacing: '4px',
                        stroke: '#000000', strokeThickness: 4
                    }).setOrigin(0.5);
                    announcement.setAlpha(0);
                    announcement.setScale(0.8);
                    announcement.setDepth(200);
                    
                    this.tweens.add({ targets: announcement, alpha: 1, scale: 1, duration: 600, ease: 'Back.Out' });
                    
                    const urlParams = new URLSearchParams(window.location.search);
                    const playerFighter = urlParams.get('fighter') || 'ADARSHA';
                    const arenaParam = urlParams.get('arena') || 'NEO-TOKYO';
                    
                    this.time.delayedCall(4000, () => {
                        window.location.href = `difficulty.html?fighter=${encodeURIComponent(playerFighter)}&arena=${encodeURIComponent(arenaParam)}`;
                    });
                    
                    if (this.playerAttacks) this.playerAttacks.clearCreatedObjects();
                }
                
                // Shared physics/boundary update logic - used by both PC and mobile
                updateGamePhysics() {
                    if (!this.player || !this.cpu) return;
                    
                    // Player boundary clamping
                    this.player.x = Math.min(Math.max(this.player.x, MIN_X), MAX_X - CHARACTER_WIDTH);
                    this.cpu.x = Math.min(Math.max(this.cpu.x, MIN_X + CHARACTER_WIDTH), MAX_X);
                    
                    // Prevent overlap
                    if (Math.abs(this.player.x - this.cpu.x) < 90) {
                        if (this.player.x < this.cpu.x) {
                            this.player.x = this.cpu.x - 90;
                        } else {
                            this.cpu.x = this.player.x + 90;
                        }
                    }
                    
                    // Facing direction
                    const playerFacing = getFacingDirection(this.player.x, this.cpu.x, 'player');
                    const cpuFacing = getFacingDirection(this.player.x, this.cpu.x, 'cpu');
                    this.player.setFlipX(playerFacing === 'left');
                    this.cpu.setFlipX(cpuFacing === 'left');
                    
                    // Aura positions
                    if (this.playerAura) this.playerAura.setPosition(this.player.x, this.player.y + UI.AURA_Y_OFFSET);
                    if (this.cpuAura) this.cpuAura.setPosition(this.cpu.x, this.cpu.y + UI.AURA_Y_OFFSET);
                    
                    // Player jump physics
                    if (this.isJumping) {
                        this.playerYVelocity += GRAVITY * (1/60);
                        this.player.y += this.playerYVelocity * (1/60);
                        if (this.player.y >= GROUND_Y) {
                            this.player.y = GROUND_Y;
                            this.isJumping = false;
                            this.playerYVelocity = 0;
                            if (this.playerJumpsUsed === 2) {
                                this.playerDoubleJumpCooldown = DOUBLE_JUMP_COOLDOWN_MS;
                            }
                            this.playerJumpsUsed = 0;
                            if (this.animations) this.animations.setPlayerAnimation('idle', 100);
                            if (this.playerFloatTween) this.playerFloatTween.resume();
                        }
                    }
                    
                    // CPU jump physics - ONLY run if NOT in online host mode
                    // (In online mode, CPU jumps are handled by remote input in updateOnlineMode)
                    if (this.gameMode !== 'online' || !this.network?.isHost) {
                        if (this.cpuIsJumping) {
                            this.cpuYVelocity += GRAVITY * (1/60);
                            this.cpu.y += this.cpuYVelocity * (1/60);
                            if (this.cpu.y >= GROUND_Y) {
                                this.cpu.y = GROUND_Y;
                                this.cpuIsJumping = false;
                                this.cpuYVelocity = 0;
                                if (this.cpuJumpsUsed === 2) {
                                    this.cpuDoubleJumpCooldown = DOUBLE_JUMP_COOLDOWN_MS;
                                }
                                this.cpuJumpsUsed = 0;
                                if (this.animations) this.animations.setCPUAnimation('idle', 100);
                                if (this.cpuFloatTween) this.cpuFloatTween.resume();
                            } else {
                                if (this.cpuFloatTween) this.cpuFloatTween.pause();
                            }
                        }
                    }
                    
                    // CPU launch physics (attack-launch system)
                    if (this.cpuLaunched) {
                        if (this.cpuFloatTween) this.cpuFloatTween.pause();
                        this.cpu.y += this.cpuLaunchVelocity * (1/60);
                        this.cpuLaunchVelocity += GRAVITY * (1/60);
                        if (this.cpu.y >= GROUND_Y) {
                            this.cpu.y = GROUND_Y;
                            this.cpuLaunched = false;
                            this.cpuLaunchVelocity = 0;
                            if (this.cpuFloatTween) this.cpuFloatTween.resume();
                        }
                    }
                }
                
                update(time, delta) {
                    const cappedDelta = this.batterySaveMode ? Math.min(delta, 33) : delta;
                    
                    // ===== ONLINE MODE BRANCH =====
                    if (this.gameMode === 'online') {
                        if (!this.roundActive || this.isSuperFrozen) return;
                        this.updateOnlineMode();
                        return; // Skip rest of offline update
                    }
                    
                    // ===== OFFLINE MODE: Original update logic =====
                    if (!this.roundActive || this.isSuperFrozen) return;
                    
                    // Tick down double jump cooldowns (matching specialCooldown style)
                    if (this.playerDoubleJumpCooldown > 0) {
                        this.playerDoubleJumpCooldown = Math.max(0, this.playerDoubleJumpCooldown - 100);
                    }
                    if (this.cpuDoubleJumpCooldown > 0) {
                        this.cpuDoubleJumpCooldown = Math.max(0, this.cpuDoubleJumpCooldown - 100);
                    }
                    
                    this.updateMobileMovement();
                    
                    let move = 0;
                    if (!this.mobileLeftPressed && !this.mobileRightPressed) {
                        if (this.keyLeft.isDown && !this.isAttacking && !this.isJumping) move = -1;
                        if (this.keyRight.isDown && !this.isAttacking && !this.isJumping) move = 1;
                        if (move !== 0) this.player.x += move * 7;
                    }
                    
                    // Keyboard jump - with double jump support
                    if (!this.mobileJumpRequested && Phaser.Input.Keyboard.JustDown(this.keySpace) && this.roundActive && !this.isSuperFrozen) {
                        if (!this.isJumping && !this.isAttacking) {
                            // Ground jump
                            this.isJumping = true;
                            this.playerYVelocity = JUMP_VELOCITY;
                            this.playerJumpsUsed = 1;
                            if (this.animations) this.animations.setPlayerAnimation('jump_regular', 300);
                            if (this.playerFloatTween) this.playerFloatTween.pause();
                        } else if (this.isJumping && this.playerJumpsUsed < 2 && this.playerDoubleJumpCooldown <= 0 && !this.isAttacking) {
                            // Double jump - air jump
                            this.playerYVelocity = DOUBLE_JUMP_VELOCITY;
                            this.playerJumpsUsed = 2;
                            
                            // Horizontal boost in direction of movement
                            let boostDirection = 0;
                            if (this.keyLeft.isDown) boostDirection = -1;
                            else if (this.keyRight.isDown) boostDirection = 1;
                            else {
                                // Fall back to facing direction
                                const facing = getFacingDirection(this.player.x, this.cpu.x, 'player');
                                boostDirection = facing === 'right' ? 1 : -1;
                            }
                            this.player.x += boostDirection * DOUBLE_JUMP_HORIZONTAL_BOOST;
                            
                            if (this.animations) this.animations.setPlayerAnimation('jump_regular', 300);
                        }
                    }
                    
                    // Player jump physics
                    if (this.isJumping) {
                        this.playerYVelocity += GRAVITY * (1/60);
                        this.player.y += this.playerYVelocity * (1/60);
                        
                        if (this.player.y >= GROUND_Y) {
                            this.player.y = GROUND_Y;
                            this.isJumping = false;
                            this.playerYVelocity = 0;
                            
                            // Reset jumps and set cooldown if double jump was used
                            if (this.playerJumpsUsed === 2) {
                                this.playerDoubleJumpCooldown = DOUBLE_JUMP_COOLDOWN_MS;
                            }
                            this.playerJumpsUsed = 0;
                            
                            if (this.animations) this.animations.setPlayerAnimation('idle', 100);
                            if (this.playerFloatTween) this.playerFloatTween.resume();
                        }
                    }
                    
                    // CPU jump physics
                    if (this.cpuIsJumping) {
                        this.cpuYVelocity += GRAVITY * (1/60);
                        this.cpu.y += this.cpuYVelocity * (1/60);
                        
                        if (this.cpu.y >= GROUND_Y) {
                            this.cpu.y = GROUND_Y;
                            this.cpuIsJumping = false;
                            this.cpuYVelocity = 0;
                            if (this.cpuJumpsUsed === 2) {
                                this.cpuDoubleJumpCooldown = DOUBLE_JUMP_COOLDOWN_MS;
                            }
                            this.cpuJumpsUsed = 0;
                            if (this.animations) this.animations.setCPUAnimation('idle', 100);
                            if (this.cpuFloatTween) this.cpuFloatTween.resume();
                        } else {
                            if (this.cpuFloatTween) this.cpuFloatTween.pause();
                        }
                    }
                    
                    // CPU launch physics - FIXED: Pause CPU float tween during launch
                    if (this.cpuLaunched) {
                        if (this.cpuFloatTween) this.cpuFloatTween.pause();
                        
                        this.cpu.y += this.cpuLaunchVelocity * (1/60);
                        this.cpuLaunchVelocity += GRAVITY * (1/60);
                        
                        if (this.cpu.y >= GROUND_Y) {
                            this.cpu.y = GROUND_Y;
                            this.cpuLaunched = false;
                            this.cpuLaunchVelocity = 0;
                            if (this.cpuFloatTween) this.cpuFloatTween.resume();
                        }
                    }
                    
                    // Boundaries
                    this.player.x = Math.min(Math.max(this.player.x, MIN_X), MAX_X - CHARACTER_WIDTH);
                    this.cpu.x = Math.min(Math.max(this.cpu.x, MIN_X + CHARACTER_WIDTH), MAX_X);
                    
                    // Prevent overlap
                    if (Math.abs(this.player.x - this.cpu.x) < 90) {
                        if (this.player.x < this.cpu.x) {
                            this.player.x = this.cpu.x - 90;
                        } else {
                            this.cpu.x = this.player.x + 90;
                        }
                    }
                    
                    // Facing direction
                    const playerFacing = getFacingDirection(this.player.x, this.cpu.x, 'player');
                    const cpuFacing = getFacingDirection(this.player.x, this.cpu.x, 'cpu');
                    
                    this.player.setFlipX(playerFacing === 'left');
                    this.cpu.setFlipX(cpuFacing === 'left');
                    
                    // Attack inputs
                    if (Phaser.Input.Keyboard.JustDown(this.keyA) && this.playerAttacks && !this.playerAttacks.attackState?.active) {
                        this.playerAttacks.lightAttack();
                    }
                    if (Phaser.Input.Keyboard.JustDown(this.keyS) && this.playerAttacks && !this.playerAttacks.attackState?.active) {
                        this.playerAttacks.mediumAttack();
                    }
                    if (Phaser.Input.Keyboard.JustDown(this.keyD) && this.playerAttacks && !this.playerAttacks.attackState?.active) {
                        this.playerAttacks.heavyAttack();
                    }
                    if (Phaser.Input.Keyboard.JustDown(this.keyF) && this.playerAttacks && !this.playerAttacks.attackState?.active) {
                        this.playerAttacks.playerSpecialAttack();
                    }
                    if (Phaser.Input.Keyboard.JustDown(this.keyH) && this.playerAttacks && this.superMeter >= 100 && !this.playerAttacks.attackState?.active) {
                        this.playerAttacks.superMove();
                    }
                    
                    // Blocking logic - combine keyboard and mobile
                    const isBlockInputPressed = this.keyG.isDown || this.mobileBlockPressed;
                    this.isBlocking = isBlockInputPressed && !this.isAttacking && !this.isJumping;
                    
                    if (this.isBlocking) {
                        this.playerAura.setAlpha(0.3);
                        this.playerAura.setFillStyle(0x00dbe9);
                        this.playerBlockHeight = 'mid';
                    } else {
                        this.playerAura.setAlpha(0.15);
                        this.playerAura.setFillStyle(this.playerData.color);
                    }
                    
                    // Aura positions
                    this.playerAura.setPosition(this.player.x, this.player.y + UI.AURA_Y_OFFSET);
                    this.cpuAura.setPosition(this.cpu.x, this.cpu.y + UI.AURA_Y_OFFSET);
                    
                    // Debug mode
                    if (Phaser.Input.Keyboard.JustDown(this.keyO)) {
                        toggleDebugMode();
                    }
                    
                    if (window.DEBUG_HITBOXES && this.debugGraphics) {
                        this.debugGraphics.clear();
                        
                        const playerHurtboxes = getHurtboxes('player', this.player.x, this.player.y, 'medium');
                        for (const [part, box] of Object.entries(playerHurtboxes)) {
                            drawHitbox(this.debugGraphics, box, box.color, true);
                            this.debugGraphics.fillStyle(0xffffff, 1);
                            this.debugGraphics.fillText(part, box.x + 5, box.y + 15);
                        }
                        
                        const cpuDifficulty = this.cpuSettings?.name || 'medium';
                        const cpuHurtboxes = getHurtboxes('cpu', this.cpu.x, this.cpu.y, cpuDifficulty);
                        for (const [part, box] of Object.entries(cpuHurtboxes)) {
                            drawHitbox(this.debugGraphics, box, box.color, true);
                            this.debugGraphics.fillStyle(0xffffff, 1);
                            this.debugGraphics.fillText(part, box.x + 5, box.y + 15);
                        }
                        
                        if (this.playerAttacks && this.playerAttacks.attackState) {
                            const facing = getFacingDirection(this.player.x, this.cpu.x, 'player');
                            const attackHitbox = getAttackHitbox(this.player, this.playerAttacks.attackState.type, facing, this.player.x, this.player.y);
                            if (attackHitbox) {
                                drawHitbox(this.debugGraphics, attackHitbox, 0xffaa00, true);
                                this.debugGraphics.fillStyle(0xffffff, 1);
                                this.debugGraphics.fillText('ATTACK', attackHitbox.x + 5, attackHitbox.y - 5);
                            }
                        }
                    } else if (this.debugGraphics && !window.DEBUG_HITBOXES) {
                        this.debugGraphics.clear();
                    }
                }
            };
        })();
    </script>
    
    <script>
        // ========== PHASER CONFIG ==========
        (function() {
            // window.CONTROL_MODE is guaranteed to be set above
            // If undefined for any reason, default to false (PC mode)
            const isMobileMode = window.CONTROL_MODE === 'mobile';
            
            const config = {
                // Both PC and Mobile use the same fixed 1280x720 design resolution
                type: isMobileMode ? Phaser.CANVAS : Phaser.AUTO,
                width: 1280,
                height: 720,
                parent: 'game-container',
                backgroundColor: '#050505',
                scene: FightingGame,
                scale: {
                    mode: Phaser.Scale.FIT,
                    autoCenter: Phaser.Scale.CENTER_BOTH,
                    width: 1280,
                    height: 720,
                    zoom: 1
                },
                input: {
                    activePointers: isMobileMode ? 3 : 1,
                    touch: isMobileMode
                },
                fps: {
                    target: isMobileMode ? 30 : 60,
                    forceSetTimeOut: isMobileMode,
                    min: isMobileMode ? 15 : 30
                },
                antialias: !isMobileMode,
                pixelArt: isMobileMode,
                callbacks: {
                    postBoot: (game) => {
                        if (isMobileMode && game.canvas) {
                            game.canvas.setAttribute('willReadFrequently', 'true');
                        }
                    }
                }
            };
            
            if (isMobileMode) {
                // Delayed init for mobile
                setTimeout(() => {
                    const game = new Phaser.Game(config);
                    window.game = game;
                }, 100);
            } else {
                const game = new Phaser.Game(config);
                window.game = game;
            }
        })();
    </script>
