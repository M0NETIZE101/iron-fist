<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>CHIYA GANG WARRIORS - BATTLE ARENA</title>
    
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wght@0,100..900;1,100..900&family=Geist:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Geist', sans-serif; overflow: hidden; }
        #game-container { position: relative; box-shadow: 0 0 60px rgba(255, 179, 178, 0.15); border: 1px solid rgba(255, 179, 178, 0.2); border-radius: 8px; }
        .controls-info { position: fixed; bottom: 30px; left: 30px; background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(12px); padding: 12px 24px; border-left: 3px solid #ffb3b2; font-size: 11px; font-family: 'JetBrains Mono', monospace; color: rgba(233, 188, 186, 0.9); letter-spacing: 1px; z-index: 100; pointer-events: none; border-radius: 0 8px 8px 0; }
        .controls-info span { color: #ffb3b2; }
        .controls-info .key { border: 1px solid rgba(255,179,178,0.5); padding: 2px 8px; border-radius: 4px; margin: 0 2px; background: rgba(0,0,0,0.5); }
        .back-button { position: fixed; top: 30px; left: 30px; background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(12px); padding: 10px 20px; border: 1px solid rgba(255, 179, 178, 0.4); color: #e9bcba; text-decoration: none; font-size: 12px; font-family: 'JetBrains Mono', monospace; letter-spacing: 1px; z-index: 100; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; border-radius: 8px; }
        .back-button:hover { border-color: #ffb3b2; color: #ffb3b2; transform: translateX(-4px); }
        .arena-name-display {
            position: fixed;
            top: 30px;
            right: 30px;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            padding: 10px 20px;
            border-right: 3px solid #ffb3b2;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            color: #e9bcba;
            z-index: 100;
            border-radius: 8px 0 0 8px;
            letter-spacing: 1px;
        }
        .arena-name-display span { color: #ffb3b2; font-weight: bold; }
        .difficulty-badge {
            position: fixed;
            top: 30px;
            left: 150px;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            padding: 10px 20px;
            border-left: 3px solid #00dbe9;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            color: #e9bcba;
            z-index: 100;
            border-radius: 0 8px 8px 0;
            letter-spacing: 1px;
        }
        .difficulty-badge span { color: #00dbe9; font-weight: bold; }
        .super-status {
            position: fixed;
            bottom: 100px;
            right: 30px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #ffd700;
            pointer-events: none;
            z-index: 100;
            transition: transform 0.2s ease;
        }
        @keyframes superPulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; text-shadow: 0 0 10px #ffd700; }
        }
        .super-pulse {
            animation: superPulse 0.5s ease-in-out infinite;
        }
        .cpu-super-status {
            position: fixed;
            bottom: 100px;
            left: 30px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #ffd700;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <a href="difficulty.html" class="back-button" id="backButton">
        <span class="material-symbols-outlined" style="font-size: 16px;">arrow_back</span>
        BACK
    </a>
    
    <div class="controls-info">
        <span>← →</span> MOVE &nbsp;&nbsp;|&nbsp;&nbsp; <span class="key">A</span> LIGHT &nbsp;&nbsp;|&nbsp;&nbsp; <span class="key">S</span> MEDIUM &nbsp;&nbsp;|&nbsp;&nbsp; <span class="key">D</span> HEAVY &nbsp;&nbsp;|&nbsp;&nbsp; <span class="key">F</span> SPECIAL &nbsp;&nbsp;|&nbsp;&nbsp; <span class="key">G</span> BLOCK &nbsp;&nbsp;|&nbsp;&nbsp; <span class="key">H</span> SUPER
    </div>
    
    <div class="arena-name-display">
        🏟️ <span id="arenaNameText">NEO-TOKYO</span>
    </div>
    
    <div class="difficulty-badge">
        ⚔️ <span id="difficultyText">MEDIUM</span>
    </div>
    
    <div class="super-status" id="superStatus">
        ⚡ SUPER READY ⚡
    </div>
    
    <div class="cpu-super-status" id="cpuSuperStatus">
        ⚡ CPU SUPER READY ⚡
    </div>
    
    <div id="game-container"></div>

    <!-- Shared Fighter Data -->
    <script src="fighters.js"></script>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const playerFighter = urlParams.get('fighter') || 'ADARSHA';
        const arenaParam = urlParams.get('arena') || 'NEO-TOKYO';
        const difficulty = urlParams.get('difficulty') || 'medium';
        
        document.getElementById('arenaNameText').innerText = arenaParam;
        document.getElementById('difficultyText').innerText = difficulty.toUpperCase();
        
        const backButton = document.getElementById('backButton');
        if (backButton) {
            backButton.href = `difficulty.html?fighter=${encodeURIComponent(playerFighter)}&arena=${encodeURIComponent(arenaParam)}`;
        }
        
        const difficultySettings = {
            easy: { blockChance: 0.3, damageMultiplier: 0.7, attackDelay: 1000, comboChance: 0.3, superUsageChance: 0.3, retreatThreshold: 0.25 },
            medium: { blockChance: 0.5, damageMultiplier: 1.0, attackDelay: 800, comboChance: 0.5, superUsageChance: 0.5, retreatThreshold: 0.3 },
            hard: { blockChance: 0.7, damageMultiplier: 1.3, attackDelay: 600, comboChance: 0.7, superUsageChance: 0.8, retreatThreshold: 0.35 }
        };
        const cpuSettings = difficultySettings[difficulty] || difficultySettings.medium;
        
        const arenaBackgrounds = {
            'NEO-TOKYO': 'assets/background/neo-tokyo.jpg',
            'CYBER-SHRINE': 'assets/background/cyber-shrine.jpg',
            'ORBITAL STATION': 'assets/background/orbital-station.jpg',
            'MAGMA CORE': 'assets/background/magma-core.jpg',
            'WASTELAND JUNKYARD': 'assets/background/junkyard.jpg',
            'VOID CHAMBER': 'assets/background/void-chamber.jpg'
        };
        const arenaBgImage = arenaBackgrounds[arenaParam] || arenaBackgrounds['NEO-TOKYO'];
        
        // Get fighter data from shared FIGHTERS object
        const playerData = FIGHTERS[playerFighter] || FIGHTERS['ADARSHA'];
        
        // Random CPU opponent (excluding player)
        const allFighters = Object.keys(FIGHTERS);
        const availableCPUs = allFighters.filter(f => f !== playerFighter);
        const randomCPU = availableCPUs[Math.floor(Math.random() * availableCPUs.length)];
        const cpuData = FIGHTERS[randomCPU];
        const cpuPersonality = cpuData.personality;
        
        // UNIFIED CONSTANTS
        const HEALTH_BAR_MAX_WIDTH = 400;
        const SUPER_BAR_MAX_WIDTH = 360;
        
        class FightingGame extends Phaser.Scene {
            constructor() {
                super({ key: 'FightingGame' });
                this.resetGameState();
            }
            
            resetGameState() {
                this.isAttacking = false;
                this.isBlocking = false;
                this.currentAnim = 'idle';
                this.comboCount = 0;
                this.comboTimer = 0;
                this.superMeter = 0;
                this.specialCooldown = 0;
                this.animationTimer = null;
                this.cpuAnimationTimer = null;
                this.cpuAttacking = false;
                this.cpuHitStun = 0;
                this.cpuBlocking = false;
                this.cpuBlockDecision = false;
                this.cpuSpecialCooldown = 0;
                this.cpuSuperMeter = 0;
                this.isSuperFrozen = false;
                this.superFreezeTimer = 0;
                this.minX = 200;
                this.maxX = 1080;
                this.playerHealth = 100;
                this.cpuHealth = 100;
                this.roundActive = true;
                this.roundTimer = 99;
                this.superFlashEffect = null;
                this.hasSuperArmor = false;
                
                // Block height tracking
                this.playerBlockHeight = 'mid';
                this.cpuBlockHeight = 'mid';
            }
            
            // Helper method to get facing direction
            getFacingDirection(character) {
                if (character === 'player') {
                    return this.player.x < this.cpu.x ? 'right' : 'left';
                } else {
                    return this.cpu.x < this.player.x ? 'right' : 'left';
                }
            }
            
            preload() {
                this.load.image('arenaBg', arenaBgImage);
                
                // ADARSHA SPRITES
                this.load.image(`adarsha_idle`, `assets/characters/adarsha/idle.png`);
                this.load.image(`adarsha_punch-left`, `assets/characters/adarsha/punch-left.png`);
                this.load.image(`adarsha_punch-right`, `assets/characters/adarsha/punch-right.png`);
                this.load.image(`adarsha_kick`, `assets/characters/adarsha/kick.png`);
                this.load.image(`adarsha_special`, `assets/characters/adarsha/kick.png`);
                this.load.image(`adarsha_victory`, `assets/characters/adarsha/victory.png`);
                this.load.image(`adarsha_hurt`, `assets/characters/adarsha/hurt.png`);
                
                // ASHMIN SPRITES
                this.load.image(`ashmin_idle`, `assets/characters/ashmin/idle.png`);
                this.load.image(`ashmin_punch-left`, `assets/characters/ashmin/punch-left.png`);
                this.load.image(`ashmin_punch-right`, `assets/characters/ashmin/punch-right.png`);
                this.load.image(`ashmin_kick`, `assets/characters/ashmin/kick.png`);
                this.load.image(`ashmin_special`, `assets/characters/ashmin/kick.png`);
                this.load.image(`ashmin_victory`, `assets/characters/ashmin/victory.png`);
                this.load.image(`ashmin_hurt`, `assets/characters/ashmin/hurt.png`);
                this.load.image(`ashmin_dragon_1`, `assets/characters/ashmin/dragon_frame1.png`);
                this.load.image(`ashmin_dragon_2`, `assets/characters/ashmin/dragon_frame2.png`);
                this.load.image(`ashmin_dragon_3`, `assets/characters/ashmin/dragon_frame3.png`);
                this.load.image(`ashmin_coin_explosion`, `assets/characters/ashmin/coin_explosion.png`);
                
                // ALPINE SPRITES
                this.load.image(`alpine_idle`, `assets/characters/alpine/idle.png`);
                this.load.image(`alpine_punch-left`, `assets/characters/alpine/punch-left.png`);
                this.load.image(`alpine_punch-right`, `assets/characters/alpine/punch-right.png`);
                this.load.image(`alpine_kick-left`, `assets/characters/alpine/kick-left.png`);
                this.load.image(`alpine_kick-right`, `assets/characters/alpine/kick-right.png`);
                this.load.image(`alpine_special_drink`, `assets/characters/alpine/special_drink.png`);
                this.load.image(`alpine_special_powerup`, `assets/characters/alpine/special_powerup.png`);
                this.load.image(`alpine_special_attack`, `assets/characters/alpine/special_attack.png`);
                this.load.image(`alpine_victory`, `assets/characters/alpine/victory.png`);
                this.load.image(`alpine_hurt`, `assets/characters/alpine/hurt.png`);
                this.load.image(`energyFist`, `assets/effects/energy_fist.png`);
                
                // PRESIDENT SPRITES
                this.load.image(`president_idle`, `assets/characters/president/idle.png`);
                this.load.image(`president_punch-left`, `assets/characters/president/punch-left.png`);
                this.load.image(`president_punch-right`, `assets/characters/president/punch-right.png`);
                this.load.image(`president_kick`, `assets/characters/president/kick.png`);
                this.load.image(`president_special`, `assets/characters/president/special.png`);
                this.load.image(`president_victory`, `assets/characters/president/victory.png`);
                this.load.image(`president_hurt`, `assets/characters/president/hurt.png`);
            }
            
            create() {
                this.resetGameState();
                
                if (this.textures.exists('arenaBg')) {
                    const bg = this.add.image(640, 360, 'arenaBg');
                    bg.setDisplaySize(1280, 720);
                    bg.setDepth(0);
                } else {
                    const bg = this.add.graphics();
                    bg.fillStyle(0x0a0a0a, 1);
                    bg.fillRect(0, 0, 1280, 720);
                    bg.setDepth(0);
                }
                
                const ground = this.add.rectangle(640, 580, 1280, 140, 0x000000);
                ground.setAlpha(0.4);
                ground.setDepth(1);
                
                this.player = this.add.sprite(400, 460, `${playerData.folder}_idle`);
                this.player.setDisplaySize(180, 270);
                this.player.setDepth(10);
                
                this.playerAura = this.add.ellipse(400, 500, 140, 180, playerData.color);
                this.playerAura.setAlpha(0.15);
                this.playerAura.setDepth(5);
                
                this.cpu = this.add.sprite(900, 460, `${cpuData.folder}_idle`);
                this.cpu.setDisplaySize(180, 270);
                this.cpu.setDepth(10);
                
                this.cpuAura = this.add.ellipse(900, 500, 140, 180, cpuData.color);
                this.cpuAura.setAlpha(0.15);
                this.cpuAura.setDepth(5);
                
                this.createHealthBars();
                this.createSuperMeters();
                
                this.comboText = this.add.text(640, 160, '', { 
                    fontFamily: 'Anybody', fontSize: '28px', color: '#ffd700', fontStyle: 'bold italic',
                    stroke: '#000000', strokeThickness: 3
                }).setOrigin(0.5);
                this.comboText.setAlpha(0);
                this.comboText.setDepth(30);
                
                const timerBg = this.add.rectangle(640, 40, 100, 36, 0x000000);
                timerBg.setStrokeStyle(2, 0xff5252);
                timerBg.setDepth(19);
                
                this.timerText = this.add.text(640, 40, '99', { 
                    fontFamily: 'JetBrains Mono', fontSize: '22px', color: '#ffb3b2', fontWeight: 'bold'
                }).setOrigin(0.5).setDepth(20);
                
                this.add.text(640, 62, 'SECONDS', { 
                    fontFamily: 'JetBrains Mono', fontSize: '7px', color: '#666666', letterSpacing: '2px'
                }).setOrigin(0.5).setDepth(20);
                
                const vsText = this.add.text(640, 320, 'VS', { 
                    fontFamily: 'Anybody', fontSize: '120px', color: '#ffffff', fontStyle: 'italic', 
                    fontWeight: '900', stroke: '#ffb3b2', strokeThickness: 4
                }).setOrigin(0.5);
                vsText.setAlpha(0.3);
                vsText.setAngle(-5);
                vsText.setDepth(25);
                this.tweens.add({ targets: vsText, alpha: 0, duration: 1000, delay: 1500, onComplete: () => vsText.destroy() });
                
                // Input keys
                this.keyA = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.A);
                this.keyS = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.S);
                this.keyD = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.D);
                this.keyF = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.F);
                this.keyG = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.G);
                this.keyH = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.H);
                this.keyLeft = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.LEFT);
                this.keyRight = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.RIGHT);
                
                this.setupGameTimers();
                
                this.impactFlash = this.add.rectangle(640, 360, 1280, 720, 0xffffff);
                this.impactFlash.setAlpha(0);
                this.impactFlash.setDepth(100);
                
                this.tweens.add({ targets: this.player, y: this.player.y - 3, duration: 1500, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
                this.tweens.add({ targets: this.cpu, y: this.cpu.y - 3, duration: 1500, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
            }
            
            createHealthBars() {
                // PLAYER HEALTH BAR
                const playerBarBg = this.add.rectangle(200, 40, HEALTH_BAR_MAX_WIDTH, 24, 0x1a1a1a);
                playerBarBg.setStrokeStyle(2, playerData.accent);
                playerBarBg.setOrigin(0, 0.5);
                playerBarBg.setDepth(20);
                
                this.healthBarPlayer = this.add.rectangle(200, 40, HEALTH_BAR_MAX_WIDTH, 18, playerData.color);
                this.healthBarPlayer.setOrigin(0, 0.5);
                this.healthBarPlayer.setDepth(21);
                
                const playerNameBg = this.add.rectangle(200, 20, 140, 20, 0x000000);
                playerNameBg.setOrigin(0, 0.5);
                playerNameBg.setStrokeStyle(1, playerData.accent);
                playerNameBg.setDepth(20);
                this.add.text(200, 20, playerData.name, { 
                    fontFamily: 'JetBrains Mono', fontSize: '10px', color: '#ffb3b2', letterSpacing: '2px', fontWeight: 'bold'
                }).setOrigin(0, 0.5).setDepth(21);
                
                this.playerHealthText = this.add.text(200, 60, '100%', { 
                    fontFamily: 'JetBrains Mono', fontSize: '9px', color: '#aaaaaa', fontWeight: 'bold'
                }).setOrigin(0, 0.5).setDepth(21);
                
                // CPU HEALTH BAR - Right-aligned
                const cpuBarBg = this.add.rectangle(1280, 40, HEALTH_BAR_MAX_WIDTH, 24, 0x1a1a1a);
                cpuBarBg.setStrokeStyle(2, cpuData.accent);
                cpuBarBg.setOrigin(1, 0.5);
                cpuBarBg.setDepth(20);
                
                this.healthBarCPU = this.add.rectangle(1280, 40, HEALTH_BAR_MAX_WIDTH, 18, cpuData.color);
                this.healthBarCPU.setOrigin(1, 0.5);
                this.healthBarCPU.setDepth(21);
                
                const cpuNameBg = this.add.rectangle(1280, 20, 140, 20, 0x000000);
                cpuNameBg.setOrigin(1, 0.5);
                cpuNameBg.setStrokeStyle(1, cpuData.accent);
                cpuNameBg.setDepth(20);
                this.add.text(1280, 20, cpuData.name, { 
                    fontFamily: 'JetBrains Mono', fontSize: '10px', color: '#00dbe9', letterSpacing: '2px', fontWeight: 'bold'
                }).setOrigin(1, 0.5).setDepth(21);
                
                this.cpuHealthText = this.add.text(1280, 60, '100%', { 
                    fontFamily: 'JetBrains Mono', fontSize: '9px', color: '#aaaaaa', fontWeight: 'bold'
                }).setOrigin(1, 0.5).setDepth(21);
            }
            
            createSuperMeters() {
                // PLAYER SUPER METER
                const playerSuperBg = this.add.rectangle(200, 85, SUPER_BAR_MAX_WIDTH, 12, 0x1a1a1a);
                playerSuperBg.setOrigin(0, 0.5);
                playerSuperBg.setStrokeStyle(1, 0xffd700);
                playerSuperBg.setDepth(19);
                
                this.superBar = this.add.rectangle(200, 85, 0, 8, 0xffd700);
                this.superBar.setOrigin(0, 0.5);
                this.superBar.setDepth(20);
                
                this.add.text(200, 78, 'SUPER METER', { 
                    fontFamily: 'JetBrains Mono', fontSize: '7px', color: '#ffd700', letterSpacing: '3px', fontWeight: 'bold'
                }).setOrigin(0, 0.5).setDepth(20);
                
                this.superText = this.add.text(200, 97, '0%', { 
                    fontFamily: 'JetBrains Mono', fontSize: '7px', color: '#888888'
                }).setOrigin(0, 0.5).setDepth(20);
                
                // CPU SUPER METER - Right-aligned
                const cpuSuperBg = this.add.rectangle(1280, 85, SUPER_BAR_MAX_WIDTH, 12, 0x1a1a1a);
                cpuSuperBg.setOrigin(1, 0.5);
                cpuSuperBg.setStrokeStyle(1, 0xffd700);
                cpuSuperBg.setDepth(19);
                
                this.cpuSuperBar = this.add.rectangle(1280, 85, 0, 8, 0xffd700);
                this.cpuSuperBar.setOrigin(1, 0.5);
                this.cpuSuperBar.setDepth(20);
                this.cpuSuperBar.setAlpha(0.8);
                
                this.add.text(1280, 78, 'CPU SUPER', { 
                    fontFamily: 'JetBrains Mono', fontSize: '7px', color: '#ffd700', letterSpacing: '2px', fontWeight: 'bold'
                }).setOrigin(1, 0.5).setDepth(20);
                
                this.cpuSuperText = this.add.text(1280, 97, '0%', { 
                    fontFamily: 'JetBrains Mono', fontSize: '7px', color: '#888888'
                }).setOrigin(1, 0.5).setDepth(20);
            }
            
            setupGameTimers() {
                this.time.addEvent({
                    delay: 1000,
                    callback: () => {
                        if (this.roundActive && this.roundTimer > 0 && !this.isSuperFrozen) {
                            this.roundTimer--;
                            this.timerText.setText(this.roundTimer.toString().padStart(2, '0'));
                            if (this.roundTimer <= 10) this.timerText.setColor('#ff003c');
                            if (this.roundTimer === 0) this.endGameByTimeout();
                        }
                    },
                    loop: true
                });
                
                this.time.addEvent({
                    delay: 100,
                    callback: () => {
                        if (this.roundActive && this.superMeter < 100 && !this.isSuperFrozen) {
                            this.superMeter = Math.min(100, this.superMeter + 1);
                            this.updateHealthBars();
                            const superStatus = document.getElementById('superStatus');
                            if (superStatus) {
                                if (this.superMeter >= 100) {
                                    superStatus.style.opacity = '1';
                                    superStatus.classList.add('super-pulse');
                                } else {
                                    superStatus.style.opacity = '0';
                                    superStatus.classList.remove('super-pulse');
                                }
                            }
                        }
                    },
                    loop: true
                });
                
                this.time.addEvent({
                    delay: 100,
                    callback: () => {
                        if (this.roundActive && this.cpuSuperMeter < 100 && !this.isSuperFrozen) {
                            this.cpuSuperMeter = Math.min(100, this.cpuSuperMeter + 0.8);
                            this.updateHealthBars();
                            const cpuSuperStatus = document.getElementById('cpuSuperStatus');
                            if (cpuSuperStatus) {
                                cpuSuperStatus.style.opacity = this.cpuSuperMeter >= 100 ? '1' : '0';
                            }
                        }
                    },
                    loop: true
                });
                
                this.time.addEvent({
                    delay: 100,
                    callback: () => {
                        if (this.isSuperFrozen) return;
                        if (this.comboTimer > 0) {
                            this.comboTimer--;
                            if (this.comboTimer === 0) {
                                this.comboCount = 0;
                                this.comboText.setAlpha(0);
                            }
                        }
                        if (this.specialCooldown > 0) this.specialCooldown--;
                        if (this.cpuSpecialCooldown > 0) this.cpuSpecialCooldown--;
                        if (this.cpuHitStun > 0) this.cpuHitStun--;
                    },
                    loop: true
                });
                
                this.time.addEvent({
                    delay: cpuSettings.attackDelay,
                    callback: () => this.cpuDecide(),
                    loop: true
                });
            }
            
            updateHealthBars() {
                let playerWidth = HEALTH_BAR_MAX_WIDTH * (this.playerHealth / 100);
                playerWidth = Math.min(Math.max(playerWidth, 0), HEALTH_BAR_MAX_WIDTH);
                this.healthBarPlayer.width = playerWidth;

            setPlayerAnimation(animName, duration = 200, bypassFreeze = false, bypassAttackGuard = false) {
                if (this.isAttacking && !bypassAttackGuard && animName !== 'hurt') return;
                if (!bypassFreeze && this.isSuperFrozen) return;
                
                let textureKey;
                const facing = this.getFacingDirection('player');
                
                switch(animName) {
                    case 'hurt': textureKey = `${playerData.folder}_hurt`; break;
                    case 'light': textureKey = `${playerData.folder}_punch-${facing}`; break;
                    case 'medium': textureKey = `${playerData.folder}_punch-${facing}`; break;
                    case 'heavy': 
                        if (playerData.name === 'ALPINE') {
                            textureKey = `${playerData.folder}_kick-${facing}`;
                        } else {
                            textureKey = `${playerData.folder}_kick`;
                        }
                        break;
                    case 'special': 
                        if (playerData.name === 'ALPINE') {
                            textureKey = `${playerData.folder}_special_drink`;
                        } else {
                            textureKey = `${playerData.folder}_special`;
                        }
                        break;
                    case 'special_drink': textureKey = `${playerData.folder}_special_drink`; break;
                    case 'special_powerup': textureKey = `${playerData.folder}_special_powerup`; break;
                    case 'special_attack': textureKey = `${playerData.folder}_special_attack`; break;
                    case 'victory': textureKey = `${playerData.folder}_victory`; break;
                    default: textureKey = `${playerData.folder}_idle`;
                }
                
                if (this.textures.exists(textureKey)) {
                    if (animName !== 'hurt' && !bypassAttackGuard) this.isAttacking = true;
                    this.currentAnim = animName;
                    this.player.setTexture(textureKey);
                    
                    if (this.animationTimer) this.animationTimer.remove();
                    
                    this.animationTimer = this.time.delayedCall(duration, () => {
                        if (this.roundActive && this.currentAnim !== 'victory') {
                            this.player.setTexture(`${playerData.folder}_idle`);
                            this.currentAnim = 'idle';
                        }
                        if (animName !== 'hurt' && !bypassAttackGuard) this.isAttacking = false;
                        this.animationTimer = null;
                    });
                }
            }

                // Only ASHMIN has this special
                if (playerData.name !== 'ASHMIN') {

                const startX = this.player.x + (direction * 50);
                const startY = this.player.y - 30;
                
                // ========== STEP 2: Golden Dragon appears at fist ==========
                this.time.delayedCall(100, () => {
                    if (!this.roundActive) return;
                    
                    // Create dragon frame 1
                    const dragon1 = this.add.image(startX, startY, 'ashmin_dragon_1');

                    // ========== STEP 3: Dragon flies across screen ==========
                    this.time.delayedCall(80, () => {
                        if (!this.roundActive) return;
                        
                        dragon1.setTexture('ashmin_dragon_2');
                        dragon1.setDisplaySize(100, 100);
                        
                        // Move dragon toward opponent
                        const targetX = this.cpu.x - (direction * 30);
                        this.tweens.add({
                            targets: dragon1,
                            x: targetX,
                            y: this.cpu.y - 40,
                            duration: 200,
                            ease: 'Power2'
                        });
                        
                        // ========== STEP 4: Dragon transforms to frame 3 ==========
                        this.time.delayedCall(200, () => {
                            if (!this.roundActive || !dragon1.active) return;
                            
                            dragon1.setTexture('ashmin_dragon_3');
                            dragon1.setDisplaySize(120, 120);
                            this.cameras.main.shake(150, 0.01);
                            
                            // Check if dragon hit opponent
                            const distance = Math.abs(dragon1.x - this.cpu.x);
                            const canHit = distance < 60;
                            
                            if (canHit) {
                                const isBlocked = this.cpuBlocking;
                                
                                // ========== STEP 5: Visual effect based on block/hit ==========
                                if (isBlocked) {
                                    // Show block spark
                                    const blockSpark = this.add.rectangle(this.cpu.x, this.cpu.y - 30, 50, 50, 0x00dbe9);
                                    blockSpark.setAlpha(0.7);
                                    this.tweens.add({ targets: blockSpark, alpha: 0, scale: 0.5, duration: 150, onComplete: () => blockSpark.destroy() });
                                } else {
                                    // Show coin explosion
                                    const coinExplosion = this.add.image(this.cpu.x, this.cpu.y - 50, 'ashmin_coin_explosion');
                                    coinExplosion.setDisplaySize(120, 120);
                                    coinExplosion.setDepth(60);
                                    this.tweens.add({ targets: coinExplosion, scale: 1.3, alpha: 0, duration: 400, onComplete: () => coinExplosion.destroy() });
                                    
                                    // Add a second smaller explosion for impact feel
                                    const impactFlash = this.add.image(this.cpu.x, this.cpu.y - 20, 'ashmin_coin_explosion');
                                    impactFlash.setDisplaySize(60, 60);
                                    impactFlash.setDepth(61);
                                    this.tweens.add({ targets: impactFlash, scale: 1.5, alpha: 0, duration: 200, onComplete: () => impactFlash.destroy() });
                                }
                                
                                // Damage opponent (scaled with power stat)
                                const baseDamage = 25;
                                const damage = isBlocked ? Math.floor(baseDamage * 0.25) : Math.floor(baseDamage * (playerData.power / 100));
                                this.cpuHealth = Math.max(0, this.cpuHealth - damage);
                                this.applyHitEffect(this.cpu, damage, true);
                                this.setCPUAnimation('heavy', 150);
                                this.updateHealthBars();
                                
                                // Impact freeze frame
                                this.time.timeScale = 0.1;
                                this.time.delayedCall(100, () => { this.time.timeScale = 1; });
                                
                                // Special impact text
                                const specialText = this.add.text(640, 360, 'GOLDEN DRAGON FIST!', {
                                    fontFamily: 'Anybody', fontSize: '32px', color: '#ffd700', fontStyle: 'bold italic',
                                    stroke: '#000000', strokeThickness: 3
                                }).setOrigin(0.5);
                                this.tweens.add({ targets: specialText, alpha: 0, scale: 1.5, duration: 600, onComplete: () => specialText.destroy() });
                                
                                // Extra combo
                                if (!isBlocked) {
                                    this.comboCount += 3;
                                    this.comboText.setText(`DRAGON FIST! ${this.comboCount} HITS!`);
                                    this.comboText.setAlpha(1);
                                }
                                
                                if (this.cpuHealth <= 0) this.endGame('player');
                            } else {
                                // MISS - clean up dragon
                                this.time.delayedCall(100, () => {
                                    if (dragon1 && dragon1.active) dragon1.destroy();
                                });
                            }
                            
                            // Clean up dragon after hit/miss

                                if (dragon1 && dragon1.active) dragon1.destroy();
                            });
                        });
                    });

                    this.hasSuperArmor = false;
                });

            cpuDecide() {
                if (!this.roundActive || this.cpuAttacking || this.cpuHitStun > 0 || this.isSuperFrozen) return;
                
                const distance = Math.abs(this.cpu.x - this.player.x);
                const healthPercent = this.cpuHealth / 100;
                const retreatThreshold = cpuSettings.retreatThreshold;
                const isLowHealth = healthPercent < retreatThreshold;
                
                // Continuous movement
                const movementSpeed = 7;
                const optimalRange = cpuPersonality.optimalRange;
                
                if (isLowHealth) {
                    // Retreat behavior - move away from player
                    if (this.cpu.x < this.player.x) {
                        this.cpu.x = Math.max(this.cpu.x - movementSpeed, this.minX + 50);
                    } else {
                        this.cpu.x = Math.min(this.cpu.x + movementSpeed, this.maxX - 50);
                    }
                } else if (distance > optimalRange + 20) {
                    if (this.cpu.x < this.player.x) {
                        this.cpu.x = Math.min(this.cpu.x + movementSpeed, this.maxX - 50);
                    } else {
                        this.cpu.x = Math.max(this.cpu.x - movementSpeed, this.minX + 50);
                    }
                } else if (distance < optimalRange - 30 && cpuPersonality.movementStyle !== 'FORWARD') {
                    if (this.cpu.x < this.player.x) {
                        this.cpu.x = Math.max(this.cpu.x - movementSpeed, this.minX + 50);
                    } else {
                        this.cpu.x = Math.min(this.cpu.x + movementSpeed, this.maxX - 50);
                    }
                }
                
                // Check for super usage
                if (this.cpuSuperMeter >= 100 && Math.random() < cpuSettings.superUsageChance && distance < 140) {
                    this.cpuSuperMove();
                    return;
                }
                
                // Block decision based on personality
                let blockChance = cpuSettings.blockChance;
                if (cpuPersonality.defenseStyle === 'AGGRESSIVE_BLOCK') blockChance += 0.1;
                if (cpuPersonality.defenseStyle === 'PASSIVE_BLOCK') blockChance -= 0.1;
                this.cpuBlockDecision = Math.random() < blockChance && distance < 120;
                if (!this.cpuAttacking) {
                    this.cpuBlocking = this.cpuBlockDecision;
                    this.cpuBlockHeight = Math.random() < 0.5 ? 'mid' : 'low';
                }
                
                // Attack decision
                const attackRange = cpuPersonality.optimalRange + 30;
                const shouldAttack = !isLowHealth || distance < 80;
                
                if (distance < attackRange && Math.random() < 0.5 && !this.cpuAttacking && shouldAttack) {
                    const attackChoice = Math.random();
                    const personality = cpuPersonality;
                    
                    let specialChance;
                    if (personality.type === 'ZONER') {
                        specialChance = 0.4;
                    } else if (personality.specialUsage === 'OFFENSIVE') {
                        specialChance = 0.25;
                    } else if (personality.specialUsage === 'REACTIVE') {
                        specialChance = 0.2;
                    } else {
                        specialChance = 0.15;
                    }
                    
                    if (attackChoice < specialChance && this.cpuSpecialCooldown === 0) {
                        this.cpuSpecialAttack();
                        return;
                    }
                    
                    let lightWeight = 0.33, mediumWeight = 0.33, heavyWeight = 0.34;
                    
                    if (personality.type === 'ZONER') {
                        lightWeight = 0.2;
                        mediumWeight = 0.4;
                        heavyWeight = 0.2;
                    } else if (personality.playStyle === 'AGGRESSIVE') {
                        lightWeight = 0.5;
                        mediumWeight = 0.3;
                        heavyWeight = 0.2;
                    } else if (personality.playStyle === 'DEFENSIVE') {
                        lightWeight = 0.5;
                        mediumWeight = 0.3;
                        heavyWeight = 0.2;
                    } else if (personality.playStyle === 'BULLDOZER') {
                        heavyWeight = 0.6;
                        mediumWeight = 0.25;
                        lightWeight = 0.15;
                    } else if (personality.playStyle === 'COUNTER') {
                        mediumWeight = 0.45;
                        lightWeight = 0.3;
                        heavyWeight = 0.25;
                    }
                    
                    if (attackChoice < lightWeight) {
                        this.cpuLightAttack();
                    } else if (attackChoice < lightWeight + mediumWeight) {
                        this.cpuMediumAttack();
                    } else {
                        this.cpuHeavyAttack();
                    }
                }
            }
            
            applyHitEffect(target, damage, isHeavy) {
                this.cameras.main.shake(isHeavy ? 120 : 80, 0.008);
                
                if (target === this.cpu) {
                    this.setCPUAnimation('hurt', 150);
                } else {
                    this.setPlayerAnimation('hurt', 150);
                }
                
                target.setAlpha(0.5);
                this.time.delayedCall(100, () => target.setAlpha(1));
                
                const dmgText = this.add.text(target.x, target.y - 50, `${damage}`, {
                    fontFamily: 'JetBrains Mono', fontSize: isHeavy ? '32px' : '24px',
                    color: isHeavy ? '#ff003c' : '#ffb3b2', fontStyle: 'bold',
                    stroke: '#000000', strokeThickness: 2
                }).setOrigin(0.5);
                dmgText.setDepth(50);
                this.tweens.add({ targets: dmgText, y: dmgText.y - 60, alpha: 0, scale: 1.3, duration: 500, onComplete: () => dmgText.destroy() });
                
                if (target === this.cpu) {
                    target.x += isHeavy ? 40 : 25;
                } else {
                    target.x -= isHeavy ? 40 : 25;
                }
                
                if (isHeavy) {
                    this.tweens.add({ targets: this.impactFlash, alpha: 0.4, duration: 100, yoyo: true });
                }
            }
            
            updateCombo() {
                this.comboCount++;
                this.comboTimer = 30;
                this.comboText.setText(`${this.comboCount} HIT COMBO!`);
                this.comboText.setAlpha(1);
                this.comboText.setScale(1.2);
                this.tweens.add({ targets: this.comboText, scale: 1, duration: 200 });
                
                this.superMeter = Math.min(100, this.superMeter + 5);
                this.updateHealthBars();
            }
            
            endGameByTimeout() {
                if (this.playerHealth > this.cpuHealth) {
                    this.endGame('player');
                } else if (this.cpuHealth > this.playerHealth) {
                    this.endGame('cpu');
                } else {
                    this.endGame('draw');
                }
            }
            
            update() {
                if (!this.roundActive || this.isSuperFrozen) return;
                
                // Player movement
                let move = 0;
                if (this.keyLeft.isDown && !this.isAttacking) move = -1;
                if (this.keyRight.isDown && !this.isAttacking) move = 1;
                if (move !== 0) this.player.x += move * 7;
                
                // Continuous CPU movement
                const distance = Math.abs(this.cpu.x - this.player.x);
                const healthPercent = this.cpuHealth / 100;
                const retreatThreshold = cpuSettings.retreatThreshold;
                const isLowHealth = healthPercent < retreatThreshold;
                const movementSpeed = 7;
                const optimalRange = cpuPersonality.optimalRange;
                
                if (isLowHealth) {
                    if (this.cpu.x < this.player.x) {
                        this.cpu.x = Math.max(this.cpu.x - movementSpeed, this.minX + 50);
                    } else {
                        this.cpu.x = Math.min(this.cpu.x + movementSpeed, this.maxX - 50);
                    }
                } else if (distance > optimalRange + 20) {
                    if (this.cpu.x < this.player.x) {
                        this.cpu.x = Math.min(this.cpu.x + movementSpeed, this.maxX - 50);
                    } else {
                        this.cpu.x = Math.max(this.cpu.x - movementSpeed, this.minX + 50);
                    }
                } else if (distance < optimalRange - 30 && cpuPersonality.movementStyle !== 'FORWARD') {
                    if (this.cpu.x < this.player.x) {
                        this.cpu.x = Math.max(this.cpu.x - movementSpeed, this.minX + 50);
                    } else {
                        this.cpu.x = Math.min(this.cpu.x + movementSpeed, this.maxX - 50);
                    }
                }
                
                // Boundaries
                this.player.x = Math.min(Math.max(this.player.x, this.minX), this.maxX - 100);
                this.cpu.x = Math.min(Math.max(this.cpu.x, this.minX + 100), this.maxX);
                
                // Prevent overlap
                if (Math.abs(this.player.x - this.cpu.x) < 90) {
                    if (this.player.x < this.cpu.x) {
                        this.player.x = this.cpu.x - 90;
                    } else {
                        this.cpu.x = this.player.x + 90;
                    }
                }
                
                // Update facing directions
                const playerFacing = this.getFacingDirection('player');
                const cpuFacing = this.getFacingDirection('cpu');
                
                this.player.setFlipX(playerFacing === 'left');
                this.cpu.setFlipX(cpuFacing === 'left');
                
                // Attack inputs
                if (Phaser.Input.Keyboard.JustDown(this.keyA)) this.playerLightAttack();
                if (Phaser.Input.Keyboard.JustDown(this.keyS)) this.playerMediumAttack();
                if (Phaser.Input.Keyboard.JustDown(this.keyD)) this.playerHeavyAttack();
                if (Phaser.Input.Keyboard.JustDown(this.keyF)) this.playerSpecialAttack();
                if (Phaser.Input.Keyboard.JustDown(this.keyH) && this.superMeter >= 100) this.playerSuperMove();
                
                this.isBlocking = this.keyG.isDown && !this.isAttacking;
                if (this.isBlocking) {
                    this.playerAura.setAlpha(0.3);
                    this.playerAura.setFillStyle(0x00dbe9);
                    this.playerBlockHeight = 'mid';
                } else {
                    this.playerAura.setAlpha(0.15);
                    this.playerAura.setFillStyle(playerData.color);
                }
                
                this.playerAura.setPosition(this.player.x, this.player.y + 10);
                this.cpuAura.setPosition(this.cpu.x, this.cpu.y + 10);
            }
            
            endGame(winner) {
                this.roundActive = false;
                this.time.timeScale = 1;
                this.hasSuperArmor = false;  // FIXED: Reset super armor on round end
                
                let resultText;
                let resultColor;
                
                if (winner === 'player') {
                    const isPerfect = this.playerHealth === 100;
                    resultText = isPerfect ? `PERFECT! ${playerData.name} VICTORY!` : `${playerData.name} VICTORY!`;
                    resultColor = '#ffb3b2';
                    if (this.player.setTexture) this.player.setTexture(`${playerData.folder}_victory`);
                } else if (winner === 'cpu') {
                    resultText = `${cpuData.name} VICTORY!`;
                    resultColor = '#00dbe9';
                    if (this.cpu.setTexture) this.cpu.setTexture(`${cpuData.folder}_victory`);
                } else {
                    resultText = 'DRAW GAME!';
                    resultColor = '#ffffff';
                }
                
                const announcement = this.add.text(640, 360, resultText, {
                    fontFamily: 'Anybody', fontSize: '52px', color: resultColor,
                    fontStyle: 'bold italic', letterSpacing: '4px',
                    stroke: '#000000', strokeThickness: 4
                }).setOrigin(0.5);
                announcement.setAlpha(0);
                announcement.setScale(0.8);
                announcement.setDepth(200);
                
                this.tweens.add({ targets: announcement, alpha: 1, scale: 1, duration: 600, ease: 'Back.Out' });
                
                this.time.delayedCall(4000, () => {
                    window.location.href = `difficulty.html?fighter=${encodeURIComponent(playerFighter)}&arena=${encodeURIComponent(arenaParam)}`;
                });
            }
        }
        
        const config = {
            type: Phaser.AUTO,
            width: 1280,
            height: 720,
            parent: 'game-container',
            backgroundColor: '#050505',
            scene: FightingGame,
            scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH }
        };
        
        const game = new Phaser.Game(config);
    </script>
</body>
</html>
