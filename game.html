<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CHIYA GANG WARRIORS - BATTLE ARENA</title>
    
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wght@0,100..900;1,100..900&family=Geist:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    
    <!-- Favicon to prevent 404 error -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥊</text></svg>">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0a; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-family: 'Geist', sans-serif; 
            overflow: hidden;
            touch-action: pan-x pan-y; /* Allow scroll only on non-game areas */
            position: fixed;
            width: 100%;
            height: 100%;
        }
        
        /* FIXED: Mobile-friendly game container using 100dvh */
        #game-container { 
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100dvh;
            background: #050505;
        }
        
        /* Fallback for browsers that don't support dvh */
        @supports not (height: 100dvh) {
            #game-container {
                height: 100vh;
            }
        }
        
        /* Mobile Controls Panel - with safe area insets for notches */
        .mobile-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 10px 15px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            padding-left: max(10px, env(safe-area-inset-left));
            padding-right: max(10px, env(safe-area-inset-right));
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 179, 178, 0.3);
            z-index: 200;
            gap: 15px;
            flex-wrap: wrap;
            pointer-events: auto;
        }
        
        @media (min-width: 769px) {
            .mobile-controls { display: none; }
            .controls-info { display: flex !important; }
        }
        
        @media (max-width: 768px) {
            .controls-info { display: none !important; }
        }
        
        .joystick-area {
            width: 140px;
            height: 140px;
            background: rgba(30, 30, 40, 0.7);
            border-radius: 50%;
            position: relative;
            touch-action: none;
            border: 2px solid rgba(255, 179, 178, 0.4);
            box-shadow: 0 0 15px rgba(255, 179, 178, 0.2);
        }
        
        .joystick-base {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .joystick-thumb {
            width: 55px;
            height: 55px;
            background: radial-gradient(circle at 30% 30%, #ffb3b2, #ff525c);
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 82, 92, 0.5);
            transition: transform 0.05s ease;
            touch-action: none;
        }
        
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(4, 70px);
            gap: 12px;
            background: rgba(20, 20, 30, 0.5);
            padding: 12px 18px;
            border-radius: 60px;
            backdrop-filter: blur(8px);
        }
        
        .action-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
            border: 2px solid rgba(255, 179, 178, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: bold;
            font-size: 20px;
            color: #ffb3b2;
            cursor: pointer;
            transition: all 0.08s linear;
            touch-action: manipulation;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .action-btn:active {
            transform: scale(0.92);
            background: #ff525c;
            color: #fff;
            border-color: #fff;
        }
        
        .action-btn.special { border-color: #ffd700; color: #ffd700; }
        .action-btn.block { border-color: #00dbe9; color: #00dbe9; }
        .action-btn.super { border-color: #ffd700; color: #ffd700; background: linear-gradient(135deg, #3a2a00, #1a1a00); }
        .action-btn.jump { border-color: #00ff88; color: #00ff88; }
        .action-btn.dash { border-color: #ff69b4; color: #ff69b4; font-size: 14px; }
        .btn-label { font-size: 10px; letter-spacing: 1px; margin-top: 2px; }
        
        .controls-info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-left: 3px solid #ffb3b2;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            color: rgba(233, 188, 186, 0.9);
            letter-spacing: 1px;
            z-index: 100;
            pointer-events: none;
            border-radius: 0 8px 8px 0;
        }
        
        .back-button { 
            position: fixed; 
            top: max(10px, env(safe-area-inset-top)); 
            left: max(10px, env(safe-area-inset-left)); 
            background: rgba(10, 10, 10, 0.85); 
            backdrop-filter: blur(12px); 
            padding: 6px 12px; 
            border: 1px solid rgba(255, 179, 178, 0.4); 
            color: #e9bcba; 
            text-decoration: none; 
            font-size: 11px; 
            font-family: 'JetBrains Mono', monospace; 
            letter-spacing: 1px; 
            z-index: 100; 
            transition: all 0.3s ease; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            border-radius: 6px; 
        }
        .back-button:hover { border-color: #ffb3b2; color: #ffb3b2; transform: translateX(-4px); }
        
        @media (max-width: 768px) {
            .action-buttons { grid-template-columns: repeat(4, 55px); gap: 8px; padding: 10px 12px; }
            .action-btn { width: 55px; height: 55px; font-size: 16px; }
            .btn-label { font-size: 8px; }
            .joystick-area { width: 110px; height: 110px; }
            .joystick-thumb { width: 45px; height: 45px; }
        }
        
        @media (max-width: 480px) {
            .action-buttons { grid-template-columns: repeat(4, 48px); gap: 6px; }
            .action-btn { width: 48px; height: 48px; font-size: 14px; }
            .joystick-area { width: 90px; height: 90px; }
            .joystick-thumb { width: 38px; height: 38px; }
        }
        
        .touch-active {
            transform: scale(0.92);
            background: #ff525c;
            color: #fff;
        }
        
        /* Reduced motion accessibility */
        @media (prefers-reduced-motion: reduce) {
            .action-btn:active { transform: none; }
            .joystick-thumb { transition: none; }
            .pulse-red, .super-pulse { animation: none; }
        }
        
        /* Prevent pull-to-refresh on game area */
        body {
            overscroll-behavior: none;
        }
    </style>
</head>
<body>
    <a href="difficulty.html" class="back-button" id="backButton">
        <span class="material-symbols-outlined" style="font-size: 14px;">arrow_back</span>
        BACK
    </a>
    
    <div class="controls-info">
    <span>← →</span> MOVE &nbsp;&nbsp;|&nbsp;&nbsp; <span class="key">SPACE</span> JUMP &nbsp;&nbsp;|&nbsp;&nbsp; 
    <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> ATTACK &nbsp;&nbsp;|&nbsp;&nbsp; 
    <span class="key">F</span> SPECIAL &nbsp;&nbsp;|&nbsp;&nbsp; <span class="key">G</span> BLOCK &nbsp;&nbsp;|&nbsp;&nbsp; 
    <span class="key">H</span> SUPER &nbsp;&nbsp;|&nbsp;&nbsp; <span class="key">O</span> DEBUG
</div>
    
    <div id="game-container"></div>
    
    <!-- Mobile Touch Controls -->
    <div class="mobile-controls">
        <div class="joystick-area" id="joystickArea">
            <div class="joystick-base">
                <div class="joystick-thumb" id="joystickThumb"></div>
            </div>
        </div>
        
        <div class="action-buttons">
            <div class="action-btn" data-action="light">
                A<br><span class="btn-label">LIGHT</span>
            </div>
            <div class="action-btn" data-action="medium">
                S<br><span class="btn-label">MEDIUM</span>
            </div>
            <div class="action-btn" data-action="heavy">
                D<br><span class="btn-label">HEAVY</span>
            </div>
            <div class="action-btn special" data-action="special">
                F<br><span class="btn-label">SPECIAL</span>
            </div>
            <div class="action-btn block" data-action="block">
                G<br><span class="btn-label">BLOCK</span>
            </div>
            <div class="action-btn super" data-action="super">
                H<br><span class="btn-label">SUPER</span>
            </div>
            <div class="action-btn jump" data-action="jump">
                ⬆<br><span class="btn-label">JUMP</span>
            </div>
            <div class="action-btn dash" data-action="dash">
                →→<br><span class="btn-label">DASH</span>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/fighters.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/base-attack.js"></script>
    <script src="js/player.js"></script>
    <script src="js/cpu.js"></script>
    <script src="js/scene-game.js"></script>
    
    <script>
        // ========== MOBILE OPTIMIZATIONS ==========
        
        // Detect reduced motion preference
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        
        // Battery and performance detection
        let isBatteryLow = false;
        let isCharging = true;
        
        if ('getBattery' in navigator) {
            navigator.getBattery().then(battery => {
                isBatteryLow = battery.level < 0.2 && !battery.charging;
                isCharging = battery.charging;
                
                battery.addEventListener('levelchange', () => {
                    isBatteryLow = battery.level < 0.2 && !battery.charging;
                });
                battery.addEventListener('chargingchange', () => {
                    isCharging = battery.charging;
                    isBatteryLow = battery.level < 0.2 && !battery.charging;
                });
            });
        }
        
        // ========== FIXED: Orientation Change Handler ==========
        let orientationTimeout = null;
        
        function handleOrientationChange() {
            // Show a brief loading indicator
            const gameContainer = document.getElementById('game-container');
            if (gameContainer) {
                gameContainer.style.opacity = '0.5';
            }
            
            // Clear previous timeout
            if (orientationTimeout) clearTimeout(orientationTimeout);
            
            // Reload after a short delay for browser to update dimensions
            orientationTimeout = setTimeout(() => {
                window.location.reload();
            }, 100);
        }
        
        window.addEventListener('orientationchange', handleOrientationChange);
        
        // Also handle resize events (for split screen, keyboard appearing, etc.)
        let resizeTimeout = null;
        let lastWidth = window.innerWidth;
        let lastHeight = window.innerHeight;
        
        function handleResize() {
            // Only reload if dimensions changed significantly (more than 100px)
            const widthDiff = Math.abs(window.innerWidth - lastWidth);
            const heightDiff = Math.abs(window.innerHeight - lastHeight);
            
            if (widthDiff > 100 || heightDiff > 100) {
                lastWidth = window.innerWidth;
                lastHeight = window.innerHeight;
                
                if (resizeTimeout) clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    if (window.game && window.game.scale) {
                        window.game.scale.resize(window.innerWidth, window.innerHeight);
                    }
                }, 200);
            }
        }
        
        window.addEventListener('resize', handleResize);
        
        // Clean up event listeners on page unload
        window.addEventListener('beforeunload', () => {
            window.removeEventListener('orientationchange', handleOrientationChange);
            window.removeEventListener('resize', handleResize);
            if (orientationTimeout) clearTimeout(orientationTimeout);
            if (resizeTimeout) clearTimeout(resizeTimeout);
        });
        
        // ========== MOBILE TOUCH CONTROLS ==========
        (function() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
            
            if (!isMobile) return;
            
            let joystickActive = false;
            let joystickCenter = { x: 0, y: 0 };
            let joystickVector = { x: 0, y: 0 };
            const joystickArea = document.getElementById('joystickArea');
            const joystickThumb = document.getElementById('joystickThumb');
            const maxDist = 40;
            let blockPressed = false;
            
            let gameScene = null;
            
            const checkForGameScene = setInterval(() => {
                if (window.gameSceneRef && window.gameSceneRef.playerAttacks) {
                    gameScene = window.gameSceneRef;
                    clearInterval(checkForGameScene);
                    
                    // Apply battery throttling to game
                    if (gameScene && isBatteryLow && !isCharging) {
                        gameScene.batterySaveMode = true;
                        if (gameScene.cpuAttacks) {
                            gameScene.cpuAttacks.moveTimer = 20;
                        }
                    }
                    
                    console.log('Mobile controls connected to game scene');
                }
            }, 100);
            
            joystickArea.addEventListener('touchstart', (e) => {
                e.preventDefault();
                joystickActive = true;
                const rect = joystickArea.getBoundingClientRect();
                joystickCenter = {
                    x: rect.left + rect.width / 2,
                    y: rect.top + rect.height / 2
                };
                updateJoystick(e.touches[0]);
            }, { passive: false });
            
            joystickArea.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (joystickActive) updateJoystick(e.touches[0]);
            }, { passive: false });
            
            joystickArea.addEventListener('touchend', (e) => {
                e.preventDefault();
                joystickActive = false;
                joystickThumb.style.transform = 'translate(0px, 0px)';
                joystickVector = { x: 0, y: 0 };
                if (gameScene) {
                    gameScene.mobileLeftPressed = false;
                    gameScene.mobileRightPressed = false;
                }
            });
            
            function updateJoystick(touch) {
                if (!joystickActive) return;
                
                const dx = touch.clientX - joystickCenter.x;
                const dy = touch.clientY - joystickCenter.y;
                const distance = Math.min(Math.hypot(dx, dy), maxDist);
                const angle = Math.atan2(dy, dx);
                
                const thumbX = Math.cos(angle) * distance;
                const thumbY = Math.sin(angle) * distance;
                
                joystickThumb.style.transform = `translate(${thumbX}px, ${thumbY}px)`;
                
                const normX = Math.cos(angle) * (distance / maxDist);
                joystickVector = { x: normX, y: 0 };
                
                if (gameScene) {
                    if (joystickVector.x > 0.2) {
                        gameScene.mobileRightPressed = true;
                        gameScene.mobileLeftPressed = false;
                    } else if (joystickVector.x < -0.2) {
                        gameScene.mobileLeftPressed = true;
                        gameScene.mobileRightPressed = false;
                    } else {
                        gameScene.mobileLeftPressed = false;
                        gameScene.mobileRightPressed = false;
                    }
                }
            }
            
            const buttons = document.querySelectorAll('.action-btn');
            buttons.forEach(btn => {
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    btn.classList.add('touch-active');
                    const action = btn.dataset.action;
                    
                    if (gameScene && gameScene.roundActive && !gameScene.isSuperFrozen) {
                        switch(action) {
                            case 'light':
                                if (gameScene.playerAttacks) gameScene.playerAttacks.lightAttack();
                                break;
                            case 'medium':
                                if (gameScene.playerAttacks) gameScene.playerAttacks.mediumAttack();
                                break;
                            case 'heavy':
                                if (gameScene.playerAttacks) gameScene.playerAttacks.heavyAttack();
                                break;
                            case 'special':
                                if (gameScene.playerAttacks && gameScene.specialCooldown === 0) {
                                    if (gameScene.playerData.name === 'ASHMIN') {
                                        gameScene.playerAttacks.goldenDragonFist();
                                    } else {
                                        gameScene.playerAttacks.standardSpecial();
                                    }
                                }
                                break;
                            case 'block':
                                blockPressed = true;
                                gameScene.mobileBlockPressed = true;
                                break;
                            case 'super':
                                if (gameScene.playerAttacks && gameScene.superMeter >= 100) {
                                    gameScene.playerAttacks.superMove();
                                }
                                break;
                            case 'jump':
                                if (!gameScene.isJumping && !gameScene.isAttacking && gameScene.roundActive && !gameScene.isSuperFrozen) {
                                    gameScene.mobileJumpRequested = true;
                                }
                                break;
                            case 'dash':
                                if (gameScene.player && !gameScene.isAttacking && !gameScene.isJumping) {
                                    const direction = gameScene.getFacingDirection?.('player') === 'right' ? 80 : -80;
                                    gameScene.player.x += direction;
                                    gameScene.player.x = Math.min(Math.max(gameScene.player.x, 200), 1080 - 100);
                                }
                                break;
                        }
                    }
                }, { passive: false });
                
                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    btn.classList.remove('touch-active');
                    const action = btn.dataset.action;
                    
                    if (gameScene && action === 'block') {
                        blockPressed = false;
                        gameScene.mobileBlockPressed = false;
                    }
                });
            });
        })();
    </script>
    
    <script>
        // ========== FIGHTING GAME CLASS OVERRIDE ==========
        (function() {
            const originalFightingGame = FightingGame;
            
            window.FightingGame = class extends originalFightingGame {
                constructor() {
                    super();
                    this.mobileLeftPressed = false;
                    this.mobileRightPressed = false;
                    this.mobileBlockPressed = false;
                    this.mobileJumpRequested = false;
                    this.batterySaveMode = false;
                }
                
                create() {
                    super.create();
                    window.gameSceneRef = this;
                    
                    // Apply battery save mode if needed
                    if (this.batterySaveMode) {
                        if (this.impactFlash) this.impactFlash.setAlpha(0.2);
                        if (this.cpuAttacks) {
                            const originalDecide = this.cpuAttacks.decide;
                            this.cpuAttacks.decide = () => {
                                if (Math.random() < 0.7) originalDecide.call(this.cpuAttacks);
                            };
                        }
                    }
                    
                    // Disable screen shake for reduced motion preference
                    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                        const originalShake = this.cameras.main.shake;
                        this.cameras.main.shake = () => {};
                    }
                }
                
                updateMobileMovement() {
                    if (!this.player || !this.roundActive || this.isSuperFrozen) return;
                    
                    if (this.mobileLeftPressed) this.player.x -= 7;
                    if (this.mobileRightPressed) this.player.x += 7;
                    
                    if (this.mobileJumpRequested && !this.isJumping && !this.isAttacking && this.roundActive && !this.isSuperFrozen) {
                        this.isJumping = true;
                        this.playerYVelocity = JUMP_VELOCITY;
                        if (this.animations) this.animations.setPlayerAnimation('jump', 300);
                        this.mobileJumpRequested = false;
                    }
                    
                    if (!this.roundActive && this.mobileJumpRequested) {
                        this.mobileJumpRequested = false;
                    }
                    
                    if (this.mobileBlockPressed && !this.isAttacking && !this.isJumping) {
                        this.isBlocking = true;
                        if (this.playerAura) {
                            this.playerAura.setAlpha(0.3);
                            this.playerAura.setFillStyle(0x00dbe9);
                        }
                        this.playerBlockHeight = 'mid';
                    } else if (!this.mobileBlockPressed && !this.keyG?.isDown) {
                        this.isBlocking = false;
                        if (this.playerAura) {
                            this.playerAura.setAlpha(0.15);
                            this.playerAura.setFillStyle(this.playerData?.color || 0xff5252);
                        }
                    }
                }
                
                update(time, delta) {
                    const cappedDelta = this.batterySaveMode ? Math.min(delta, 33) : delta;
                    this.updateMobileMovement();
                    super.update(time, cappedDelta);
                    
                    if (this.player) {
                        this.player.x = Math.min(Math.max(this.player.x, 200), 1080 - 100);
                    }
                }
            };
        })();
    </script>
    
    <script>
        // ========== PHASER CONFIG ==========
        const config = {
            type: Phaser.AUTO,
            width: 1280,
            height: 720,
            parent: 'game-container',
            backgroundColor: '#050505',
            scene: FightingGame,
            scale: { 
                mode: Phaser.Scale.FIT, 
                autoCenter: Phaser.Scale.CENTER_BOTH,
                width: '100%',
                height: '100%',
                zoom: Math.min(2, window.devicePixelRatio || 1)
            },
            input: {
                activePointers: 3,
                touch: true
            },
            fps: {
                target: prefersReducedMotion ? 30 : 60,
                forceSetTimeOut: true
            },
            antialias: !isBatteryLow,
            pixelArt: true
        };
        
        const game = new Phaser.Game(config);
        window.game = game;
        
        // ResizeObserver for container (optional, improves responsiveness)
        if (window.ResizeObserver) {
            const container = document.getElementById('game-container');
            const resizeObserver = new ResizeObserver(() => {
                if (game && game.scale) {
                    game.scale.resize(window.innerWidth, window.innerHeight);
                }
            });
            if (container) resizeObserver.observe(container);
        }
    </script>
</body>
</html>
