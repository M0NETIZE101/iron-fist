<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>IRON FIST - BATTLE ARENA</title>
    
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wght@0,100..900;1,100..900&family=Geist:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Geist', sans-serif; overflow: hidden; }
        #game-container { position: relative; box-shadow: 0 0 60px rgba(255, 179, 178, 0.15); border: 1px solid rgba(255, 179, 178, 0.2); border-radius: 8px; }
        .controls-info { position: fixed; bottom: 30px; left: 30px; background: rgba(10, 10, 10, 0.7); backdrop-filter: blur(12px); padding: 12px 24px; border-left: 2px solid #ffb3b2; font-size: 11px; font-family: 'JetBrains Mono', monospace; color: rgba(233, 188, 186, 0.7); letter-spacing: 1px; z-index: 100; pointer-events: none; border-radius: 0 8px 8px 0; }
        .controls-info span { color: #ffb3b2; }
        .controls-info .key { border: 1px solid rgba(255,179,178,0.3); padding: 2px 6px; border-radius: 4px; margin: 0 2px; }
        .back-button { position: fixed; top: 30px; left: 30px; background: rgba(10, 10, 10, 0.7); backdrop-filter: blur(12px); padding: 8px 16px; border: 1px solid rgba(255, 179, 178, 0.3); color: #e9bcba; text-decoration: none; font-size: 11px; font-family: 'JetBrains Mono', monospace; letter-spacing: 1px; z-index: 100; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; border-radius: 8px; }
        .back-button:hover { border-color: #ffb3b2; color: #ffb3b2; transform: translateX(-4px); }
        .arena-name-display {
            position: fixed;
            top: 100px;
            right: 30px;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-right: 3px solid #ffb3b2;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            color: #e9bcba;
            z-index: 100;
            border-radius: 8px 0 0 8px;
            letter-spacing: 1px;
        }
        .arena-name-display span { color: #ffb3b2; font-weight: bold; }
    </style>
</head>
<body>
    <a href="arena.html" class="back-button">
        <span class="material-symbols-outlined" style="font-size: 14px;">arrow_back</span>
        BACK
    </a>
    
    <div class="controls-info">
        <span>← →</span> MOVE &nbsp;&nbsp;|&nbsp;&nbsp; <span class="key">A</span> LEFT PUNCH &nbsp;&nbsp;|&nbsp;&nbsp; <span class="key">S</span> RIGHT PUNCH &nbsp;&nbsp;|&nbsp;&nbsp; <span class="key">D</span> KICK &nbsp;&nbsp;|&nbsp;&nbsp; <span class="key">F</span> FOCUS
    </div>
    
    <div class="arena-name-display" id="arenaNameDisplay">
        🏟️ <span id="arenaNameText">NEO-TOKYO</span>
    </div>
    
    <div id="game-container"></div>

    <script>
        // Get parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const playerFighter = urlParams.get('fighter') || 'KAIRO';
        const arenaParam = urlParams.get('arena') || 'NEO-TOKYO';
        
        document.getElementById('arenaNameText').innerText = arenaParam;
        
        // Arena color mappings
        const arenaColors = {
            'NEO-TOKYO': { color1: 0x1a0a0a, color2: 0x2a0a0a, accent: 0xff5252 },
            'CYBER-SHRINE': { color1: 0x0a0a2a, color2: 0x1a0a3a, accent: 0x9b59b6 },
            'ORBITAL STATION': { color1: 0x0a0a1a, color2: 0x0a0a2a, accent: 0x00dbe9 },
            'MAGMA CORE': { color1: 0x1a0a00, color2: 0x2a0a00, accent: 0xff3b3b },
            'WASTELAND JUNKYARD': { color1: 0x1a1a0a, color2: 0x2a2a0a, accent: 0xaaaaaa },
            'VOID CHAMBER': { color1: 0x001a1a, color2: 0x002a2a, accent: 0x00dbe9 }
        };
        
        const arenaStyle = arenaColors[arenaParam] || arenaColors['NEO-TOKYO'];
        
        // Fighter data - ALL using PNG now
        const fighterData = {
            'KAIRO': { 
                name: 'KAIRO', 
                title: 'CYBERNETIC MONK', 
                power: 88, 
                speed: 94, 
                defense: 78,
                color: 0xff5252, 
                accent: 0xffb3b2, 
                folder: 'kairo'
            },
            'ASHMIN': { 
                name: 'ASHMIN', 
                title: 'PROTOCOL-X', 
                power: 90, 
                speed: 91, 
                defense: 75,
                color: 0x00dbe9, 
                accent: 0x7df4ff, 
                folder: 'ashmin'
            }
        };
        
        const playerData = fighterData[playerFighter] || fighterData['KAIRO'];
        const cpuData = playerFighter === 'KAIRO' ? fighterData['ASHMIN'] : fighterData['KAIRO'];
        
        class FightingGame extends Phaser.Scene {
            constructor() {
                super({ key: 'FightingGame' });
                this.isAnimating = false;
                this.currentTexture = 'idle';
            }
            
            preload() {
                console.log('Loading sprites for:', playerData.name);
                
                // Load PLAYER sprites (all PNG)
                this.load.image(`${playerData.folder}_idle`, `assets/characters/${playerData.folder}/idle.png`);
                this.load.image(`${playerData.folder}_punch_left`, `assets/characters/${playerData.folder}/punch-left.png`);
                this.load.image(`${playerData.folder}_punch_right`, `assets/characters/${playerData.folder}/punch-right.png`);
                this.load.image(`${playerData.folder}_kick`, `assets/characters/${playerData.folder}/kick.png`);
                this.load.image(`${playerData.folder}_victory`, `assets/characters/${playerData.folder}/victory.png`);
                
                // Load CPU sprites (all PNG)
                this.load.image(`${cpuData.folder}_idle`, `assets/characters/${cpuData.folder}/idle.png`);
                this.load.image(`${cpuData.folder}_punch_left`, `assets/characters/${cpuData.folder}/punch-left.png`);
                this.load.image(`${cpuData.folder}_punch_right`, `assets/characters/${cpuData.folder}/punch-right.png`);
                this.load.image(`${cpuData.folder}_kick`, `assets/characters/${cpuData.folder}/kick.png`);
                this.load.image(`${cpuData.folder}_victory`, `assets/characters/${cpuData.folder}/victory.png`);
                
                console.log('All sprites loaded');
            }
            
            create() {
                console.log('Creating game...');
                
                // Game state
                this.playerHealth = 100;
                this.cpuHealth = 100;
                this.playerFocus = 0;
                this.attackCooldown = 0;
                this.focusCooldown = 0;
                this.roundActive = true;
                this.roundTimer = 99;
                
                // Background gradient
                const bg = this.add.graphics();
                bg.fillGradientStyle(arenaStyle.color1, arenaStyle.color1, arenaStyle.color2, arenaStyle.color2, 1);
                bg.fillRect(0, 0, 1280, 720);
                bg.setDepth(0);
                
                // Grid lines
                const grid = this.add.graphics();
                grid.lineStyle(1, arenaStyle.accent, 0.12);
                for (let y = 80; y < 700; y += 100) grid.lineBetween(0, y, 1280, y);
                for (let x = 80; x < 1200; x += 100) grid.lineBetween(x, 0, x, 720);
                grid.setDepth(1);
                
                // Ground
                const ground = this.add.rectangle(640, 580, 1280, 140, 0x000000);
                ground.setAlpha(0.5);
                ground.setDepth(2);
                
                const groundLine = this.add.rectangle(640, 575, 1280, 2, arenaStyle.accent);
                groundLine.setAlpha(0.4);
                groundLine.setDepth(3);
                
                // === PLAYER ===
                this.player = this.add.sprite(280, 460, `${playerData.folder}_idle`);
                this.player.setDisplaySize(180, 270);
                this.player.setDepth(10);
                
                // Store texture keys for player
                this.playerTextures = {
                    idle: `${playerData.folder}_idle`,
                    punch_left: `${playerData.folder}_punch_left`,
                    punch_right: `${playerData.folder}_punch_right`,
                    kick: `${playerData.folder}_kick`,
                    victory: `${playerData.folder}_victory`
                };
                
                // Player aura
                this.playerAura = this.add.ellipse(280, 500, 140, 180, playerData.color);
                this.playerAura.setAlpha(0.12);
                this.playerAura.setDepth(5);
                
                // Player name
                this.add.text(280, 370, playerData.name, { fontFamily: 'Anybody', fontSize: '24px', color: '#ffb3b2', fontStyle: 'bold italic' }).setOrigin(0.5).setDepth(15);
                this.add.text(280, 392, playerData.title, { fontFamily: 'JetBrains Mono', fontSize: '9px', color: '#5f3e3e', letterSpacing: '2px' }).setOrigin(0.5).setDepth(15);
                
                // === CPU ===
                this.cpu = this.add.sprite(1000, 460, `${cpuData.folder}_idle`);
                this.cpu.setDisplaySize(180, 270);
                this.cpu.setDepth(10);
                
                // Store texture keys for CPU
                this.cpuTextures = {
                    idle: `${cpuData.folder}_idle`,
                    punch_left: `${cpuData.folder}_punch_left`,
                    punch_right: `${cpuData.folder}_punch_right`,
                    kick: `${cpuData.folder}_kick`,
                    victory: `${cpuData.folder}_victory`
                };
                
                this.cpuAura = this.add.ellipse(1000, 500, 140, 180, cpuData.color);
                this.cpuAura.setAlpha(0.12);
                this.cpuAura.setDepth(5);
                
                this.add.text(1000, 370, cpuData.name, { fontFamily: 'Anybody', fontSize: '24px', color: '#00dbe9', fontStyle: 'bold italic' }).setOrigin(0.5).setDepth(15);
                this.add.text(1000, 392, cpuData.title, { fontFamily: 'JetBrains Mono', fontSize: '9px', color: '#5f3e3e', letterSpacing: '2px' }).setOrigin(0.5).setDepth(15);
                
                // === HEALTH BARS ===
                // Player health bar background
                const playerHealthBg = this.add.rectangle(200, 55, 350, 8, 0x333333);
                playerHealthBg.setStrokeStyle(1, playerData.accent);
                playerHealthBg.setDepth(20);
                this.healthBarPlayer = this.add.rectangle(200, 55, 350, 8, playerData.color);
                this.healthBarPlayer.setOrigin(0, 0.5);
                this.healthBarPlayer.setDepth(21);
                
                this.add.text(200, 35, playerData.name, { fontFamily: 'JetBrains Mono', fontSize: '10px', color: '#ffb3b2', letterSpacing: '2px' }).setOrigin(0.5).setDepth(20);
                
                // CPU health bar background
                const cpuHealthBg = this.add.rectangle(1080, 55, 350, 8, 0x333333);
                cpuHealthBg.setStrokeStyle(1, cpuData.accent);
                cpuHealthBg.setDepth(20);
                this.healthBarCPU = this.add.rectangle(1080, 55, 350, 8, cpuData.color);
                this.healthBarCPU.setOrigin(0, 0.5);
                this.healthBarCPU.setDepth(21);
                
                this.add.text(1080, 35, cpuData.name, { fontFamily: 'JetBrains Mono', fontSize: '10px', color: '#00dbe9', letterSpacing: '2px' }).setOrigin(0.5).setDepth(20);
                
                // === FOCUS METER ===
                const focusBg = this.add.rectangle(640, 90, 300, 4, 0x333333);
                focusBg.setStrokeStyle(1, arenaStyle.accent);
                focusBg.setDepth(20);
                this.focusBar = this.add.rectangle(640, 90, 0, 4, arenaStyle.accent);
                this.focusBar.setOrigin(0, 0.5);
                this.focusBar.setDepth(21);
                
                this.add.text(640, 78, 'FOCUS', { fontFamily: 'JetBrains Mono', fontSize: '8px', color: '#5f3e3e', letterSpacing: '3px' }).setOrigin(0.5).setDepth(20);
                
                // Timer
                this.timerText = this.add.text(640, 45, '99', { fontFamily: 'JetBrains Mono', fontSize: '32px', color: '#e9bcba', letterSpacing: '4px' }).setOrigin(0.5).setDepth(20);
                
                // VS overlay
                const vsText = this.add.text(640, 340, 'VS', { fontFamily: 'Anybody', fontSize: '120px', color: '#ffb3b2', fontStyle: 'italic', fontWeight: '900' }).setOrigin(0.5);
                vsText.setAlpha(0.08);
                vsText.setAngle(-5);
                vsText.setDepth(25);
                this.time.delayedCall(2000, () => this.tweens.add({ targets: vsText, alpha: 0, duration: 1500 }));
                
                // Input controls - UPDATED
                this.keyA = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.A);
                this.keyS = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.S);
                this.keyD = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.D);
                this.keyF = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.F);
                this.keyLeft = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.LEFT);
                this.keyRight = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.RIGHT);
                
                // Timers
                this.time.addEvent({
                    delay: 1000,
                    callback: () => {
                        if (this.roundActive && this.roundTimer > 0) {
                            this.roundTimer--;
                            this.timerText.setText(this.roundTimer.toString().padStart(2, '0'));
                            if (this.roundTimer === 0) this.endGame('time');
                        }
                    },
                    loop: true
                });
                
                this.time.addEvent({
                    delay: 100,
                    callback: () => {
                        if (this.roundActive && this.playerFocus < 100) {
                            this.playerFocus = Math.min(100, this.playerFocus + 1.5);
                            this.focusBar.width = 300 * (this.playerFocus / 100);
                        }
                    },
                    loop: true
                });
                
                this.time.addEvent({
                    delay: 800,
                    callback: () => this.cpuAction(),
                    loop: true
                });
                
                this.impactFlash = this.add.rectangle(640, 360, 1280, 720, 0xffffff);
                this.impactFlash.setAlpha(0);
                this.impactFlash.setDepth(100);
                
                // Idle floating animation
                this.tweens.add({
                    targets: this.player,
                    y: this.player.y - 3,
                    duration: 1500,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.easeInOut'
                });
                
                this.tweens.add({
                    targets: this.cpu,
                    y: this.cpu.y - 3,
                    duration: 1500,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.easeInOut'
                });
                
                console.log('Game ready! Player:', playerData.name, 'CPU:', cpuData.name);
            }
            
            setPlayerPose(poseName, duration = 200) {
                if (this.isAnimating) return;
                
                const textureKey = this.playerTextures[poseName];
                if (textureKey && this.textures.exists(textureKey)) {
                    this.isAnimating = true;
                    this.player.setTexture(textureKey);
                    this.currentTexture = poseName;
                    
                    this.time.delayedCall(duration, () => {
                        if (this.roundActive && this.currentTexture !== 'victory') {
                            this.player.setTexture(this.playerTextures.idle);
                            this.currentTexture = 'idle';
                        }
                        this.isAnimating = false;
                    });
                }
            }
            
            setCpuPose(poseName, duration = 200) {
                const textureKey = this.cpuTextures[poseName];
                if (textureKey && this.textures.exists(textureKey)) {
                    this.cpu.setTexture(textureKey);
                    this.time.delayedCall(duration, () => {
                        if (this.roundActive) {
                            this.cpu.setTexture(this.cpuTextures.idle);
                        }
                    });
                }
            }
            
            update() {
                if (!this.roundActive) return;
                
                if (this.attackCooldown > 0) this.attackCooldown--;
                if (this.focusCooldown > 0) this.focusCooldown--;
                
                // Movement
                let move = 0;
                if (this.keyLeft.isDown) move = -1;
                if (this.keyRight.isDown) move = 1;
                if (move !== 0) this.player.x += move * 7;
                
                // Attacks - UPDATED
                if (Phaser.Input.Keyboard.JustDown(this.keyA)) this.leftPunch();
                if (Phaser.Input.Keyboard.JustDown(this.keyS)) this.rightPunch();
                if (Phaser.Input.Keyboard.JustDown(this.keyD)) this.kick();
                if (Phaser.Input.Keyboard.JustDown(this.keyF)) this.focusAttack();
                
                // Update aura position
                this.playerAura.setPosition(this.player.x, this.player.y + 10);
                this.cpuAura.setPosition(this.cpu.x, this.cpu.y + 10);
                
                // Boundaries
                this.player.x = Math.min(Math.max(this.player.x, 200), 550);
                this.cpu.x = Math.min(Math.max(this.cpu.x, 730), 1080);
                
                // Prevent overlap
                if (Math.abs(this.player.x - this.cpu.x) < 90) {
                    if (this.player.x < this.cpu.x) {
                        this.player.x = this.cpu.x - 90;
                    } else {
                        this.cpu.x = this.player.x + 90;
                    }
                }
            }
            
            leftPunch() {
                if (!this.roundActive || this.attackCooldown > 0) return;
                
                const distance = Math.abs(this.player.x - this.cpu.x);
                const canHit = distance < 100;
                const damage = Math.floor(7 * (playerData.power / 100));
                
                // Show punch left animation
                this.setPlayerPose('punch_left', 150);
                
                // Movement animation
                this.tweens.add({
                    targets: this.player,
                    x: this.player.x + (canHit ? 25 : 15),
                    duration: 60,
                    yoyo: true,
                    ease: 'Power2'
                });
                
                if (canHit) {
                    this.cpuHealth = Math.max(0, this.cpuHealth - damage);
                    this.attackCooldown = 18;
                    this.applyHitEffect(this.cpu, damage);
                    this.setCpuPose('punch_left', 100);
                    this.updateHealthBars();
                    
                    if (this.cpuHealth <= 0) this.endGame('player');
                }
            }
            
            rightPunch() {
                if (!this.roundActive || this.attackCooldown > 0) return;
                
                const distance = Math.abs(this.player.x - this.cpu.x);
                const canHit = distance < 100;
                const damage = Math.floor(8 * (playerData.power / 100));
                
                // Show punch right animation
                this.setPlayerPose('punch_right', 150);
                
                // Movement animation
                this.tweens.add({
                    targets: this.player,
                    x: this.player.x + (canHit ? 28 : 15),
                    duration: 60,
                    yoyo: true,
                    ease: 'Power2'
                });
                
                if (canHit) {
                    this.cpuHealth = Math.max(0, this.cpuHealth - damage);
                    this.attackCooldown = 20;
                    this.applyHitEffect(this.cpu, damage);
                    this.setCpuPose('punch_right', 100);
                    this.updateHealthBars();
                    
                    if (this.cpuHealth <= 0) this.endGame('player');
                }
            }
            
            kick() {
                if (!this.roundActive || this.attackCooldown > 0) return;
                
                const distance = Math.abs(this.player.x - this.cpu.x);
                const canHit = distance < 85;
                const damage = Math.floor(12 * (playerData.power / 100));
                
                // Show kick animation
                this.setPlayerPose('kick', 200);
                
                // Kick animation - larger movement
                this.tweens.add({
                    targets: this.player,
                    x: this.player.x + (canHit ? 35 : 20),
                    scaleX: 1.1,
                    scaleY: 0.95,
                    duration: 80,
                    yoyo: true,
                    ease: 'Back'
                });
                
                if (canHit) {
                    this.cpuHealth = Math.max(0, this.cpuHealth - damage);
                    this.attackCooldown = 30;
                    this.applyHitEffect(this.cpu, damage);
                    this.setCpuPose('kick', 100);
                    this.updateHealthBars();
                    
                    if (this.cpuHealth <= 0) this.endGame('player');
                }
            }
            
            focusAttack() {
                if (!this.roundActive || this.focusCooldown > 0 || this.playerFocus < 100) return;
                
                const distance = Math.abs(this.player.x - this.cpu.x);
                const canHit = distance < 110;
                const damage = Math.floor(25 * (playerData.power / 100));
                
                if (canHit) {
                    this.cpuHealth = Math.max(0, this.cpuHealth - damage);
                    this.playerFocus = 0;
                    this.focusCooldown = 60;
                    this.focusBar.width = 0;
                    
                    // Cinematic effects
                    this.cameras.main.shake(200, 0.008);
                    this.tweens.add({
                        targets: this.impactFlash,
                        alpha: 0.35,
                        duration: 80,
                        yoyo: true
                    });
                    
                    // Focus attack animation
                    this.setPlayerPose('punch_right', 250);
                    this.applyHitEffect(this.cpu, damage);
                    this.setCpuPose('punch_right', 150);
                    this.updateHealthBars();
                    
                    if (this.cpuHealth <= 0) this.endGame('player');
                }
            }
            
            cpuAction() {
                if (!this.roundActive) return;
                
                const distance = Math.abs(this.cpu.x - this.player.x);
                
                // Move towards player if too far
                if (distance > 140) {
                    if (this.cpu.x < this.player.x) this.cpu.x += 9;
                    else this.cpu.x -= 9;
                } else if (this.attackCooldown === 0) {
                    // CPU chooses random attack
                    const attackChoice = Math.random();
                    
                    // Calculate damage based on CPU power
                    const getDamage = (baseDamage) => Math.floor(baseDamage * (cpuData.power / 100));
                    
                    if (attackChoice < 0.33 && distance < 100) {
                        // Left punch
                        const damage = getDamage(7);
                        this.playerHealth = Math.max(0, this.playerHealth - damage);
                        this.attackCooldown = 22;
                        this.applyHitEffect(this.player, damage);
                        this.setCpuPose('punch_left', 120);
                        this.updateHealthBars();
                        
                    } else if (attackChoice < 0.66 && distance < 100) {
                        // Right punch
                        const damage = getDamage(8);
                        this.playerHealth = Math.max(0, this.playerHealth - damage);
                        this.attackCooldown = 24;
                        this.applyHitEffect(this.player, damage);
                        this.setCpuPose('punch_right', 120);
                        this.updateHealthBars();
                        
                    } else if (attackChoice < 0.85 && distance < 85) {
                        // Kick
                        const damage = getDamage(12);
                        this.playerHealth = Math.max(0, this.playerHealth - damage);
                        this.attackCooldown = 32;
                        this.applyHitEffect(this.player, damage);
                        this.setCpuPose('kick', 120);
                        this.updateHealthBars();
                        
                    } else if (attackChoice < 0.95 && this.playerFocus >= 100 && distance < 110) {
                        // CPU Special Attack
                        const damage = getDamage(22);
                        this.playerHealth = Math.max(0, this.playerHealth - damage);
                        this.playerFocus = 0;
                        this.attackCooldown = 50;
                        this.applyHitEffect(this.player, damage);
                        this.setCpuPose('punch_right', 150);
                        this.cameras.main.shake(150, 0.006);
                        this.updateHealthBars();
                    }
                    
                    // Check for CPU victory
                    if (this.playerHealth <= 0) this.endGame('cpu');
                }
            }
            
            applyHitEffect(target, damage) {
                // Screen shake
                this.cameras.main.shake(80, 0.003);
                
                // Hit flash
                target.setAlpha(0.5);
                this.time.delayedCall(100, () => target.setAlpha(1));
                
                // Damage number
                const dmgText = this.add.text(target.x, target.y - 50, `${damage}`, {
                    fontFamily: 'JetBrains Mono',
                    fontSize: '18px',
                    color: '#ffb3b2',
                    fontStyle: 'bold'
                }).setOrigin(0.5);
                dmgText.setDepth(50);
                
                this.tweens.add({
                    targets: dmgText,
                    y: dmgText.y - 50,
                    alpha: 0,
                    duration: 600,
                    onComplete: () => dmgText.destroy()
                });
                
                // Pushback
                if (target === this.cpu) {
                    target.x += 30;
                } else {
                    target.x -= 30;
                }
            }
            
            updateHealthBars() {
                // Update widths
                this.healthBarPlayer.width = 350 * (this.playerHealth / 100);
                this.healthBarCPU.width = 350 * (this.cpuHealth / 100);
                
                // Low health color change
                if (this.playerHealth < 25) {
                    this.healthBarPlayer.setFillStyle(0xff3b3b);
                } else {
                    this.healthBarPlayer.setFillStyle(playerData.color);
                }
                
                if (this.cpuHealth < 25) {
                    this.healthBarCPU.setFillStyle(0xff3b3b);
                } else {
                    this.healthBarCPU.setFillStyle(cpuData.color);
                }
            }
            
            endGame(winner) {
                this.roundActive = false;
                
                // Show victory pose for winner
                if (winner === 'player') {
                    this.player.setTexture(this.playerTextures.victory);
                    this.currentTexture = 'victory';
                    this.tweens.add({
                        targets: this.player,
                        y: this.player.y - 20,
                        duration: 300,
                        yoyo: true,
                        ease: 'Bounce'
                    });
                } else {
                    this.cpu.setTexture(this.cpuTextures.victory);
                    this.tweens.add({
                        targets: this.cpu,
                        y: this.cpu.y - 20,
                        duration: 300,
                        yoyo: true,
                        ease: 'Bounce'
                    });
                }
                
                const resultText = winner === 'player' ? `${playerData.name} VICTORY!` : `${cpuData.name} VICTORY!`;
                const resultColor = winner === 'player' ? '#ffb3b2' : '#00dbe9';
                
                const announcement = this.add.text(640, 360, resultText, {
                    fontFamily: 'Anybody',
                    fontSize: '52px',
                    color: resultColor,
                    fontStyle: 'bold italic',
                    letterSpacing: '4px'
                }).setOrigin(0.5);
                announcement.setAlpha(0);
                announcement.setScale(0.8);
                announcement.setDepth(200);
                
                this.tweens.add({
                    targets: announcement,
                    alpha: 1,
                    scale: 1,
                    duration: 600,
                    ease: 'Back.Out'
                });
                
                // Return to arena selection after delay
                this.time.delayedCall(4000, () => {
                    window.location.href = 'arena.html?fighter=' + encodeURIComponent(playerFighter);
                });
            }
        }
        
        const config = {
            type: Phaser.AUTO,
            width: 1280,
            height: 720,
            parent: 'game-container',
            backgroundColor: '#050505',
            physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
            scene: FightingGame,
            scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH }
        };
        
        const game = new Phaser.Game(config);
    </script>
</body>
</html>
