<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>CHIYA GANG WARRIORS - ONLINE BATTLE</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wght@0,100..900;1,100..900&family=Geist:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    
    <!-- Load shared fighter data and config -->
    <script src="js/fighters.js"></script>
    <script src="js/config.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #e5e2e1;
            font-family: 'Geist', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .crt-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.15) 50%),
                        linear-gradient(90deg, rgba(255,0,0,0.03), rgba(0,255,0,0.01), rgba(0,0,255,0.03));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 900px;
            padding: 20px;
            margin: 0 auto;
        }
        
        .glass-panel {
            background: rgba(28, 27, 27, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 179, 178, 0.15);
            border-radius: 16px;
            padding: 32px;
        }
        
        .skew-btn {
            clip-path: polygon(8% 0%, 100% 0%, 92% 100%, 0% 100%);
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            cursor: pointer;
        }
        .skew-btn:active { transform: scale(0.96); }
        .skew-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .fighter-card {
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            cursor: pointer;
            border: 2px solid rgba(175, 135, 134, 0.2);
            background: rgba(20, 20, 30, 0.5);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            backdrop-filter: blur(4px);
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .fighter-card:hover { border-color: rgba(255, 179, 178, 0.5); transform: translateY(-4px); }
        .fighter-card.selected { border-color: #ffb3b2; background: rgba(255, 179, 178, 0.1); box-shadow: 0 0 30px rgba(255, 179, 178, 0.2); }
        .fighter-card .name { font-family: 'Anybody', sans-serif; font-size: 20px; font-weight: 800; color: #ffb3b2; }
        .fighter-card .archetype { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #af8786; margin-top: 4px; }
        .fighter-card .border-color { width: 40px; height: 3px; margin: 8px auto 0; border-radius: 2px; }
        
        .status-text { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #af8786; }
        .status-text .highlight { color: #00dbe9; }
        
        .hidden-panel { display: none; }
        
        /* Responsive */
        @media (max-width: 768px) {
            .glass-panel { padding: 16px; }
            .fighter-card { padding: 12px; min-height: 100px; }
            .fighter-card .name { font-size: 16px; }
        }
        @media (max-width: 480px) {
            .grid-cols-3 { grid-template-columns: repeat(2, 1fr); }
        }
        
        /* Flicker animation for status */
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .flicker { animation: flicker 1.5s infinite; }
    </style>
</head>
<body>
    <div class="crt-overlay"></div>
    
    <div class="container">
        <!-- Main Panel -->
        <div class="glass-panel">
            <!-- Header -->
            <div class="flex items-center gap-3 mb-6">
                <span class="material-symbols-outlined text-primary text-3xl">swords</span>
                <h1 class="font-display-lg text-display-lg text-primary italic tracking-tighter">ONLINE BATTLE</h1>
            </div>
            
            <!-- ===== CONNECTION PANEL ===== -->
            <div id="connection-panel">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- HOST SIDE -->
                    <div class="bg-surface-container-low/40 p-5 rounded-xl border border-outline-variant/30">
                        <h2 class="font-label-bold text-label-bold text-tertiary uppercase tracking-widest mb-3">HOST GAME</h2>
                        <p class="text-body-md text-on-surface-variant text-sm mb-4">Create a room and wait for a challenger.</p>
                        <button id="hostBtn" class="w-full skew-btn bg-tertiary text-on-tertiary py-3 font-label-bold text-label-bold hover:brightness-110 transition-all">
                            CREATE ROOM
                        </button>
                        <div id="host-status" class="text-label-sm text-on-surface-variant mt-3 text-center"></div>
                    </div>
                    
                    <!-- JOIN SIDE -->
                    <div class="bg-surface-container-low/40 p-5 rounded-xl border border-outline-variant/30">
                        <h2 class="font-label-bold text-label-bold text-tertiary uppercase tracking-widest mb-3">JOIN GAME</h2>
                        <p class="text-body-md text-on-surface-variant text-sm mb-4">Enter the room ID to join.</p>
                        <div class="flex gap-3">
                            <input id="roomIdInput" type="text" placeholder="Room ID" class="flex-1 bg-surface-container px-4 py-3 rounded-lg border border-outline-variant text-on-surface font-label-bold text-label-bold uppercase tracking-widest focus:border-tertiary focus:outline-none">
                            <button id="joinBtn" class="skew-btn bg-primary text-on-primary px-6 py-3 font-label-bold text-label-bold hover:brightness-110 transition-all">
                                JOIN
                            </button>
                        </div>
                        <div id="join-status" class="text-label-sm text-on-surface-variant mt-3 text-center"></div>
                    </div>
                </div>
            </div>
            
            <!-- ===== CONNECTED STATUS ===== -->
            <div id="connected-panel" class="hidden-panel mt-4 p-4 bg-tertiary/10 border border-tertiary/30 rounded-xl text-center">
                <p class="font-label-bold text-label-bold text-tertiary">✅ CONNECTED!</p>
                <p id="connected-status" class="text-body-md text-on-surface-variant mt-2">Waiting for opponent...</p>
            </div>
            
            <!-- ===== CHARACTER SELECT PANEL ===== -->
            <div id="character-select-panel" class="hidden-panel mt-4">
                <div class="text-center mb-6">
                    <h2 class="font-display-lg text-display-lg text-primary italic">SELECT YOUR FIGHTER</h2>
                    <p id="opponent-status" class="text-label-sm text-on-surface-variant mt-2 flicker">Waiting for opponent to choose...</p>
                </div>
                
                <!-- Fighter Grid -->
                <div id="fighter-grid" class="grid grid-cols-3 sm:grid-cols-3 md:grid-cols-3 gap-4 mb-6"></div>
                
                <!-- Confirm Button -->
                <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                    <div id="selection-status" class="text-label-sm text-on-surface-variant">
                        <span id="my-selection-text">No fighter selected</span>
                    </div>
                    <button id="confirmFighterBtn" class="skew-btn bg-primary text-on-primary px-8 py-3 font-label-bold text-label-bold hover:brightness-110 transition-all disabled:opacity-40 disabled:cursor-not-allowed" disabled>
                        CONFIRM FIGHTER
                    </button>
                </div>
                
                <!-- Error message -->
                <div id="selection-error" class="text-label-sm text-[#ff003c] mt-3 text-center hidden"></div>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="text-center mt-4">
            <p class="text-label-sm text-on-surface-variant opacity-60">© 2025 CHIYA GANG STUDIOS. ALL RIGHTS RESERVED.</p>
        </div>
    </div>

    <script>
        // ========== LOGGING ==========
        function logPeerEvent(message, type = 'info') {
            const colors = {
                info: '#00dbe9',
                success: '#4ade80',
                error: '#ff003c',
                warning: '#ffd700'
            };
            console.log(`%c[PeerJS] ${message}`, `color: ${colors[type] || '#ffffff'}`);
        }
        
        // ========== PEERJS SETUP ==========
        let peer = null;
        let conn = null;
        let isHost = false;
        let roomId = '';
        let myFighter = null;
        let opponentFighter = null;
        let myChoiceConfirmed = false;
        let opponentChoiceConfirmed = false;
        let selectedFighterCard = null;
        
        const fighters = Object.values(FIGHTERS);
        
        // ========== DOM REFS ==========
        const hostBtn = document.getElementById('hostBtn');
        const joinBtn = document.getElementById('joinBtn');
        const roomIdInput = document.getElementById('roomIdInput');
        const hostStatus = document.getElementById('host-status');
        const joinStatus = document.getElementById('join-status');
        const connectedPanel = document.getElementById('connected-panel');
        const connectedStatus = document.getElementById('connected-status');
        const charSelectPanel = document.getElementById('character-select-panel');
        const fighterGrid = document.getElementById('fighter-grid');
        const confirmFighterBtn = document.getElementById('confirmFighterBtn');
        const mySelectionText = document.getElementById('my-selection-text');
        const opponentStatus = document.getElementById('opponent-status');
        const selectionError = document.getElementById('selection-error');
        
        // ========== HELPERS ==========
        function getRandomArena() {
            const arenas = Object.keys(arenaBackgrounds);
            return arenas[Math.floor(Math.random() * arenas.length)];
        }
        
        function showError(message) {
            selectionError.textContent = message;
            selectionError.classList.remove('hidden');
            setTimeout(() => selectionError.classList.add('hidden'), 3000);
        }
        
        function updateConfirmButton() {
            if (myFighter && !myChoiceConfirmed) {
                confirmFighterBtn.disabled = false;
            } else {
                confirmFighterBtn.disabled = true;
            }
        }
        
        function checkBothReady() {
            if (myChoiceConfirmed && opponentChoiceConfirmed) {
                logPeerEvent('Both players ready! Starting game...', 'success');
                startGame();
            }
        }
        
        function startGame() {
            if (!isHost) return; // Only host initiates the start
            
            const arena = getRandomArena();
            const difficulty = 'medium';
            const controls = 'pc';
            
            // Send start message to joiner
            conn.send({
                type: 'start_game',
                hostFighter: myFighter,
                clientFighter: opponentFighter,
                arena: arena,
                difficulty: difficulty,
                controls: controls
            });
            
            // Host navigates itself
            const url = `game.html?fighter=${encodeURIComponent(myFighter)}&arena=${encodeURIComponent(arena)}&difficulty=${difficulty}&controls=${controls}&mode=online&role=host&opponent=${encodeURIComponent(opponentFighter)}`;
            logPeerEvent(`Host navigating to: ${url}`, 'info');
            window.location.href = url;
        }
        
        // ========== BUILD FIGHTER GRID ==========
        function buildFighterGrid() {
            fighterGrid.innerHTML = '';
            
            // Use first 6 fighters or all if less
            const displayFighters = fighters.slice(0, 6);
            
            displayFighters.forEach(fighter => {
                const card = document.createElement('div');
                card.className = 'fighter-card';
                card.dataset.fighter = fighter.name;
                card.style.borderColor = 'rgba(175, 135, 134, 0.2)';
                
                // Color accent
                const colorHex = '#' + (fighter.color || 0xffb3b2).toString(16).padStart(6, '0');
                
                card.innerHTML = `
                    <div class="name">${fighter.name}</div>
                    <div class="archetype">${fighter.archetype || 'FIGHTER'}</div>
                    <div class="border-color" style="background: ${colorHex};"></div>
                `;
                
                card.addEventListener('click', () => {
                    if (myChoiceConfirmed) {
                        showError('You already confirmed your fighter!');
                        return;
                    }
                    
                    // Deselect all
                    document.querySelectorAll('.fighter-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedFighterCard = card;
                    myFighter = fighter.name;
                    mySelectionText.textContent = `Selected: ${myFighter}`;
                    updateConfirmButton();
                });
                
                fighterGrid.appendChild(card);
            });
        }
        
        // ========== CONFIRM FIGHTER ==========
        confirmFighterBtn.addEventListener('click', () => {
            if (!myFighter) {
                showError('Please select a fighter first!');
                return;
            }
            
            if (myChoiceConfirmed) return;
            
            myChoiceConfirmed = true;
            confirmFighterBtn.disabled = true;
            confirmFighterBtn.textContent = 'WAITING FOR OPPONENT...';
            mySelectionText.textContent = `✅ Confirmed: ${myFighter}`;
            
            // Send selection to opponent
            if (conn && conn.open) {
                conn.send({
                    type: 'fighter_selected',
                    fighter: myFighter
                });
                logPeerEvent(`Sent fighter selection: ${myFighter}`, 'info');
            } else {
                showError('Connection lost. Please reconnect.');
                myChoiceConfirmed = false;
                confirmFighterBtn.textContent = 'CONFIRM FIGHTER';
                return;
            }
        });
        
        // ========== HOST ==========
        hostBtn.addEventListener('click', () => {
            if (peer) {
                peer.destroy();
            }
            
            hostBtn.disabled = true;
            hostBtn.textContent = 'CREATING...';
            hostStatus.textContent = 'Initializing...';
            
            peer = new Peer({
                debug: 2,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' }
                    ]
                }
            });
            
            peer.on('open', (id) => {
                isHost = true;
                roomId = id;
                hostStatus.innerHTML = `<span style="color: #4ade80;">✅ Room Created</span><br><span class="text-tertiary font-label-bold text-label-bold">Room ID: ${id}</span>`;
                hostBtn.textContent = 'ROOM CREATED';
                hostBtn.disabled = true;
                
                logPeerEvent(`Host created room: ${id}`, 'success');
                
                // Enable join with this ID (auto-fill for convenience)
                roomIdInput.value = id;
                
                // Wait for connection
                peer.on('connection', (incomingConn) => {
                    conn = incomingConn;
                    setupConnection('host');
                });
            });
            
            peer.on('error', (err) => {
                logPeerEvent(`Host error: ${err.message}`, 'error');
                hostStatus.textContent = `❌ Error: ${err.message}`;
                hostBtn.disabled = false;
                hostBtn.textContent = 'CREATE ROOM';
            });
        });
        
        // ========== JOIN ==========
        joinBtn.addEventListener('click', () => {
            const id = roomIdInput.value.trim();
            if (!id) {
                joinStatus.textContent = 'Please enter a Room ID';
                return;
            }
            
            if (peer) {
                peer.destroy();
            }
            
            joinBtn.disabled = true;
            joinBtn.textContent = 'JOINING...';
            joinStatus.textContent = 'Connecting...';
            
            peer = new Peer({
                debug: 2,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' }
                    ]
                }
            });
            
            peer.on('open', () => {
                isHost = false;
                conn = peer.connect(id);
                setupConnection('joiner');
            });
            
            peer.on('error', (err) => {
                logPeerEvent(`Join error: ${err.message}`, 'error');
                joinStatus.textContent = `❌ Error: ${err.message}`;
                joinBtn.disabled = false;
                joinBtn.textContent = 'JOIN';
            });
        });
        
        // ========== SETUP CONNECTION ==========
        function setupConnection(role) {
            if (!conn) return;
            
            conn.on('open', () => {
                logPeerEvent(`Connection opened as ${role}`, 'success');
                
                if (role === 'host') {
                    hostStatus.innerHTML = `<span style="color: #4ade80;">✅ Player connected!</span>`;
                } else {
                    joinStatus.innerHTML = `<span style="color: #4ade80;">✅ Connected to host!</span>`;
                }
                
                // Show connected panel
                document.getElementById('connection-panel').classList.add('hidden-panel');
                connectedPanel.classList.remove('hidden-panel');
                connectedStatus.textContent = role === 'host' ? 'Challenger has joined!' : 'Connected to host!';
                
                // Show character select panel
                charSelectPanel.classList.remove('hidden-panel');
                buildFighterGrid();
                
                // Send hello message (keep existing behavior)
                conn.send({ type: 'hello', message: `Hello from ${role}!` });
                
                // Update status
                logPeerEvent(`Sent hello from ${role}`, 'info');
            });
            
            conn.on('data', (data) => {
                logPeerEvent(`Received data: ${JSON.stringify(data)}`, 'info');
                
                // ===== HANDLE HELLO / ECHO (existing) =====
                if (data.type === 'hello') {
                    logPeerEvent(`Hello received: ${data.message}`, 'success');
                    // Echo back
                    conn.send({ type: 'echo', message: `Echo: ${data.message}` });
                    connectedStatus.textContent = `Connected! ${data.message}`;
                }
                
                if (data.type === 'echo') {
                    logPeerEvent(`Echo received: ${data.message}`, 'success');
                }
                
                // ===== HANDLE FIGHTER SELECTION =====
                if (data.type === 'fighter_selected') {
                    opponentFighter = data.fighter;
                    opponentChoiceConfirmed = true;
                    opponentStatus.textContent = `Opponent chose: ${data.fighter}`;
                    opponentStatus.classList.remove('flicker');
                    logPeerEvent(`Opponent selected: ${data.fighter}`, 'success');
                    checkBothReady();
                }
                
                // ===== HANDLE START GAME (joiner side) =====
                if (data.type === 'start_game') {
                    logPeerEvent(`Start game received! Host: ${data.hostFighter}, Client: ${data.clientFighter}`, 'success');
                    
                    // Joiner navigates to game
                    const url = `game.html?fighter=${encodeURIComponent(data.clientFighter)}&arena=${encodeURIComponent(data.arena)}&difficulty=${data.difficulty}&controls=${data.controls}&mode=online&role=client&opponent=${encodeURIComponent(data.hostFighter)}`;
                    logPeerEvent(`Joiner navigating to: ${url}`, 'info');
                    window.location.href = url;
                }
            });
            
            conn.on('close', () => {
                logPeerEvent('Connection closed', 'warning');
                connectedStatus.textContent = '❌ Connection lost';
                hostBtn.disabled = false;
                hostBtn.textContent = 'CREATE ROOM';
                joinBtn.disabled = false;
                joinBtn.textContent = 'JOIN';
            });
            
            conn.on('error', (err) => {
                logPeerEvent(`Connection error: ${err.message}`, 'error');
                connectedStatus.textContent = `❌ Error: ${err.message}`;
            });
        }
        
        // ========== KEYBOARD SHORTCUTS ==========
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && roomIdInput.value.trim()) {
                joinBtn.click();
            }
        });
        
        // ========== INIT ==========
        buildFighterGrid();
        logPeerEvent('Online battle page loaded', 'info');
        
        // Check if fighters loaded
        if (typeof FIGHTERS === 'undefined') {
            logPeerEvent('ERROR: fighters.js not loaded!', 'error');
        }
        if (typeof arenaBackgrounds === 'undefined') {
            logPeerEvent('ERROR: config.js not loaded!', 'error');
        }
    </script>
</body>
</html>
